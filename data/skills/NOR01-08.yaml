    checkpoint: 7
    refs: [KM14171]
    needs: [nor.grammar.word-meanings]
    i_can:
      nob: Jeg vet hva et uttrykk betyr når det ikke er bokstavelig.
      eng: I know what an expression means when not meant literally.
