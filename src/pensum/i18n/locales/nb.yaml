# Bokmål is the source locale. Add a string here first, then to en.yaml --
# the i18n-key-parity check fails the build if the two drift apart.
---
site:
  name: Pensum
  tagline: Hva skal du kunne i norsk skole?
  description: >-
    Kompetansemålene fra læreplanen, og quizer for å øve på dem.

nav:
  home: Forsiden
  language: Språk
  about: Om Pensum
  comfort: Innstillinger

home:
  heading: Hvilket trinn går du på?
  intro: >-
    Velg klassetrinn for å se hva du skal kunne, og prøv deg på en quiz.
  grade: "{grade}. klasse"

grade:
  heading: "{grade}. klasse"
  subjects_heading: Fag
  goal_count: "{count} kompetansemål"
  no_subjects: Vi har ikke noe innhold for dette trinnet ennå.

subject:
  # The distinction the whole page turns on: a pupil in their checkpoint year is
  # being told what they should already master, everyone else what they are
  # working towards.
  mastery_now: Dette skal du kunne etter {year}. trinn
  working_towards: Dette jobber du mot fram til {year}. trinn
  working_towards_note: >-
    Du går i {grade}. klasse, og målene nedenfor gjelder fram til slutten av
    {year}. trinn. Du trenger altså ikke kunne alt ennå.
  goals_heading: Kompetansemål
  source_link: Se målet hos Udir
  quiz_cta: Ta quizen
  quiz_unavailable: Quiz kommer snart for dette faget.
  reading_cta: Les høyt
  writing_cta: Skriv bokstavene
  listening_cta: Hør og skriv

coverage:
  # Honest about reach: a quiz cannot test every kompetansemål, and the count
  # says how many it does. Kept subject-neutral -- norsk leaves out writing and
  # speaking, matematikk leaves out programming, so the note names the LK20 verbs
  # that recur rather than any one skill.
  summary: Quizen dekker {tested} av {total} kompetansemål på dette trinnet.
  all: Quizen dekker alle kompetansemålene på dette trinnet.
  note: >-
    Noen kompetansemål kan ikke testes i en quiz — for eksempel å utforske,
    samtale om eller lage noe selv. De er merket nedenfor.
  in_quiz: I quizen
  not_in_quiz: Ikke i quizen
  result_note: >-
    Quizen dekket {tested} av {total} kompetansemål på dette trinnet. Noen mål
    kan ikke testes i en quiz.

curriculum:
  # Shown wherever official text appears, so Udir's words are never mistaken for
  # ours. This is an NLOD condition, not decoration.
  verbatim_note: >-
    Teksten nedenfor er gjengitt ordrett fra læreplanen.
  attribution: >-
    Inneholder data under NLOD, tilgjengeliggjort på data.udir.no.
  nynorsk_notice: >-
    Dette faget er fastsatt på nynorsk, og vises derfor på nynorsk.

disclaimer:
  short: Pensum er et uoffisielt hjelpemiddel, ikke et vurderingsverktøy.
  long: >-
    Pensum er laget for å øve, ikke for å vurdere. Å klare en quiz her betyr
    ikke at du består et trinn, og å bomme betyr ikke at du ikke gjør det.
    Pensum er ikke tilknyttet Utdanningsdirektoratet.

footer:
  source: Kilde
  licence: Lisens
  code: Kildekode

quiz:
  start: Ta quizen
  intro: "{count} spørsmål fra dette trinnet. Du får svaret forklart underveis."
  progress: Spørsmål {number} av {total}
  check: Sjekk svaret
  next: Neste spørsmål
  see_result: Se resultatet
  your_answer: Du svarte
  correct_answer: Riktig svar
  correct: Riktig!
  incorrect: Ikke helt.
  numeric_placeholder: Skriv et tall
  text_placeholder: Skriv svaret
  # The marker and the box are two ways into the same answer, both always
  # on the page: dragging is the point of the question, typing is what is
  # left when a pointer is hard to use or the script never ran.
  number_line_drag: Dra merket dit svaret hører hjemme, eller skriv tallet.
  number_line_typed: Eller skriv tallet
  number_line_unset: Ikke plassert ennå
  number_line_at: Merket står på {value}
  # Ours, not Udir's -- and the page must never blur that line.
  authored_note: >-
    Spørsmålene er laget av Pensum, ikke hentet fra læreplanen.

result:
  heading: Slik gikk det
  score: Du fikk {correct} av {total} riktig.
  passed: Flott jobba! Du har god kontroll på dette trinnet.
  not_passed: God innsats! Her er det litt igjen å øve på.
  # Deliberately not "du bestod / strøk". Pensum cannot decide that.
  not_a_verdict: >-
    Dette er en øving, ikke en vurdering. Resultatet sier bare hvordan det gikk
    med disse spørsmålene i dag.
  strong_heading: Dette får du til
  practice_heading: Dette kan du øve mer på
  try_again: Prøv igjen
  back_to_subject: Tilbake til faget

reading:
  heading: Les høyt
  intro: >-
    Velg en tekst, les den høyt, og se hvor fort og hvor nøyaktig du leser.
  # Alltid et bånd, aldri en grense. Formuleringen skal tåle at et barn som
  # ligger utenfor båndet leser helt fint.
  band: >-
    Etter {year}. trinn leser mange mellom {low} og {high} riktige ord i
    minuttet. Det er et vanlig område, ikke et krav.
  word_count: "{count} ord"
  authored_note: >-
    Tekstene er skrevet av Pensum, ikke hentet fra læreplanen.

  # Sies før mikrofonen slås på, ikke etterpå.
  privacy_checked: >-
    Opptaket blir behandlet i minnet på denne serveren mens du får svaret, og
    blir så borte. Det lagres ikke, sendes ikke videre, og knyttes ikke til deg.
  privacy_timed: >-
    Her tas det ikke opp lyd. Pensum tar bare tiden, og stoler på at du leser
    hele teksten.

  start: Start lesingen
  stop: Ferdig
  working: Regner ut …
  speech_blocked: >-
    Nettleseren ville ikke kjenne igjen tale. På iPhone og iPad må diktering
    være slått på under Innstillinger, Generelt, Tastatur. Vi tar tiden i
    stedet, uten å sjekke opplesningen.
  speech_unsupported: >-
    Nettleseren kjenner ikke igjen dette språket. Vi tar tiden i stedet, uten
    å sjekke opplesningen.
  heat: Hvor mange ord du har lest riktig på rad
  mic_denied: >-
    Pensum fikk ikke tilgang til mikrofonen. Vi tar tiden i stedet, uten å
    sjekke opplesningen.
  failed: Noe gikk galt. Prøv en gang til.
  noscript: >-
    Uten JavaScript tar ikke Pensum tiden. Teksten kan fortsatt leses høyt — det
    er selve øvingen.

  result_heading: Slik leste du
  wpm_checked: riktige ord i minuttet
  wpm_timed: ord i minuttet
  too_short: >-
    Lesingen ble for kort til å måle. Prøv igjen, og les litt mer av teksten.
  accuracy: "{percentage} % riktig — {correct} av {attempted} ord du kom til."
  stopped_early: Du kom til ord {read} av {total}. Farten er regnet ut av det du rakk.
  timed_only: >-
    Dette er bare tiden delt på antall ord i teksten. Ingen har sjekket hvordan
    du leste.

  band_within: Det er midt i det vanlige området for dette trinnet ({low}–{high}).
  band_above: Det er raskere enn det vanlige området for dette trinnet ({low}–{high}).
  band_below: >-
    Det er langsommere enn det vanlige området for dette trinnet ({low}–{high}).
    Fart kommer med lesing — det er ingenting i veien med å bruke tid.
  band_timed: Vanlig område for dette trinnet er {low}–{high} ord i minuttet.

  # Gamification. The wording carries the weight here: a badge that reads as a
  # mark would contradict every other sentence on the page.
  progress: Hvor langt du har lest
  badge_finished: Hele teksten lest
  badge_band: I mål for trinnet
  stars_label: "{stars} av {max} stjerner"
  stars_caveat: >-
    Stjernene kommer fra hvor mange ord maskinen kjente igjen. Den hører dårlig
    på barn, dialekt og andrespråk, så få stjerner betyr ofte at maskinen tok
    feil — ikke at du leste dårlig.
  replay: Se lesingen om igjen
  replay_real: Ordene lyser opp når du faktisk leste dem.
  replay_even: >-
    Ingen lyttet, så ordene lyser opp i jevnt tempo. Det er ikke slik du leste.
  again: Les en gang til

  # Regnes ut i nettleseren din og sendes aldri til serveren. Pensum vet ikke at
  # du har lest den samme teksten før.
  first_time: Første gang du leser denne. Nå har du noe å slå.
  new_best: "Ny rekord — {delta} ord i minuttet raskere enn før."
  previous_best: "Rekorden din på denne teksten er {best}."
  # Dager denne uken, ikke dager på rad: en dag uten lesing nullstiller
  # ingenting (principles.md, «Hva spillifisering får lov til»).
  week: "Dager du har lest denne uken: {days}"

  # Sies før mikrofonen slås på. Hvilken gjenkjenner som lytter, er ikke en
  # detalj: den ene sender ingenting noe sted, den andre sender stemmen til
  # nettleserleverandøren.
  device_local: >-
    Enheten din kjenner igjen lesingen selv. Lyden forlater ikke telefonen eller
    maskinen din, og Pensum får bare teksten.
  device_cloud: >-
    Bruk nettleserens egen talegjenkjenning. På denne nettleseren kan stemmen
    din bli sendt til den som har laget nettleseren, ikke bare til Pensum. Du
    velger selv.

  # Uttale teller ikke. Å lese feil ord gjør det.
  close_matches: >-
    {count} ord ble godkjent selv om maskinen hørte dem litt annerledes. Uttale
    og dialekt teller ikke som feil.

  misread_heading: Ord som ikke ble hørt
  misread_note: >-
    Her står bare ord maskinen mente var et annet ord — ikke ord du uttalte litt
    annerledes. Maskinen hører likevel dårlig på barnestemmer og dialekt, så
    står et ord her, kan det fortsatt være maskinen som tok feil.
  not_a_verdict: >-
    Dette er en øving, ikke en vurdering. Lesefart varierer mye mellom barn som
    alle leser godt, og et tall her sier ingenting om hvem som er en god leser.

rights:
  # Lenkes fra bunnteksten på alle sider. En kontaktadresse ingen finner, er
  # ingen kontaktadresse.
  link: Rettigheter
  heading: Rettigheter og henvendelser
  intro: >-
    Pensum viser tre slags innhold, og de har tre ulike eiere. Her står det hvem
    som eier hva, og hvor du skriver hvis du mener vi har tatt feil.

  what_heading: Hva som er hvem sitt
  curriculum_title: "Læreplantekst:"
  curriculum_body: >-
    Kompetansemålene er Utdanningsdirektoratets, gjengitt ordrett og hentet fra
    det åpne Grep-APIet. De videreformidles under
  authored_title: "Quizspørsmål og lesetekster:"
  authored_body: >-
    Disse er skrevet for Pensum. Ingen av dem er hentet fra bøker, sangtekster,
    undertekster eller andre verk. De ligger i klartekst i kodelageret, slik at
    hvem som helst kan se hva de er.
  code_title: "Koden:"
  code_body: Kildekoden er åpen under MIT-lisensen.

  report_heading: Melde fra om innhold
  report_intro: >-
    Mener du at noe her er ditt og ikke skulle vært publisert, vil vi vite det.
    Skriv til
  report_what: Hva det gjelder — hvilken tekst, hvilket spørsmål, hvilken side.
  report_where: Lenke til siden der du så det.
  report_who: Hvem du er, og hvilket forhold du har til verket.
  report_why: Hvorfor du mener det er ditt.
  report_response: >-
    Vi tar innholdet ned mens vi ser på saken, og svarer deg. Vi krever ingen
    skjemaer og ingen advokat for å komme i gang.
  # Sies rett ut i stedet for å antydes: DMCA er navnet folk søker etter, ikke
  # en påstand om hvilket lands rett som gjelder.
  jurisdiction: >-
    «DMCA» er navnet de fleste kjenner denne prosessen under. Pensum er et
    norsk prosjekt, og en henvendelse hit behandles etter norsk rett — men du
    trenger ikke vite hva prosessen heter for å skrive til oss.

  audio_heading: Lydopptak
  audio_body: >-
    Leser du høyt, blir opptaket behandlet i minnet mens du får svaret, og så
    er det borte. Det lagres ikke, deles ikke, og knyttes ikke til deg. Det
    finnes derfor ingen opptak å be om innsyn i eller sletting av.

review:
  # Vises bare for den som har lov til å se utkast. En elev får aldri servert et
  # uleste spørsmål i det hele tatt.
  draft: Utkast — ikke gjennomgått
  draft_note: >-
    Du ser også innhold ingen har lest gjennom ennå, fordi du er logget inn som
    administrator. Elever ser bare det som er merket som gjennomgått.

  # Gjennomgangssiden. Her avgjøres det hva elever faktisk får se, så ordlyden
  # skal si hva knappen gjør, ikke hva den heter.
  link: Gjennomgang
  heading: Gjennomgang av innhold
  intro: >-
    Spørsmål, lesetekster og skriveoppgaver, slik en elev ville møtt dem. Godkjenn
    det denne skolen skal bruke, og avvis resten — både det som ikke holder mål,
    og det som holder mål andre steder enn her.
  database_note: >-
    Valgene her gjelder denne installasjonen, og lagres i databasen her — ikke i
    filene. De virker med en gang, uten ny utgivelse, og de følger ikke med til
    andre skoler som kjører Pensum. Hva denne skolen viser, står altså her og
    ikke i kodelageret.
  counts: '{pending} venter · {published} publisert · {rejected} avvist'
  filter_label: Filtrer
  filter:
    pending: Venter
    published: Publisert
    rejected: Avvist
    all: Alt
  kind:
    all: Alle typer
    item: Spørsmål
    reading: Lesetekst
    writing: Skriveoppgave
  state:
    pending: Venter på gjennomgang
    published: Publisert
    rejected: Avvist
  overridden: Overstyrer fila
  after_year: 'etter {year}. trinn'
  meta: '{id} · vanskegrad {difficulty}'
  decided_by: 'avgjort av {name}'
  answer: 'Riktig svar: {answer}'
  approve: Godkjenn
  reject: Avvis
  clear: Fjern avgjørelsen
  nothing_here: Ingenting her.

auth:
  # Innlogging er valgfritt. Teksten skal aldri antyde at man må logge inn for
  # å ta en quiz -- det må man ikke.
  account: Konto
  sign_in: Logg inn
  sign_out: Logg ut
  signed_in_as: "Logget inn som {name}"
  failed: >-
    Innloggingen gikk ikke gjennom. Du kan fortsatt ta alle quizene uten å
    logge inn.
  recorded_note: >-
    Du er logget inn, så resultatet blir lagret og kan ses av en voksen med
    tilgang.

admin:
  link: Resultater
  heading: Resultater
  intro: >-
    Elever som har vært innlogget og fullført minst én quiz.
  # Samme forbehold som eleven selv får se. En voksen som leser en tabell med
  # prosenter er mer utsatt for å lese den som en vurdering, ikke mindre.
  not_a_verdict: >-
    Dette er øving, ikke vurdering. Tallene sier hvordan det gikk med akkurat
    disse spørsmålene, ikke om eleven har nådd kompetansemålene.
  share: "{percentage} % ({correct} av {total})"
  no_attempts: Ingen har fullført en quiz mens de var innlogget ennå.
  back: Tilbake til oversikten
  grade: "{grade}. klasse"
  goals_heading: Kompetansemål i denne quizen
  column:
    pupil: Elev
    attempts: Quizer
    average: Snitt
    latest: Sist

placement:
  # The nivåtest. Framed throughout as finding where you are, never as a verdict
  # on what you are worth -- the ceiling is the strongest claim Pensum makes
  # about a child, so the wording carries most of the honesty.
  cta: Finn nivået ditt
  cta_note: Vi starter lett og justerer underveis.
  heading: Hvilket nivå er du på i {subject}?
  intro: >-
    Du får noen spørsmål om gangen. Klarer du dem, blir de vanskeligere. Bommer
    du, blir de lettere. Slik finner vi hva du får til nå.
  grade_question: Hvilket trinn går du på?
  grade_help: >-
    Vi bruker det bare til å velge hvor vi starter. Du kan havne både over og
    under.
  grade_unknown: Jeg vet ikke
  start: Start nivåtesten
  # No total: an adaptive test has not decided how long it is, and a progress
  # bar out of an invented number would be a lie that moves.
  progress: "Spørsmål {number}"
  length_note: >-
    Testen er ferdig når vi vet nok. Det tar som regel 10–25 spørsmål.

placement_result:
  heading: Slik ligger du an
  # The three end states, which mean different things and must not be blurred.
  ceiling: Du har god kontroll på det vi kan teste etter {year}. trinn.
  ceiling_span: Du har god kontroll på det vi kan teste for {first}.–{last}. trinn.
  frontier: Nå jobber du med {year}. trinn.
  frontier_span: Nå jobber du med {first}.–{last}. trinn.
  topped_out: >-
    Du klarte det høyeste trinnet vi har spørsmål til i dette faget. Da har ikke
    testen mer å måle med.
  nothing_yet: >-
    Vi fant ikke et trinn å måle fra denne gangen. Det betyr ikke at du ikke kan
    noe — bare at spørsmålene her ikke traff. Prøv gjerne igjen.
  inconclusive: >-
    Testen ble ferdig før vi rakk å finne nivået sikkert. Det som står nedenfor
    stemmer, men det er ikke hele bildet.
  not_a_verdict: >-
    Dette er en øving, ikke en vurdering. Testen sier hvordan det gikk med disse
    spørsmålene i dag, ikke hva du er god for.
  coverage_note: >-
    Quizen for dette trinnet dekker {tested} av {total} kompetansemål. Mange mål
    handler om å samtale, utforske eller lage noe, og kan ikke testes skriftlig.
  thin_evidence: >-
    Hvert mål her er testet med ett eller to spørsmål. Det er nok til å vise hva
    du kan se nærmere på, men ikke nok til å si at du ikke får det til.
  gaps_heading: Dette er verdt å øve på
  gaps_intro: >-
    Målene nedenfor er de du bommet på underveis.
  no_gaps: Du svarte riktig på alt du fikk.
  answered: "{correct} av {total} riktig"
  retake: Ta testen på nytt
  see_curriculum: Se hele trinnet

writing:
  heading: Skriv med fingeren
  intro: >-
    Velg en bokstavgruppe, og skriv bokstavene med fingeren. Prikken viser hvor
    du skal begynne, og tallet viser rekkefølgen.
  # Sagt før eleven velger, ikke etter at de har åpnet noe som ikke virker.
  touch_note: >-
    Denne øvingen er laget for nettbrett og mobil. Den virker med mus også, men
    da øver du på musa og ikke på håndskriften.
  mouse_note: >-
    Denne maskinen har ingen berøringsskjerm. Du kan tegne med musa, men det er
    noe annet enn å skrive.
  character_count: "{count} tegn"
  authored_note: >-
    Bokstavformene er laget for Pensum, ikke hentet fra læreplanen.

  # Sies før fingeren treffer skjermen, ikke i en personvernerklæring.
  privacy: >-
    Pensum ser hvor fingeren din gikk mens du får svaret, og glemmer det etterpå.
    Ingenting lagres, og ingenting knyttes til deg.

  meter: Hvor mye av bokstaven du har skrevet
  position: Bokstav {at} av {total}
  trace_label: "Skriv bokstaven {char}"
  show_me: Vis meg
  clear: Prøv igjen
  next: Neste bokstav
  finish: Ferdig
  working: Regner ut …
  failed: Noe gikk galt. Prøv en gang til.
  noscript: >-
    Uten JavaScript kan du ikke skrive på skjermen her. Bokstavene står igjen
    med linjer og startprikker, så arket kan skrives ut og brukes med blyant.

  result_heading: Slik skrev du
  # Formuleringene navngir feilen i stedet for å trekke fra i det stille. En
  # sjuåring kan gjøre noe annet neste gang med «du gikk motsatt vei»; 71 % er
  # ingenting å gjøre med.
  not_written: ikke skrevet
  missed_strokes: "{count} strek mangler"
  backwards: "{count} strek gikk motsatt vei"
  out_of_order: strekene kom i en annen rekkefølge
  stopped_early: Du skrev {written} av {total} bokstaver.
  again: Prøv hele gruppen igjen
  badge_finished: Alle bokstavene skrevet
  badge_even: Jevnt gjennom hele
  stars_label: "{stars} av {max} stjerner"
  score_caveat: >-
    Prosenten sier hvor nær fingeren fulgte linjen på en skjerm. En finger er
    bredere enn en blyant, og tallet er derfor grovere enn det ser ut.
  not_a_verdict: >-
    Dette er øving, ikke vurdering. Håndskrift læres med blyant og en voksen ved
    siden av; dette er en måte å øve på formen mellom øktene.

listening:
  heading: Hør ordet
  intro: >-
    Datamaskinen leser et ord høyt. Du velger eller skriver hvordan det staves.
  # Sagt før det første ordet blir lest, ikke i en personvernerklæring. Det
  # finnes ingen mikrofon på denne siden.
  privacy: >-
    Nettleseren din leser ordene høyt. Ingenting blir tatt opp, ingenting blir
    sendt, og svarene dine forsvinner når du har fått resultatet.
  authored_note: >-
    Ordene er hentet fra lesetekstene i Pensum, og de gale alternativene er laget
    av vanlige skrivefeil.

  position: Ord {at} av {total}
  say_again: Si det igjen
  pick_label: Velg ordet du hørte
  write_label: Skriv ordet du hørte
  next: Neste ord
  finish: Ferdig
  working: Retter …
  failed: Noe gikk galt. Prøv en gang til.
  # Vises når nettleseren ikke har noen stemme for språket. Da er det ingen
  # øving igjen -- å gjette mellom to skrivemåter uten å høre ordet er myntkast.
  no_voice: >-
    Denne nettleseren har ingen stemme for dette språket, så ordene kan ikke
    leses høyt. Prøv en annen nettleser, eller legg til en stemme i
    innstillingene på maskinen.
  noscript: >-
    Denne øvingen trenger JavaScript, fordi det er nettleseren som leser ordene
    høyt.

  result_heading: Slik skrev du
  score: "{right} av {total} riktig"
  right: riktig
  not_answered: ikke svart
  you_wrote: "du skrev {given}"
  again: Prøv igjen
  badge_finished: Alle ordene besvart
  stars_label: "{stars} av {max} stjerner"
  not_a_verdict: >-
    Dette er øving, ikke vurdering. Rettskriving læres over år, og et ord du
    bommer på her er et ord du kan øve på.

progression:
  # Lærerens oversikt over et fag: ferdigheter i rader per tråd, sjekkpunkter
  # bortover. Ferdighetene er vår lesing av læreplanen, aldri Udirs tekst.
  title: "Progresjon i {subject}"
  intro: >-
    Hver tråd i faget, fra første til siste sjekkpunkt. Hver ferdighet er én
    ting en lærer kan se at en elev får til, eller ikke får til ennå, med
    kompetansemålene den bygger på.
  ours_note: >-
    Ferdighetene er Pensums egen lesing av læreplanen, ikke Utdanningsdirektoratets
