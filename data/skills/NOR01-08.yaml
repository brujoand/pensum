    i_can:
      nob: Jeg kan tilpasse teksten til hvem som skal lese den.
      eng: I can fit my text to who will read it.
    teacher:
      nob: "Velger den versjonen av en melding som passer til en rektor og til en venn, og til e-post eller chat, og forklarer hvorfor. Ikke ennå: skriver likt til alle."
      eng: "Picks the version of a message that fits a headteacher or a friend, email or chat, and says why. Not yet: writes the same to everyone."
