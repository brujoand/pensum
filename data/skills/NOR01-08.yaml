      nob: Jeg kan skumlese og lete raskt etter ett svar.
      eng: I can skim a text and scan for one answer.
    teacher:
      nob: "Finner et årstall i en lang tekst uten å lese alt, og sier hva teksten handler om etter å ha skumlest. Ikke ennå: leser alt fra start hver gang."
      eng: "Finds a year in a long text without reading it all, and gives the gist after skimming. Not yet: reads every word from the start every time."
    stages: [abstract]
    misconceptions: []
    assessable: true

  - id: nor.reading.pick-a-strategy
    strand: reading
    checkpoint: 7
