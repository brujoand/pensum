    strand: earth-space
    checkpoint: 7
    refs: [KM13846]
    needs: [nat.earth-space.day-and-night]
    i_can:
      nob: Jeg kan forklare hvorfor månen ser ulik ut.
      eng: I can explain why the moon changes shape.
    teacher:
      nob: "Forklarer at vi ser ulike deler av månens solbelyste side når den går rundt jorda. Ikke ennå: sier at jordas skygge lager månefasene."
      eng: "Explains that we see different parts of the moon's sunlit side as it circles Earth. Not yet: says Earth's shadow makes the phases."
    stages: [concrete, pictorial]
    misconceptions: [phases-are-earth-shadow]
    assessable: true
    reviewed: false

  - id: nat.earth-space.why-seasons
    strand: earth-space
    checkpoint: 7
    refs: [KM13846]
    needs: [nat.earth-space.day-and-night]
    i_can:
      nob: Jeg kan forklare hvorfor vi har årstider.
      eng: I can explain why we have seasons.
    teacher:
      nob: "Forklarer årstidene med jordaksens helning og hvordan det påvirker liv, som mørketid og midnattssol. Ikke ennå: sier at det er sommer når jorda er nærmest sola."
      eng: "Explains the seasons by the tilt of Earth's axis and how that affects life, such as polar night and midnight sun. Not yet: says it is summer when Earth is closest to the sun."
    stages: [concrete, pictorial, abstract]
    misconceptions: [seasons-from-distance-to-sun]
    assessable: true
    reviewed: false

  - id: nat.earth-space.conditions-for-life
    strand: earth-space
    checkpoint: 7
    refs: [KM13847]
    needs: [nat.earth-space.water-for-life]
    i_can:
      nob: Jeg kan forklare hva som trengs for liv på en planet.
      eng: I can explain what a planet needs for life.
    teacher:
      nob: "Nevner flytende vann, passe temperatur og atmosfære, og sammenligner jorda med Mars eller Venus. Ikke ennå: nevner bare luft."
      eng: "Names liquid water, a suitable temperature and an atmosphere, and compares Earth with Mars or Venus. Not yet: names only air."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.earth-space.rock-cycle
    strand: earth-space
    checkpoint: 7
    refs: [KM13848]
    needs: []
    i_can:
      nob: Jeg kan forklare hvordan landskap formes og endres.
      eng: I can explain how landscapes are shaped and changed.
    teacher:
      nob: "Forklarer bergartenes kretsløp og hvordan is, vann og vind former landskapet, for eksempel en fjord. Ikke ennå: tror fjell alltid har sett slik ut."
      eng: "Explains the rock cycle and how ice, water and wind shape land, for example a fjord. Not yet: thinks mountains have always looked the same."
    stages: [pictorial, abstract]
    misconceptions: [landscape-never-changes]
    assessable: true
    reviewed: false

  - id: nat.body-health.organ-systems
    strand: body-health
    checkpoint: 7
    refs: [KM13850]
    needs: [nat.body-health.muscles-skeleton]
    i_can:
      nob: Jeg kan beskrive hvordan organsystemer i kroppen samarbeider.
      eng: I can describe how body systems work together.
    teacher:
      nob: "Merker av fordøyelse, blodomløp og åndedrett, og forklarer at blodet frakter oksygen og næring fra de andre. Ikke ennå: beskriver hvert organ for seg."
      eng: "Labels digestion, circulation and breathing, and explains that blood carries oxygen and nutrients from the others. Not yet: describes each organ on its own."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.body-health.puberty
    strand: body-health
    checkpoint: 7
    refs: [KM13849]
    needs: [nat.body-health.body-differences]
    i_can:
      nob: Jeg kan forklare hvordan kroppen og følelsene endrer seg i puberteten.
      eng: I can explain how body and feelings change in puberty.
    teacher:
      nob: "Beskriver fysiske endringer og at hormoner kan påvirke følelser og seksualitet, og vet at tidspunktet varierer. Ikke ennå: kjenner bare til ett kjønns endringer."
      eng: "Describes physical changes and that hormones can affect feelings and sexuality, and knows the timing varies. Not yet: knows the changes for one sex only."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false
    sensitive: true  # see docs/design/subjects/naturfag.md

  - id: nat.technology.program-a-system
    strand: technology
    checkpoint: 7
    refs: [KM13838]
    needs: [nat.technology.parts-of-a-system]
    i_can:
      nob: Jeg kan programmere noe som består av flere deler.
      eng: I can program something that is made of several parts.
    teacher:
      nob: "Programmerer et klassesett (micro:bit eller lignende) slik at en sensor styrer en annen del. Ikke ennå: kopierer kode uten å kunne si hva delene gjør."
      eng: "Programs a classroom kit (micro:bit or similar) so that a sensor controls another part. Not yet: copies code without saying what the parts do."
    stages: [concrete]
    misconceptions: []
    assessable: false
    reviewed: false

  - id: nat.technology.design-for-a-user
    strand: technology
    checkpoint: 7
    refs: [KM13839]
    needs: [nat.technology.build-to-spec]
    i_can:
      nob: Jeg kan lage et produkt som passer til en bruker.
      eng: I can make a product that fits what a user needs.
    teacher:
      nob: "Finner ut hva brukeren trenger, bygger, og tester produktet mot behovet. Ikke ennå: bygger det hen selv liker, uten å spørre brukeren."
      eng: "Finds out what the user needs, builds, and tests the product against that need. Not yet: builds what they like without asking the user."
    stages: [concrete]
    misconceptions: []
    assessable: false
    reviewed: false

  - id: nat.technology.technology-dilemmas
    strand: technology
    checkpoint: 7
    refs: [KM13840]
    needs: [nat.technology.parts-of-a-system]
    i_can:
      nob: Jeg kan gi eksempler på fordeler og ulemper ved en teknologi.
      eng: I can give pros and cons of a technology.
    teacher:
      nob: "Nevner hva en teknologi løser og hvilket nytt problem den kan skape (mobiltelefonen, plast). Ikke ennå: ser bare fordelene eller bare ulempene."
      eng: "Names what a technology solves and what new problem it may create (mobile phones, plastic). Not yet: sees only the benefits or only the drawbacks."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.sustainability.science-develops
    strand: sustainability
    checkpoint: 7
    refs: [KM13837]
    needs: []
    i_can:
      nob: Jeg kan gi eksempler på hvordan naturfaglig kunnskap har endret seg.
      eng: I can give examples of how science knowledge has changed.
    teacher:
      nob: "Gir et eksempel på noe forskere en gang trodde og senere endret (jorda i sentrum, bakterier og sykdom). Ikke ennå: tror naturfag er ferdige fakta."
      eng: "Gives an example of something scientists once believed and later changed (Earth at the centre, germs and disease). Not yet: thinks science is finished facts."
    stages: [pictorial, abstract]
    misconceptions: [science-is-finished]
    assessable: true
    reviewed: false

  - id: nat.sustainability.traditional-knowledge
    strand: sustainability
    checkpoint: 7
    refs: [KM13851]
    needs: []
    i_can:
      nob: Jeg kan gi eksempler på tradisjonell kunnskap om naturen.
      eng: I can give examples of traditional knowledge about nature.
    teacher:
      nob: "Gir eksempler som værtegn, plantemedisin eller samisk snøkunnskap, og hvordan det har bidratt til naturfag. Ikke ennå: kaller all tradisjonell kunnskap overtro."
      eng: "Gives examples such as weather signs, plant medicine or Sami snow knowledge, and how they have fed into science. Not yet: calls all traditional knowledge superstition."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.sustainability.protect-biodiversity
    strand: sustainability
    checkpoint: 7
    refs: [KM13853, KM13844]
    needs: [nat.sustainability.sustainable-use, nat.living-things.biodiversity]
    i_can:
      nob: Jeg kan foreslå tiltak som tar vare på artsmangfoldet.
      eng: I can suggest ways to protect the variety of species.
    teacher:
      nob: "Foreslår konkrete tiltak lokalt og i nordområdene, som å la død ved ligge eller verne et område. Ikke ennå: foreslår bare å ikke kaste søppel."
      eng: "Suggests concrete measures locally and in northern areas, such as leaving dead wood or protecting an area. Not yet: only suggests not littering."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.sustainability.northern-nature-management
    strand: sustainability
    checkpoint: 7
    refs: [KM13844]
    needs: [nat.sustainability.traditional-knowledge]
    i_can:
      nob: Jeg kan gi eksempler på tradisjonell kunnskap i naturforvaltning i nord.
      eng: I can give examples of traditional knowledge in managing northern nature.
    teacher:
      nob: "Gir et eksempel på hvordan tradisjonell kunnskap brukes i forvaltning, for eksempel reindrift og beite. Ikke ennå: kjenner ikke til noen eksempler."
      eng: "Gives an example of traditional knowledge used in management, for example reindeer herding and grazing. Not yet: knows no examples."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  # --------------------------------------------------------------- etter 10.
  - id: nat.inquiry.dependent-independent
    strand: inquiry
    checkpoint: 10
    refs: [KM13854]
    needs: [nat.inquiry.name-variables]
    i_can:
      nob: Jeg kan skille avhengig og uavhengig variabel.
      eng: I can tell dependent and independent variables apart.
    teacher:
      nob: "Navngir avhengig, uavhengig og kontrollerte variabler i et forsøk hen har planlagt selv. Ikke ennå: bytter om avhengig og uavhengig."
      eng: "Names the dependent, independent and controlled variables in an investigation they planned. Not yet: swaps dependent and independent."
    stages: [abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.inquiry.explain-with-theory
    strand: inquiry
    checkpoint: 10
    refs: [KM13855]
    needs: [nat.inquiry.observation-vs-conclusion]
    i_can:
      nob: Jeg kan forklare data med relevant teori.
      eng: I can explain data using relevant theory.
    teacher:
      nob: "Analyserer data og knytter forklaringen til en teori (partikkelmodellen, energibevaring). Ikke ennå: beskriver dataene uten å forklare dem."
      eng: "Analyses data and ties the explanation to a theory (the particle model, energy conservation). Not yet: describes the data without explaining it."
    stages: [abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.inquiry.judge-investigation
    strand: inquiry
    checkpoint: 10
    refs: [KM13855]
    needs: [nat.inquiry.sources-of-error]
    i_can:
      nob: Jeg kan vurdere kvaliteten på en undersøkelse.
      eng: I can judge the quality of an investigation.
    teacher:
      nob: "Vurderer egen og andres undersøkelse etter antall målinger, kontroll av variabler og feilkilder. Ikke ennå: vurderer etter om resultatet ble som forventet."
      eng: "Judges their own and others' investigations by number of trials, variable control and sources of error. Not yet: judges by whether the result was expected."
    stages: [abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.inquiry.model-limits
    strand: inquiry
    checkpoint: 10
    refs: [KM13856]
    needs: [nat.inquiry.why-models]
    i_can:
      nob: Jeg kan forklare styrker og svakheter ved en modell.
      eng: I can explain a model's strengths and limits.
    teacher:
      nob: "Bruker en modell til å forutsi og sier hva den ikke kan forklare (atommodellen, klimamodeller). Ikke ennå: tror en god modell er riktig i alt."
      eng: "Uses a model to predict and says what it cannot explain (the atomic model, climate models). Not yet: thinks a good model is right about everything."
    stages: [abstract]
    misconceptions: [model-is-a-copy]
    assessable: true
    reviewed: false

  - id: nat.materials.risk-assessment
    strand: materials
    checkpoint: 10
    refs: [KM13857]
    needs: [nat.materials.hazard-symbols]
    i_can:
      nob: Jeg kan fylle ut et risikokort før et forsøk.
      eng: I can fill in a risk card before an experiment.
    teacher:
      nob: "Fyller ut risikokortet før forsøket og følger sikkerhetstiltakene. Ikke ennå: fyller ut kortet etter forsøket."
      eng: "Fills in the risk card before the experiment and follows the safety measures. Not yet: fills in the card afterwards."
    stages: [concrete]
    misconceptions: []
    assessable: false
    reviewed: false

  - id: nat.materials.mass-conservation
    strand: materials
    checkpoint: 10
    refs: [KM13861]
    needs: [nat.materials.chemical-reactions]
    i_can:
      nob: Jeg kan forklare at massen er bevart i en kjemisk reaksjon.
      eng: I can explain that mass is conserved in a reaction.
    teacher:
      nob: "Forklarer at atomene bare stokkes om, og regner ut massen av en gass som slapp ut. Ikke ennå: sier at stoff forsvinner når noe brenner."
      eng: "Explains that atoms are only rearranged, and works out the mass of a gas that escaped. Not yet: says matter disappears when something burns."
    stages: [concrete, abstract]
    misconceptions: [burning-destroys-matter]
    assessable: true
    reviewed: false

  - id: nat.materials.combustion
    strand: materials
    checkpoint: 10
    refs: [KM13861]
    needs: [nat.materials.mass-conservation]
    i_can:
      nob: Jeg kan forklare hva som skjer når noe brenner.
      eng: I can explain what happens when something burns.
    teacher:
      nob: "Forklarer forbrenning som reaksjon med oksygen som gir karbondioksid og vann, og hvorfor den er viktig. Ikke ennå: tror flammen er et stoff."
      eng: "Explains combustion as a reaction with oxygen giving carbon dioxide and water, and why it matters. Not yet: thinks the flame is a substance."
    stages: [pictorial, abstract]
    misconceptions: [burning-destroys-matter]
    assessable: true
    reviewed: false

  - id: nat.materials.atoms-periodic-table
    strand: materials
    checkpoint: 10
    refs: [KM13862]
    needs: [nat.materials.particle-model]
    i_can:
      nob: Jeg kan bruke atommodellen og periodesystemet til å forklare egenskaper.
      eng: I can use atoms and the periodic table to explain properties.
    teacher:
      nob: "Plasserer grunnstoffer etter egenskaper og forklarer hvorfor stoffer i samme gruppe ligner hverandre. Ikke ennå: pugger plassene uten å kunne si hvorfor."
      eng: "Places elements by their properties and explains why elements in one group are alike. Not yet: memorises positions without knowing why."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.energy-forces.energy-conservation
    strand: energy-forces
    checkpoint: 10
    refs: [KM13864]
    needs: [nat.energy-forces.energy-chain]
    i_can:
      nob: Jeg kan forklare at energi ikke forsvinner, bare skifter form.
      eng: I can explain that energy is not lost, only changes form.
    teacher:
      nob: "Følger energien gjennom en omforming og viser at summen er den samme, med noe som varme. Ikke ennå: sier at energien er brukt opp."
      eng: "Follows energy through a conversion and shows the total stays the same, with some as heat. Not yet: says the energy is used up."
    stages: [pictorial, abstract]
    misconceptions: [energy-gets-used-up]
    assessable: true
    reviewed: false

  - id: nat.energy-forces.energy-quality
    strand: energy-forces
    checkpoint: 10
    refs: [KM13864]
    needs: [nat.energy-forces.energy-conservation]
    i_can:
      nob: Jeg kan forklare hva energikvalitet betyr.
      eng: I can explain what energy quality means.
    teacher:
      nob: "Forklarer at elektrisk energi er lett å bruke, mens spredt varme er lite nyttig. Ikke ennå: tror all energi er like nyttig."
      eng: "Explains that electric energy is easy to use, while spread-out heat is of little use. Not yet: thinks all energy is equally useful."
    stages: [abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.energy-forces.store-transport-energy
    strand: energy-forces
    checkpoint: 10
    refs: [KM13864]
    needs: [nat.energy-forces.electricity-everyday]
    i_can:
      nob: Jeg kan gi eksempler på hvordan energi omformes, fraktes og lagres.
      eng: I can give examples of converting, moving and storing energy.
    teacher:
      nob: "Gir eksempler som vannkraftverk, strømnettet og batterier, og sier hvilken form energien har. Ikke ennå: nevner eksempler uten energiform."
      eng: "Gives examples such as hydropower, the power grid and batteries, and names the energy form. Not yet: lists examples without the energy form."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.energy-forces.energy-and-environment
    strand: energy-forces
    checkpoint: 10
    refs: [KM13865]
    needs: [nat.energy-forces.energy-quality]
    i_can:
      nob: Jeg kan forklare hvordan energibruk påvirker miljøet.
      eng: I can explain how energy use affects the environment.
    teacher:
      nob: "Sammenligner miljøkostnaden ved ulike energikilder lokalt og globalt (utslipp, naturinngrep). Ikke ennå: tror fornybar energi ikke har noen kostnad."
      eng: "Compares the environmental cost of energy sources locally and globally (emissions, land use). Not yet: thinks renewable energy has no cost."
    stages: [abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.living-things.evolution
    strand: living-things
    checkpoint: 10
    refs: [KM13866]
    needs: [nat.living-things.biodiversity]
    i_can:
      nob: Jeg kan bruke evolusjonsteorien til å forklare artsmangfold.
      eng: I can use evolution to explain the variety of species.
    teacher:
      nob: "Forklarer variasjon, arv og naturlig utvalg, og hvordan forskere kom fram til teorien. Ikke ennå: sier at dyr endrer seg fordi de trenger det."
      eng: "Explains variation, inheritance and natural selection, and how researchers arrived at the theory. Not yet: says animals change because they need to."
    stages: [pictorial, abstract]
    misconceptions: [change-by-need]
    assessable: true
    reviewed: false

  - id: nat.living-things.cells
    strand: living-things
    checkpoint: 10
    refs: [KM13867]
    needs: [nat.living-things.group-organisms]
    i_can:
      nob: Jeg kan sammenligne celler fra ulike organismer.
      eng: I can compare cells from different organisms.
    teacher:
      nob: "Merker av dyrecelle, plantecelle og bakterie og kobler en del til det den gjør. Ikke ennå: vet ikke at planteceller har cellevegg og grønnkorn."
      eng: "Labels an animal cell, a plant cell and a bacterium and links a part to its job. Not yet: does not know plant cells have a wall and chloroplasts."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.living-things.photosynthesis-respiration
    strand: living-things
    checkpoint: 10
    refs: [KM13870]
    needs: [nat.living-things.food-webs]
    i_can:
      nob: Jeg kan forklare fotosyntese og celleånding.
      eng: I can explain photosynthesis and cellular respiration.
    teacher:
      nob: "Forklarer at planter lager sukker av karbondioksid og vann med lys, og at alle organismer bryter det ned igjen i karbonkretsløpet. Ikke ennå: sier at planter får maten fra jorda."
      eng: "Explains that plants make sugar from carbon dioxide and water using light, and that all organisms break it down again in the carbon cycle. Not yet: says plants get their food from the soil."
    stages: [pictorial, abstract]
    misconceptions: [plants-eat-soil]
    assessable: true
    reviewed: false

  - id: nat.living-things.ecosystem-cycles
    strand: living-things
    checkpoint: 10
    refs: [KM13868]
    needs: [nat.living-things.photosynthesis-respiration]
    i_can:
      nob: Jeg kan forklare hvordan energi og stoffer går gjennom et økosystem.
      eng: I can explain how energy and matter move through an ecosystem.
    teacher:
      nob: "Forklarer at stoffer går i kretsløp mens energien strømmer gjennom, og kobler biotiske og abiotiske faktorer. Ikke ennå: sier at energien går i ring."
      eng: "Explains that matter cycles while energy flows through, and links living and non-living factors. Not yet: says energy goes round in a cycle."
    stages: [pictorial, abstract]
    misconceptions: [energy-cycles]
    assessable: true
    reviewed: false

  - id: nat.earth-space.greenhouse-effect
    strand: earth-space
    checkpoint: 10
    refs: [KM13863]
    needs: [nat.earth-space.conditions-for-life]
    i_can:
      nob: Jeg kan forklare drivhuseffekten og hva som endrer klimaet.
      eng: I can explain the greenhouse effect and what changes the climate.
    teacher:
      nob: "Forklarer hvordan drivhusgasser holder på varme og skiller naturlige og menneskeskapte årsaker. Ikke ennå: blander drivhuseffekten med hullet i ozonlaget."
      eng: "Explains how greenhouse gases keep in heat and separates natural from human causes. Not yet: confuses the greenhouse effect with the ozone hole."
    stages: [pictorial, abstract]
    misconceptions: [greenhouse-is-ozone-hole]
    assessable: true
    reviewed: false

  - id: nat.earth-space.plate-tectonics
    strand: earth-space
    checkpoint: 10
    refs: [KM13871]
    needs: [nat.earth-space.rock-cycle]
    i_can:
      nob: Jeg kan bruke platetektonikk til å forklare hvordan jorda har endret seg.
      eng: I can use plate tectonics to explain how Earth has changed.
    teacher:
      nob: "Forklarer platebevegelser og gir observasjoner som støtter teorien (kystlinjer som passer, fossiler, jordskjelv). Ikke ennå: kjenner teorien, men ikke bevisene."
      eng: "Explains plate movement and gives observations that support the theory (matching coastlines, fossils, earthquakes). Not yet: knows the theory but not the evidence."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.body-health.nerves-and-hormones
    strand: body-health
    checkpoint: 10
    refs: [KM13873]
    needs: [nat.body-health.organ-systems]
    i_can:
      nob: Jeg kan sammenligne nervesystemet og hormonsystemet.
      eng: I can compare the nervous system and the hormone system.
    teacher:
      nob: "Forklarer at nervesignaler er raske og korte, mens hormoner er langsomme og varer lenger. Ikke ennå: blander de to systemene."
      eng: "Explains that nerve signals are fast and short while hormones are slow and last longer. Not yet: mixes up the two systems."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.body-health.substances-and-signals
    strand: body-health
    checkpoint: 10
    refs: [KM13873]
    needs: [nat.body-health.nerves-and-hormones]
    i_can:
      nob: Jeg kan forklare hvordan rusmidler og medisiner påvirker signaler i kroppen.
      eng: I can explain how drugs and medicines affect signals in the body.
    teacher:
      nob: "Forklarer hvordan rusmidler, medisiner, miljøgifter og doping kan forstyrre signalene mellom celler. Ikke ennå: sier bare at rusmidler er farlige."
      eng: "Explains how drugs, medicines, environmental toxins and doping can disturb signals between cells. Not yet: only says drugs are dangerous."
    stages: [abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.body-health.immune-system-vaccines
    strand: body-health
    checkpoint: 10
    refs: [KM13874]
    needs: [nat.body-health.outer-defences]
    i_can:
      nob: Jeg kan forklare immunforsvaret og hvordan vaksiner virker.
      eng: I can explain the immune system and how vaccines work.
    teacher:
      nob: "Forklarer hvite blodceller og antistoffer, at en vaksine trener immunforsvaret, og hvorfor mange vaksinerte beskytter alle. Ikke ennå: tror en vaksine er en medisin mot en sykdom man har."
      eng: "Explains white blood cells and antibodies, that a vaccine trains the immune system, and why many vaccinated people protect everyone. Not yet: thinks a vaccine cures an illness you already have."
    stages: [pictorial, abstract]
    misconceptions: [vaccine-is-a-cure]
    assessable: true
    reviewed: false

  - id: nat.body-health.sexual-health
    strand: body-health
    checkpoint: 10
    refs: [KM13872]
    needs: [nat.body-health.puberty]
    i_can:
      nob: Jeg kjenner fakta om seksuell og reproduktiv helse.
      eng: I know the facts about sexual and reproductive health.
    teacher:
      nob: "Kjenner til prevensjon, seksuelt overførbare infeksjoner og hvordan de forebygges, og hvor man kan få hjelp (helsesykepleier). Ikke ennå: kjenner ikke til hvor man kan få hjelp."
      eng: "Knows about contraception, sexually transmitted infections and how to prevent them, and where to get help (the school nurse). Not yet: does not know where to get help."
    stages: [abstract]
    misconceptions: []
    assessable: true
    reviewed: false
    sensitive: true  # see docs/design/subjects/naturfag.md

  - id: nat.technology.explain-transmitter-receiver
    strand: technology
    checkpoint: 10
    refs: [KM13859]
    needs: [nat.technology.parts-of-a-system]
    i_can:
      nob: Jeg kan forklare hvordan en sender og en mottaker virker sammen.
      eng: I can explain how a transmitter and a receiver work together.
    teacher:
      nob: "Forklarer at et signal kodes, sendes og tolkes, med et eksempel (radio, fjernkontroll). Ikke ennå: forklarer senderen, men ikke mottakeren."
      eng: "Explains that a signal is encoded, sent and decoded, with an example (radio, remote control). Not yet: explains the transmitter but not the receiver."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.technology.build-transmitter-receiver
    strand: technology
    checkpoint: 10
    refs: [KM13859]
    needs: [nat.technology.program-a-system, nat.technology.explain-transmitter-receiver]
    i_can:
      nob: Jeg kan lage et system med sender og mottaker.
      eng: I can make a system with a transmitter and a receiver.
    teacher:
      nob: "Bygger og programmerer to enheter som sender og tar imot en melding. Ikke ennå: får bare den ene enheten til å virke."
      eng: "Builds and programs two devices that send and receive a message. Not yet: gets only one of the devices working."
    stages: [concrete]
    misconceptions: []
    assessable: false
    reviewed: false

  - id: nat.technology.program-to-explore
    strand: technology
    checkpoint: 10
    refs: [KM13860]
    needs: [nat.technology.program-a-system]
    i_can:
      nob: Jeg kan bruke programmering til å utforske et fenomen.
      eng: I can use programming to explore a natural phenomenon.
    teacher:
      nob: "Leser og endrer et program som måler eller simulerer noe (temperatur over tid, fritt fall) og tolker resultatet. Ikke ennå: kjører programmet uten å tolke resultatet."
      eng: "Reads and changes a program that measures or simulates something (temperature over time, free fall) and interprets the result. Not yet: runs the program without interpreting the result."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.sustainability.resource-dilemmas
    strand: sustainability
    checkpoint: 10
    refs: [KM13875]
    needs: [nat.sustainability.protect-biodiversity]
    i_can:
      nob: Jeg kan forklare begge sider av et dilemma om naturressurser.
      eng: I can explain both sides of a natural-resource dilemma.
    teacher:
      nob: "Gjengir argumenter for og mot i en aktuell sak (gruvedrift, vindkraft, oppdrett) med fakta om naturtap. Ikke ennå: gir bare argumentene for én side."
      eng: "Sets out arguments for and against in a current case (mining, wind power, fish farming) with facts about nature loss. Not yet: gives only one side."
    stages: [abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.sustainability.sami-nature-knowledge
    strand: sustainability
    checkpoint: 10
    refs: [KM13869]
    needs: [nat.sustainability.northern-nature-management]
    i_can:
      nob: Jeg kan gi eksempler på samisk kunnskap om naturen.
      eng: I can give examples of Sami knowledge about nature.
    teacher:
      nob: "Gir eksempler på samisk kunnskap (snø, beite, årstider) og hvordan den kan bidra til bærekraftig forvaltning. Ikke ennå: nevner bare reindrift uten å si hva kunnskapen er."
      eng: "Gives examples of Sami knowledge (snow, grazing, seasons) and how it can support sustainable management. Not yet: names reindeer herding without saying what the knowledge is."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: nat.sustainability.how-research-works
    strand: sustainability
    checkpoint: 10
    refs: [KM13858]
    needs: [nat.sustainability.science-develops]
    i_can:
      nob: Jeg kan forklare hvordan forskning skaper ny kunnskap.
      eng: I can explain how research creates new knowledge.
    teacher:
      nob: "Gir et eksempel på aktuell forskning og forklarer fagfellevurdering, samarbeid og kritisk prøving. Ikke ennå: tror én forsker finner svaret alene."
      eng: "Gives an example of current research and explains peer review, collaboration and critical testing. Not yet: thinks one researcher finds the answer alone."
    stages: [abstract]
    misconceptions: []
    assessable: true
    reviewed: false
