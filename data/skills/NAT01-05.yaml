    reviewed: false

  - id: nat.living-things.food-webs
    strand: living-things
    checkpoint: 7
    refs: [KM13845]
    needs: [nat.energy-forces.energy-chain]
    i_can:
      nob: Jeg kan lage næringskjeder og næringsnett.
      eng: I can build food chains and food webs.
    teacher:
      nob: "Tegner piler fra maten til den som spiser, og forutsier hva som skjer med reven hvis smågnagerne forsvinner. Ikke ennå: tegner pilene fra den som spiser."
      eng: "Draws arrows from food to eater, and predicts what happens to the fox if the voles disappear. Not yet: draws arrows from the eater."
    stages: [pictorial, abstract]
    misconceptions: [arrows-point-to-food, plants-eat-soil]
    assessable: true
    reviewed: false

