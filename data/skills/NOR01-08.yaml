    i_can:
      nob: Jeg kan finne informasjon i bøker og på nettet.
      eng: I can find information in books and online.
    teacher:
      nob: "Velger gode søkeord og finner et svar i et oppslagsverk eller på en nettside. Ikke ennå: skriver hele spørsmålet i søket og tar første treff."
      eng: "Chooses good search words and finds an answer in a reference book or web page. Not yet: types the whole question and takes the first hit."
    stages: [abstract]
    misconceptions: []
    assessable: true

  - id: nor.sources.judge-reliability
    strand: sources
    checkpoint: 7
    refs: [KM14173]
    needs: [nor.sources.fact-or-opinion]
    i_can:
      nob: Jeg kan sjekke hvem som skrev noe, når og hvorfor.
      eng: I can check who wrote something, when and why.
    teacher:
      nob: "Trykker på avsender, dato og formål på en oppdiktet nettside, og kjenner igjen reklame. Ikke ennå: stoler på siden fordi den ser proff ut."
      eng: "Taps the author, date and purpose on a made-up web page, and recognises advertising. Not yet: trusts a page because it looks professional."
    stages: [abstract]
    misconceptions: [trusts-looks-over-author, advert-as-fact]
    assessable: true

  - id: nor.sources.name-sources
    strand: sources
    checkpoint: 7
    refs: [KM14173]
    needs: [nor.sources.find-information]
    i_can:
      nob: Jeg kan skrive hvor jeg fant informasjonen.
      eng: I can write where I found the information.
    teacher:
      nob: "Skriver en kildeliste med tittel, forfatter eller nettsted og dato. Ikke ennå: skriver bare Google eller internett."
      eng: "Writes a source list with title, author or site, and date. Not yet: writes only Google or the internet."
    stages: [abstract]
    misconceptions: [search-engine-as-source]
    assessable: true

  - id: nor.sources.self-in-digital-media
    strand: sources
    checkpoint: 7
    refs: [KM14182]
    needs: []
    i_can:
      nob: Jeg tenker over hva jeg legger ut om meg selv og andre.
      eng: I think about what I post about myself and others.
    teacher:
      nob: "Kan i en klassesamtale si hvorfor et bilde av en venn ikke bør deles uten å spørre. Ikke ennå: ser ikke forskjell på å dele om seg selv og om andre. Øves ikke i Pensum."
      eng: "Can say in a class discussion why a photo of a friend should not be shared without asking. Not yet: sees no difference between sharing about herself and about others. Not practised in Pensum."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.language.dialects-and-neighbours
    strand: language
    checkpoint: 7
    refs: [KM14178]
    needs: [nor.language.compare-languages, nor.language.local-dialects]
    i_can:
      nob: Jeg kan sammenligne dialekter, svensk og dansk med mitt eget språk.
      eng: I can compare dialects, Swedish and Danish with my own speech.
    teacher:
      nob: "Parer svenske og danske ord med norske og vet at rolig betyr morsom på svensk. Ikke ennå: tror ord som ser like ut betyr det samme."
      eng: "Matches Swedish and Danish words to Norwegian ones and knows rolig means fun in Swedish. Not yet: assumes look-alike words mean the same."
    stages: [pictorial, abstract]
    misconceptions: [trusts-false-friends]
    assessable: true

  - id: nor.language.dialect-interview
    strand: language
    checkpoint: 7
    refs: [KM14178]
    needs: [nor.language.local-dialects]
    i_can:
      nob: Jeg kan spørre noen hvordan de sier ord og skrive det ned.
      eng: I can ask someone how they say words and note it.
    teacher:
      nob: "Spør en voksen fra et annet sted hvordan hen sier tre ord, og sammenligner med egen dialekt. Ikke ennå: skriver ned ordene uten å sammenligne."
      eng: "Asks an adult from elsewhere how they say three words and compares them with her own dialect. Not yet: writes the words down without comparing."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.language.try-sidemal
    strand: language
    checkpoint: 7
    refs: [KM14175]
    needs: [nor.language.bokmal-or-nynorsk]
    i_can:
      nob: Jeg kan skrive korte setninger på sidemålet mitt.
      eng: I can write short sentences in my second written form.
    teacher:
      nob: "Skriver korte setninger på nynorsk med vanlige ord som ikkje, kva og eg. Ikke ennå: blander bokmål og nynorsk i samme setning."
      eng: "Writes short nynorsk sentences with common words such as ikkje, kva and eg. Not yet: mixes bokmål and nynorsk in one sentence."
    stages: [pictorial, abstract]
    misconceptions: [mixes-bokmal-nynorsk]
    assessable: true

  - id: nor.language.sami-names
    strand: language
    checkpoint: 7
    refs: [KM14184]
    needs: [nor.decoding.letter-sounds]
    i_can:
      nob: Jeg kan uttale samiske navn og stedsnavn.
      eng: I can say Sami names and place names.
    teacher:
      nob: "Parer skrevne samiske navn med riktig uttale, også de med samiske bokstaver som á og š. Ikke ennå: leser dem som norske ord."
      eng: "Matches written Sami names with their spoken form, including those with Sami letters such as á and š. Not yet: reads them as Norwegian words."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true

  - id: nor.language.sami-texts
    strand: language
    checkpoint: 7
    refs: [KM14184]
    needs: [nor.literature.what-text-means]
    i_can:
      nob: Jeg kan snakke om hva som er viktig i en samisk tekst.
      eng: I can talk about what matters in a Sami text.
    teacher:
      nob: "Leser en samisk tekst på norsk og sier hvilke verdier den viser, for eksempel forholdet til naturen. Ikke ennå: forteller bare handlingen."
      eng: "Reads a Sami text in Norwegian and names the values it shows, such as a relationship with nature. Not yet: only retells the plot."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.language.language-and-identity
    strand: language
    checkpoint: 7
    refs: [KM14179]
    needs: [nor.language.local-dialects]
    i_can:
      nob: Jeg kan si hvordan språket mitt henger sammen med hvem jeg er.
      eng: I can say how my language is part of who I am.
    teacher:
      nob: "Forteller hvorfor hun holder på dialekten eller bruker et ord fra et annet språk hjemme. Ikke ennå: ser på språk bare som et verktøy."
      eng: "Explains why she keeps her dialect, or uses a word from another language at home. Not yet: sees language only as a tool."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.talking.build-on-others
    strand: talking
    checkpoint: 7
    refs: [KM14169]
    needs: [nor.talking.follow-up-questions]
    i_can:
      nob: Jeg kan bygge videre på det andre sier og begrunne meningen min.
      eng: I can build on what others say and justify my view.
    teacher:
      nob: "Sier jeg er enig med Ali fordi, og legger til et nytt poeng. Ikke ennå: gjentar sin egen mening uten å ta med det andre sa."
      eng: "Says I agree with Ali because, and adds a new point. Not yet: repeats her own view without taking up what others said."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.talking.present-a-topic
    strand: talking
    checkpoint: 7
    refs: [KM14170]
    needs: [nor.talking.present-with-pictures]
    i_can:
      nob: Jeg kan holde en presentasjon om et fagtema.
      eng: I can give a talk on a school topic.
    teacher:
      nob: "Presenterer et tema med innledning, hoveddel og avslutning, med eller uten lysark. Ikke ennå: leser lysarkene høyt ord for ord."
      eng: "Presents a topic with an introduction, a body and a conclusion, with or without slides. Not yet: reads the slides aloud word for word."
    stages: [concrete]
    misconceptions: []
    assessable: false

  # ---- etter 10. trinn ------------------------------------------------------

  - id: nor.reading.reflect-on-strategies
    strand: reading
    checkpoint: 10
    refs: [KM14201]
    needs: [nor.reading.pick-a-strategy]
    i_can:
      nob: Jeg kan forklare hvordan jeg leser, og når jeg bytter lesemåte.
      eng: I can explain how I read and when I switch.
    teacher:
      nob: "Beskriver hvordan hun leste en roman og en fagtekst forskjellig, og når hun gikk tilbake. Ikke ennå: sier bare at hun leste den."
      eng: "Describes how she read a novel and a factual text differently, and when she went back. Not yet: only says she read it."
    stages: [abstract]
    misconceptions: []
    assessable: false

  - id: nor.spelling.correct-hovedmal
    strand: spelling
    checkpoint: 10
    refs: [KM14191]
