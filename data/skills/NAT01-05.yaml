      nob: "Forklarer at et økosystem med mange arter tåler endringer bedre, og gir et eksempel. Ikke ennå: sier bare at dyr er fine."
      eng: "Explains that an ecosystem with many species copes better with change, and gives an example. Not yet: only says animals are nice."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

