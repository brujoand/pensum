# Matematikk, kompetansemål etter 2. trinn (MAT01-06 / KV1021).
#
# Hand-written as the reference set: these establish the register and the
# honesty bar that generated items are held to. Written for 7-year-olds, so
# prompts are short, concrete, and free of subordinate clauses.
#
# Questions here are ours, not Udir's. The competence goals they test are quoted
# verbatim elsewhere; nothing in this file is official curriculum text.
---
subject: MAT01-06
goal_set: KV1021

items:
  - id: KM13228-01
    goal: KM13228
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Kari sorterer leker i to grupper. I den ene gruppa er en ball, en
        appelsin og en klinkekule. Hva passer best i den gruppa?
      en: Kari is sorting toys into two groups. One group has a ball, an orange
        and a marble. What fits best in that group?
    choices:
      - id: a
        text:
          nb: En mynt
          en: A coin
        correct: true
      - id: b
        text:
          nb: En bok
          en: A book
      - id: c
        text:
          nb: En blyant
          en: A pencil
    explanation:
      nb: Gruppa er ting som er runde. En mynt er rund, mens en bok og en blyant
        ikke er det.
      en: The group is round things. A coin is round; a book and a pencil are not.
    reviewed: true
    reviewed_by: hand-written reference set

  - id: KM13241-01
    goal: KM13241
    type: numeric
    difficulty: 1
    prompt:
      nb: "Hvor mange prikker er det?"
      en: "How many dots are there?"
    figure:
      kind: counters
      count: 7
      alt:
        nb: Sju prikker på en rad.
        en: Seven dots in a row.
    answer: 7
    explanation:
      nb: Det er sju prikker. Tell én om gangen.
      en: There are seven dots. Count them one at a time.
    reviewed: true
    reviewed_by: hand-written reference set

  - id: KM13230-01
    goal: KM13230
    type: numeric
    difficulty: 2
    prompt:
      nb: "Vi teller baklengs: 20, 18, 16, 14 … Hvilket tall kommer nå?"
      en: "Counting backwards: 20, 18, 16, 14 … which number comes next?"
    figure:
      kind: number_line
      start: 10
      end: 20
      step: 2
      jumps:
        - start: 20
          end: 18
          label: "−2"
        - start: 18
          end: 16
          label: "−2"
        - start: 16
          end: 14
          label: "−2"
      alt:
        nb: En tallinje fra 10 til 20 med hopp bakover fra 20 til 18, til 16 og
          til 14.
        en: A number line from 10 to 20 with jumps backwards from 20 to 18, to 16
          and to 14.
    answer: 12
    explanation:
      nb: Vi teller to av gangen nedover, så etter 14 kommer 12.
      en: The count goes down by two each time, so after 14 comes 12.
    reviewed: true
    reviewed_by: hand-written reference set

  - id: KM13231-01
    goal: KM13231
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Hvilket tall er et partall?
      en: Which number is an even number?
    choices:
      - id: a
        text:
          nb: "7"
          en: "7"
      - id: b
        text:
          nb: "10"
          en: "10"
        correct: true
      - id: c
        text:
          nb: "13"
          en: "13"
    explanation:
      nb: 10 kan deles i to like grupper på 5. Da er det et partall.
      en: 10 splits into two equal groups of 5, which makes it even.
    reviewed: true
    reviewed_by: hand-written reference set

  - id: KM13232-01
    goal: KM13232
    type: numeric
    difficulty: 2
    prompt:
      nb: Et tall har 4 tiere og 3 enere. Hvilket tall er det?
      en: A number has 4 tens and 3 ones. What number is it?
    answer: 43
    explanation:
      nb: 4 tiere er 40. Legg til 3 enere, så blir det 43.
      en: 4 tens is 40. Add 3 ones and you get 43.
    reviewed: true
    reviewed_by: hand-written reference set

  - id: KM13233-01
    goal: KM13233
    type: number_line
    difficulty: 2
    prompt:
      nb: Sett merket på tallet som er midt mellom 30 og 40.
      en: Put the marker on the number halfway between 30 and 40.
    figure:
      kind: number_line
      start: 0
      end: 50
      step: 5
      # Every second tick carries a number, so 30 and 40 are written on the line
      # and 35 is a tick between them with nothing under it. Labelling every
      # tick would print the answer next to the place it goes.
      label_every: 2
      alt:
        nb: En tallinje fra 0 til 50 med et merke for hver femte, og tall under
          annethvert.
        en: A number line from 0 to 50 with a tick every five, and a number
          under every second one.
    answer: 35
    explanation:
      nb: Det er 10 fra 30 til 40. Halvveis er 5 videre, altså 35.
      en: It is 10 from 30 to 40. Halfway is 5 further on, which is 35.
    reviewed: true
    reviewed_by: hand-written reference set

  - id: KM13234-01
    goal: KM13234
    type: numeric
    difficulty: 1
    prompt:
      nb: Du har 8 klinkekuler. Du gir bort 3. Hvor mange har du igjen?
      en: You have 8 marbles. You give away 3. How many do you have left?
    answer: 5
    explanation:
      nb: 8 minus 3 er 5.
      en: 8 minus 3 is 5.
    reviewed: true
    reviewed_by: hand-written reference set

  - id: KM13235-01
    goal: KM13235
    type: multiple_choice
    difficulty: 3
    prompt:
      nb: Du vet at 4 + 9 = 13. Hva er 9 + 4?
      en: You know that 4 + 9 = 13. What is 9 + 4?
    choices:
      - id: a
        text:
          nb: "13"
          en: "13"
        correct: true
      - id: b
        text:
          nb: "14"
          en: "14"
      - id: c
        text:
          nb: "Det går ikke an å vite"
          en: "There is no way to know"
    explanation:
      nb: Rekkefølgen betyr ingenting når vi plusser. 9 + 4 er også 13.
      en: Order does not matter when adding. 9 + 4 is 13 as well.
    reviewed: true
    reviewed_by: hand-written reference set

  - id: KM13242-01
    goal: KM13242
    type: numeric
    difficulty: 3
    prompt:
      nb: "Hvilket tall skal stå i ruta? 5 + 3 = 6 + ▢"
      en: "Which number goes in the box? 5 + 3 = 6 + ▢"
    answer: 2
    explanation:
      nb: 5 + 3 er 8. Da må 6 + ▢ også bli 8, så ruta er 2. Likhetstegnet
        betyr at det er like mye på begge sider.
      en: 5 + 3 is 8, so 6 + ▢ must also be 8, making the box 2. The equals
        sign means both sides are worth the same.
    reviewed: true
    reviewed_by: hand-written reference set

  - id: KM13236-01
    goal: KM13236
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: "Mønsteret er: rød, blå, blå, rød, blå, blå … Hvilken farge kommer nå?"
      en: "The pattern is: red, blue, blue, red, blue, blue … which colour comes
        next?"
    choices:
      - id: a
        text:
          nb: "Rød"
          en: "Red"
        correct: true
      - id: b
        text:
          nb: "Blå"
          en: "Blue"
      - id: c
        text:
          nb: "Grønn"
          en: "Green"
    explanation:
      nb: Mønsteret gjentar seg med rød, blå, blå. Etter to blå kommer rød igjen.
      en: The pattern repeats red, blue, blue. After two blues, red comes again.
    reviewed: true
    reviewed_by: hand-written reference set

  - id: KM13237-01
    goal: KM13237
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Hvor mange hjørner har en trekant?
      en: How many corners does a triangle have?
    figure:
      kind: shape
      shape: triangle
      alt:
        nb: En trekant.
        en: A triangle.
    choices:
      - id: a
        text:
          nb: "3"
          en: "3"
        correct: true
      - id: b
        text:
          nb: "4"
          en: "4"
      - id: c
        text:
          nb: "6"
          en: "6"
    explanation:
      nb: En trekant har tre sider og tre hjørner.
      en: A triangle has three sides and three corners.
    reviewed: true
    reviewed_by: hand-written reference set

  - id: KM13238-01
    goal: KM13238
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Den lille viseren står på 3, og den store står på 12. Hva er klokka?
      en: The hour hand points at 3 and the minute hand points at 12. What time
        is it?
    choices:
      - id: a
        text:
          nb: "Klokka er 3"
          en: "Three o'clock"
        correct: true
      - id: b
        text:
          nb: "Klokka er halv 3"
          en: "Half past two"
      - id: c
        text:
          nb: "Klokka er 12"
          en: "Twelve o'clock"
    explanation:
      nb: Den lille viseren viser timen. Når den store står på 12, er klokka
        akkurat 3.
      en: The hour hand shows the hour. When the minute hand is on 12, it is
        exactly three o'clock.
    reviewed: true
    reviewed_by: hand-written reference set

  - id: KM13240-01
    goal: KM13240
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hva passer best å måle lengden av klasserommet med?
      en: What is the best thing to measure the length of a classroom with?
    choices:
      - id: a
        text:
          nb: "Meter"
          en: "Metres"
        correct: true
      - id: b
        text:
          nb: "Millimeter"
          en: "Millimetres"
      - id: c
        text:
          nb: "Kilometer"
          en: "Kilometres"
    explanation:
      nb: Et klasserom er noen få meter langt. Millimeter blir altfor lite, og
        kilometer altfor stort.
      en: A classroom is a few metres long. Millimetres are far too small and
        kilometres far too big.
    reviewed: true
    reviewed_by: hand-written reference set

# Goals that no written question can honestly test. Recorded rather than
# omitted, so the gap is a stated judgement instead of a silent one.

  # --- Answered with the hands -------------------------------------------
  # Manipulatives (`pensum.items.primitives`): the pupil builds the answer on a
  # board, and without a script the same target is asked as a number.
  # A few name the skill they are evidence for (`skill:`); the rest are
  # attributed by goal, which is coarser. See `pensum.mastery.attribution`.

  - id: KM13241-02
    goal: KM13241
    type: counters
    stage: concrete
    skill: mat.counting.represent-numbers
    difficulty: 1
    prompt:
      nb: Legg 7 brikker på matta.
      en: Put 7 counters on the mat.
    activity:
      alt:
        nb: En tom matte med plass til brikker i rader på ti, og en boks med brikker.
        en: An empty mat with room for counters in rows of ten, and a box of counters.
      target: 7
    explanation:
      nb: 7 er 5 og 2 til. En halv rad på fem og to brikker til er 7.
      en: 7 is 5 and 2 more. Half a row of five and two more counters is 7.
    reviewed: false

  - id: KM13231-02
    goal: KM13231
    type: counters
    stage: concrete
    difficulty: 1
    prompt:
      nb: Del 8 brikker i to like store grupper.
      en: Share 8 counters into two groups of the same size.
    activity:
      alt:
        nb: Åtte brikker på en matte, og to tomme ringer under den.
        en: Eight counters on a mat, and two empty rings below it.
      target: 8
      start: 8
      groups: [4, 4]
    explanation:
      nb: 8 blir 4 og 4. Når et tall kan deles i to like store grupper, er det et partall.
      en: 8 becomes 4 and 4. When a number splits into two equal groups, it is an even number.
    reviewed: false

  - id: KM13234-02
    goal: KM13234
    type: counters
    stage: concrete
    skill: mat.add-subtract.within-20
    difficulty: 2
    prompt:
      nb: Det ligger 6 brikker på matta. Legg på 3 til.
      en: There are 6 counters on the mat. Put 3 more on it.
    activity:
      alt:
        nb: En matte med seks brikker på, og en boks med flere brikker.
        en: A mat with six counters on it, and a box with more counters.
      target: 9
      start: 6
    explanation:
      nb: 6 + 3 = 9. Du kan telle videre fra 6 – 7, 8, 9.
      en: 6 + 3 = 9. You can count on from 6 – 7, 8, 9.
    reviewed: false

  - id: KM13241-03
    goal: KM13241
    type: ten_frame
    stage: pictorial
    skill: mat.counting.represent-numbers
    difficulty: 1
    prompt:
      nb: Vis 8 på tierrammen.
      en: Show 8 on the ten-frame.
    activity:
      alt:
        nb: En tom tierramme med to rader på fem ruter.
        en: An empty ten-frame with two rows of five squares.
      target: 8
    explanation:
      nb: 8 er en full rad på 5 og 3 til. Da er det 2 tomme ruter, og 8 + 2 = 10.
      en: 8 is a full row of 5 and 3 more. That leaves 2 empty squares, and 8 + 2 = 10.
    reviewed: false

  - id: KM13234-03
    goal: KM13234
    type: ten_frame
    stage: pictorial
    skill: mat.add-subtract.within-20
    difficulty: 1
    prompt:
      nb: Det er 7 prikker i rammen. Fyll den opp til 10.
      en: There are 7 dots in the frame. Fill it up to 10.
    activity:
      alt:
        nb: En tierramme med sju prikker og tre tomme ruter.
        en: A ten-frame with seven dots and three empty squares.
      target: 10
      start: 7
    explanation:
      nb: Det var 3 tomme ruter. 7 + 3 = 10.
      en: There were 3 empty squares. 7 + 3 = 10.
    reviewed: false

  - id: KM13241-04
    goal: KM13241
    type: ten_frame
    stage: pictorial
    difficulty: 2
    prompt:
      nb: Vis 13 på to tierrammer. Fyll den første rammen helt først.
      en: Show 13 on two ten-frames. Fill the first frame all the way first.
    activity:
      alt:
        nb: To tomme tierrammer, den ene over den andre.
        en: Two empty ten-frames, one above the other.
      frames: 2
      target: 13
      order: in_order
    explanation:
      nb: 13 er en full tier og 3 til. Den første rammen blir full, og den andre får 3 prikker.
      en: 13 is a full ten and 3 more. The first frame is full, and the second gets 3 dots.
    reviewed: false

  - id: KM13234-04
    goal: KM13234
    type: ten_frame
    stage: pictorial
    difficulty: 2
    prompt:
      nb: Vis 6 + 6 på to tierrammer.
      en: Show 6 + 6 on two ten-frames.
    activity:
      alt:
        nb: To tomme tierrammer, den ene over den andre.
        en: Two empty ten-frames, one above the other.
      frames: 2
      target: 12
    explanation:
      nb: 6 + 6 = 12. Du kan fylle 10 i den første rammen og legge 2 i den andre.
      en: 6 + 6 = 12. You can fill 10 in the first frame and put 2 in the second.
    reviewed: false

  - id: KM13232-02
    goal: KM13232
    type: base_ten
    stage: concrete
    skill: mat.place-value.tens-and-ones
    difficulty: 1
    prompt:
      nb: Vis 34 med tiere og enere.
      en: Show 34 with tens and ones.
    activity:
      alt:
        nb: En tom plassverdi-matte med en kolonne for tiere og en for enere.
        en: An empty place-value mat with a column for tens and one for ones.
      target: 34
    explanation:
      nb: 34 er 3 tiere og 4 enere. 3 tiere er 30, og 30 + 4 = 34.
      en: 34 is 3 tens and 4 ones. 3 tens is 30, and 30 + 4 = 34.
    reviewed: false

  - id: KM13232-03
    goal: KM13232
    type: base_ten
    stage: concrete
    difficulty: 2
    prompt:
      nb: Vis 47 med så få klosser som mulig.
      en: Show 47 with as few blocks as you can.
    activity:
      alt:
        nb: En tom plassverdi-matte med en kolonne for tiere og en for enere.
        en: An empty place-value mat with a column for tens and one for ones.
      target: 47
      accept: canonical
    explanation:
      nb: >-
        Ti enere kan byttes til én tier, så færrest klosser får du med 4 tiere og
        7 enere.
      en: >-
        Ten ones can be swapped for one ten, so the fewest blocks is 4 tens and 7
        ones.
    reviewed: false

  - id: KM13232-04
    goal: KM13232
    type: base_ten
    stage: concrete
    skill: mat.place-value.exchange-tens
    difficulty: 3
    prompt:
      nb: Her er 2 tiere og 14 enere. Bytt slik at det blir færre enn 10 enere.
      en: Here are 2 tens and 14 ones. Swap so there are fewer than 10 ones.
    activity:
      alt:
        nb: En plassverdi-matte med 2 tiere og 14 enere.
        en: A place-value mat with 2 tens and 14 ones.
      target: 34
      accept: canonical
      start:
        tens: 2
        ones: 14
    explanation:
      nb: >-
        10 av de 14 enerne blir én tier. Da er det 3 tiere og 4 enere, og det er
        fortsatt 34.
      en: >-
        10 of the 14 ones become one ten. That makes 3 tens and 4 ones, which is
        still 34.
    reviewed: false

  - id: KM13242-02
    goal: KM13242
    type: balance
    stage: concrete
    difficulty: 2
    prompt:
      nb: "3 + 4 = ☐ + 5. Legg klosser i boksen til vekten er i likevekt."
      en: "3 + 4 = ☐ + 5. Put blocks in the box until the scales balance."
    activity:
      alt:
        nb: En skålvekt med 7 klosser på venstre side og en tom boks og 5 klosser på høyre side.
        en: A pan balance with 7 blocks on the left, and an empty box and 5 blocks on the right.
      left:
        weights: 7
      right:
        boxes: 1
        weights: 5
      open_box: true
    explanation:
      nb: >-
        Venstre side er 3 + 4 = 7. Høyre side har 5, så boksen må ha 2. Likhetstegnet
        betyr at begge sidene er like mye.
      en: >-
        The left side is 3 + 4 = 7. The right side has 5, so the box needs 2. The
        equals sign means both sides are the same amount.
    reviewed: false

  - id: KM13242-03
    goal: KM13242
    type: balance
    stage: concrete
    difficulty: 2
    prompt:
      nb: "6 + 2 = 4 + ☐. Legg klosser i boksen til vekten er i likevekt."
      en: "6 + 2 = 4 + ☐. Put blocks in the box until the scales balance."
    activity:
      alt:
        nb: En skålvekt med 8 klosser på venstre side og 4 klosser og en tom boks på høyre side.
        en: A pan balance with 8 blocks on the left, and 4 blocks and an empty box on the right.
      left:
        weights: 8
      right:
        boxes: 1
        weights: 4
      open_box: true
    explanation:
      nb: Venstre side er 8. Høyre side har 4, og 4 + 4 = 8. Boksen må ha 4.
      en: The left side is 8. The right side has 4, and 4 + 4 = 8. The box needs 4.
    reviewed: false

not_assessable:
  - goal: KM13229
    reason: >-
      Asks the pupil to explore numbers and counting through play, nature, art,
      music and children's literature. It describes an activity a teacher sets
      up, not knowledge a question can check.

  - goal: KM13239
    reason: >-
      Asks the pupil to make and follow rules and step-by-step instructions in
      play and games. Following instructions is observable in a classroom but
      not in a quiz; asking about it would test reading, not the goal.
