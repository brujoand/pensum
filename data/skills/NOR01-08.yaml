    i_can:
      nob: Jeg kan binde setninger og avsnitt sammen så teksten henger sammen.
      eng: I can link sentences and paragraphs so the text flows.
    teacher:
      nob: "Bruker bindeord som derfor, likevel og dessuten riktig, og velger den rekkefølgen av avsnitt som henger best sammen. Ikke ennå: bruker og så mellom alt."
      eng: "Uses linking words such as derfor, likevel and dessuten correctly, and picks the paragraph order that flows best. Not yet: uses og så between everything."
