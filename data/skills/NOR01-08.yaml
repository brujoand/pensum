      nob: Jeg kan snakke ulikt til en venn og til rektor.
      eng: I can talk differently to a friend and the headteacher.
    teacher:
      nob: "Finner to måter å si det samme til en venn og til rektor. Ikke ennå: snakker likt til alle, eller vet ikke hvorfor det betyr noe."
      eng: "Finds two ways to say the same thing to a friend and to the headteacher. Not yet: talks the same way to everyone, or cannot say why it matters."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.talking.follow-up-questions
    strand: talking
    checkpoint: 4
    refs: [KM14167]
    needs: [nor.talking.take-turns]
    i_can:
      nob: Jeg kan stille et spørsmål om det andre sier.
      eng: I can ask a question about what someone said.
    teacher:
      nob: "Stiller et oppfølgingsspørsmål som hvorfor det eller hva skjedde så. Ikke ennå: bytter tema til noe om seg selv."
      eng: "Asks a follow-up question such as why or what happened next. Not yet: changes the topic to something about herself."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.talking.present-with-pictures
    strand: talking
    checkpoint: 4
    refs: [KM14154]
    needs: [nor.talking.give-a-reason]
    i_can:
      nob: Jeg kan fortelle i ett minutt fra tre bildekort.
      eng: I can present for one minute from three picture cards.
    teacher:
      nob: "Presenterer i ett minutt med eller uten skjerm, med ett poeng per kort. Ikke ennå: leser alt fra et ark, eller stopper etter første kort."
      eng: "Presents for a minute, with or without a screen, one point per card. Not yet: reads everything from a sheet, or stops after the first card."
    stages: [concrete]
    misconceptions: []
    assessable: false

  # ---- etter 7. trinn -------------------------------------------------------

  - id: nor.reading.skim-and-scan
    strand: reading
    checkpoint: 7
    refs: [KM14185]
