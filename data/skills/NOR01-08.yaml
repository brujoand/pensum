    stages: [pictorial, abstract]
    misconceptions: [takes-idiom-literally]
    assessable: true

  - id: nor.literature.literary-devices
    strand: literature
    checkpoint: 7
    refs: [KM14171]
    needs: [nor.literature.figurative-meaning]
    i_can:
      nob: Jeg kan finne sammenligning, gjentakelse og besjeling i en tekst.
      eng: I can spot simile, repetition and personification in a text.
    teacher:
      nob: "Trykker på sammenligningen sterk som en bjørn og sier hva den gjør med teksten, og prøver den selv. Ikke ennå: kaller alle beskrivelser for virkemidler."
      eng: "Taps the simile sterk som en bjørn, says what it adds, and tries one herself. Not yet: calls every description a literary device."
    stages: [abstract]
    misconceptions: []
    assessable: true

  - id: nor.sources.find-information
    strand: sources
    checkpoint: 7
    refs: [KM14173]
