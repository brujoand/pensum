      eng: I can show speech with a colon and speech marks.
    teacher:
      nob: "Skriver Mamma sa: «Kom inn!» med kolon og anførselstegn på riktig sted. Ikke ennå: skriver replikken uten tegn, så det ikke synes hvem som snakker."
      eng: "Writes Mamma sa: «Kom inn!» with the colon and speech marks in place. Not yet: writes the line with no marks, so it is unclear who speaks."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true

  - id: nor.grammar.name-word-classes
    strand: grammar
    checkpoint: 4
    refs: [KM14159]
    needs: []
    i_can:
      nob: Jeg kan finne substantiv, verb og adjektiv i en setning.
      eng: I can find nouns, verbs and adjectives in a sentence.
    teacher:
      nob: "Trykker på alle verbene i et avsnitt, og vet at løp er et substantiv i et løp. Ikke ennå: bestemmer ordklasse bare ut fra hva ordet betyr."
      eng: "Taps every verb in a passage and knows løp is a noun in et løp. Not yet: decides a word's class from its meaning alone."
    stages: [pictorial, abstract]
    misconceptions: [class-from-meaning-alone]
    assessable: true

  - id: nor.grammar.inflect-verbs
