# Skills for engelsk (ENG01-06): the smallest things a teacher would note about
# a pupil, grouped into the strands of docs/design/subjects/engelsk.md. Every
# goal in the curriculum is in some skill's refs; goals the design lists as
# missions get skills with assessable: false. The Norwegian-transfer errors the
# design names (verb second, do-support, false friends, missing sounds) are
# misconception slugs on the skills where they show. Authored, not reviewed.
subject: ENG01-06
strands:
  - id: sounds
    title: {nob: Lyder og uttale, eng: Sounds and pronunciation}
  - id: words
    title: {nob: Ord og språklæring, eng: Words and language learning}
  - id: reading
    title: {nob: Lytting og lesing, eng: Listening and reading}
  - id: grammar
    title: {nob: Grammatikk og rettskriving, eng: Grammar and spelling}
  - id: conversation
    title: {nob: Samtale, eng: Conversation}
  - id: writing
    title: {nob: Skriving, eng: Writing}
  - id: culture
    title: {nob: Kultur og kilder, eng: Culture and sources}

skills:
  # ---- etter 2. trinn -------------------------------------------------------

  - id: eng.sounds.hear-english-sounds
    strand: sounds
    checkpoint: 2
    refs: [KM13329]
    needs: []
    i_can:
      nob: Jeg kan høre engelske lyder som ikke finnes på norsk.
      eng: I can hear English sounds that Norwegian does not have.
    teacher:
      nob: "Hører forskjell på three og tree, wet og vet, zoo og Sue. Ikke ennå: hører dem som samme ord."
      eng: "Hears the difference between three and tree, wet and vet, zoo and Sue. Not yet: hears them as the same word."
    stages: [concrete, pictorial]
    misconceptions: [th-sound-replaced, w-said-as-v, z-said-as-s]
    assessable: true
    reviewed: false

  - id: eng.sounds.clap-syllables
    strand: sounds
    checkpoint: 2
    refs: [KM13329]
    needs: []
    i_can:
      nob: Jeg kan klappe stavelsene i et engelsk ord.
      eng: I can clap the syllables in an English word.
    teacher:
      nob: "Klapper ba-na-na i tre og el-e-phant i tre. Ikke ennå: klapper én gang per ord."
      eng: "Claps ba-na-na and el-e-phant as three beats each. Not yet: claps once per word."
    stages: [concrete, pictorial]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: eng.sounds.link-sounds-letters
    strand: sounds
    checkpoint: 2
    refs: [KM13330]
    needs: [eng.sounds.hear-english-sounds]
    i_can:
      nob: Jeg vet hvilken lyd sh, ch og th har på engelsk.
      eng: I know the sounds of sh, ch and th.
    teacher:
      nob: "Sier riktig lyd for sh, ch, th og de vanlige enkeltbokstavene, og ser sh som én lyd. Ikke ennå: leser bokstavene med norske lyder (s-h for sh)."
      eng: "Says the right sound for sh, ch, th and the common single letters, and treats sh as one sound. Not yet: reads letters with Norwegian sounds (s-h for sh)."
    stages: [concrete, pictorial, abstract]
    misconceptions: [reads-letters-the-norwegian-way, th-sound-replaced]
    assessable: true
    reviewed: false

  - id: eng.sounds.blend-words
    strand: sounds
    checkpoint: 2
    refs: [KM13330]
    needs: [eng.sounds.link-sounds-letters]
    i_can:
      nob: Jeg kan trekke engelske lyder sammen til et ord.
      eng: I can blend English sounds into a word.
    teacher:
      nob: "Leser ship, chip og cat ved å trekke lydene sammen, med sh og ch som én flis. Ikke ennå: gjetter ut fra første bokstav."
      eng: "Reads ship, chip and cat by blending, with sh and ch as single tiles. Not yet: guesses from the first letter."
    stages: [concrete, pictorial, abstract]
    misconceptions: [guesses-from-first-letter]
    assessable: true
    reviewed: false

  - id: eng.sounds.alphabet
    strand: sounds
    checkpoint: 2
    refs: [KM13331]
    needs: []
    i_can:
      nob: Jeg kan det engelske alfabetet.
      eng: I know the English alphabet.
    teacher:
      nob: "Synger eller sier alfabetet på engelsk og kjenner igjen bokstavnavnene når hun hører dem. Ikke ennå: blander engelsk e og i, eller a og e."
      eng: "Sings or says the English alphabet and recognises letter names when heard. Not yet: mixes up English e and i, or a and e."
    stages: [concrete, pictorial]
    misconceptions: [norwegian-letter-names]
    assessable: true
    reviewed: false

  - id: eng.words.high-frequency-words
    strand: words
    checkpoint: 2
    refs: [KM13334]
    needs: []
    i_can:
      nob: Jeg kjenner igjen vanlige engelske ord i en tekst.
      eng: I can spot common English words in a text.
    teacher:
      nob: "Finner the, and, is, I og you i en kort tekst eller på en plakat. Ikke ennå: kjenner bare igjen ord med bilde ved siden av."
      eng: "Finds the, and, is, I and you in a short text or on a poster. Not yet: recognises only words with a picture beside them."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: eng.words.shared-words
    strand: words
    checkpoint: 2
    refs: [KM13335]
    needs: []
    i_can:
      nob: Jeg kan finne ord som er like på engelsk og norsk.
      eng: I can find words that are alike in English and Norwegian.
    teacher:
      nob: "Parer hand, finger, arm og sofa med de norske ordene og legger merke til ulik uttale. Ikke ennå: ser ikke at hand og hånd henger sammen."
      eng: "Matches hand, finger, arm and sofa with the Norwegian words and notices the different pronunciation. Not yet: does not see that hand and hånd are related."
    stages: [pictorial]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: eng.words.hear-real-speakers
    strand: words
    checkpoint: 2
    refs: [KM13338]
    needs: []
    i_can:
      nob: Jeg kan høre på engelsk fra ekte folk på nettet.
      eng: I can listen to real English speakers online.
    teacher:
      nob: "Lytter til en sang, et klipp eller en person på engelsk og sier ett ord hun forsto. Ikke ennå: slutter å lytte når hun ikke forstår alt."
      eng: "Listens to a song, clip or person in English and names one word she understood. Not yet: stops listening when she does not understand everything."
    stages: [concrete]
    misconceptions: []
    assessable: false
    reviewed: false

  - id: eng.reading.picture-book
    strand: reading
    checkpoint: 2
    refs: [KM13336]
    needs: []
    i_can:
      nob: Jeg kan følge med når noen leser en engelsk bildebok.
      eng: I can follow an English picture book read aloud.
    teacher:
      nob: "Peker på riktig bilde når en setning leses, og svarer på et enkelt spørsmål om handlingen. Ikke ennå: forteller bare om bildene, ikke om det som ble lest."
      eng: "Points to the right picture as a line is read and answers a simple question on the plot. Not yet: talks only about the pictures, not what was read."
    stages: [pictorial]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: eng.conversation.simple-questions
    strand: conversation
    checkpoint: 2
    refs: [KM13332]
    needs: []
    i_can:
      nob: Jeg kan spørre og svare på enkle spørsmål på engelsk.
      eng: I can ask and answer simple questions in English.
    teacher:
      nob: "Svarer på What is your name og How old are you, og kan stille de samme spørsmålene. Ikke ennå: svarer med ett norsk ord."
      eng: "Answers What is your name and How old are you, and can ask them back. Not yet: answers with a single Norwegian word."
    stages: [concrete, pictorial]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: eng.conversation.follow-instructions
    strand: conversation
    checkpoint: 2
    refs: [KM13332]
    needs: []
    i_can:
      nob: Jeg kan gjøre det en enkel engelsk beskjed sier.
      eng: I can follow a simple instruction in English.
    teacher:
      nob: "Gjør det Touch your nose, Stand up og Open your book sier. Ikke ennå: ser på de andre og gjør som dem."
      eng: "Does what Touch your nose, Stand up and Open your book say. Not yet: watches the others and copies them."
    stages: [concrete, pictorial]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: eng.conversation.polite-phrases
    strand: conversation
    checkpoint: 2
    refs: [KM13332]
    needs: []
    i_can:
      nob: Jeg kan si please, thank you og sorry.
      eng: I can say please, thank you and sorry.
    teacher:
      nob: "Velger please når hun ber om noe og thank you når hun får det. Ikke ennå: ber om ting uten please fordi det ikke trengs på norsk."
      eng: "Picks please when asking for something and thank you when given it. Not yet: asks without please, because Norwegian does not need it."
    stages: [concrete, pictorial]
    misconceptions: [omits-please]
    assessable: true
    reviewed: false

  - id: eng.conversation.rehearsed-dialogue
    strand: conversation
    checkpoint: 2
    refs: [KM13333]
    needs: [eng.conversation.simple-questions, eng.conversation.polite-phrases]
    i_can:
      nob: Jeg kan være med i en innøvd samtale om meg selv.
      eng: I can take part in a practised talk about me.
    teacher:
      nob: "Velger riktig replikk i en innøvd dialog om hva hun liker, hvordan hun har det og hva hun gjør. Ikke ennå: velger en replikk som ikke svarer på det som ble spurt."
      eng: "Picks the right line in a rehearsed dialogue about what she likes, how she feels and what she does. Not yet: picks a line that does not answer what was asked."
    stages: [concrete, pictorial]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: eng.writing.familiar-words
    strand: writing
    checkpoint: 2
    refs: [KM13339]
    needs: [eng.sounds.link-sounds-letters]
    i_can:
      nob: Jeg kan skrive engelske ord jeg kjenner.
      eng: I can write English words I know.
    teacher:
      nob: "Skriver cat, dog, red og mum etter diktat. Ikke ennå: staver dem på norsk (kæt, dåg)."
      eng: "Writes cat, dog, red and mum from dictation. Not yet: spells them the Norwegian way (kæt, dåg)."
    stages: [pictorial, abstract]
    misconceptions: [spells-the-norwegian-way]
    assessable: true
    reviewed: false

  - id: eng.writing.simple-sentences
    strand: writing
    checkpoint: 2
    refs: [KM13339]
    needs: [eng.writing.familiar-words]
    i_can:
      nob: Jeg kan lage en kort engelsk setning.
      eng: I can make a short English sentence.
    teacher:
      nob: "Bygger I like cats. og This is my dog. av ordbrikker. Ikke ennå: legger brikkene i tilfeldig rekkefølge."
      eng: "Builds I like cats. and This is my dog. from word tiles. Not yet: lays the tiles in random order."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: eng.culture.childrens-books
    strand: culture
    checkpoint: 2
    refs: [KM13337]
    needs: [eng.reading.picture-book]
    i_can:
      nob: Jeg kan lære nye ord og skikker fra engelske barnebøker.
      eng: I can learn new words and customs from English children's books.
    teacher:
      nob: "Forteller om noe fra en engelsk barnebok som er annerledes enn hjemme, og bruker et nytt ord fra den. Ikke ennå: husker bare bildene."
      eng: "Tells about something in an English children's book that differs from home and uses a new word from it. Not yet: remembers only the pictures."
    stages: [concrete]
    misconceptions: []
    assessable: false
    reviewed: false

  # ---- etter 4. trinn -------------------------------------------------------

  - id: eng.sounds.read-regular-words
    strand: sounds
    checkpoint: 4
    refs: [KM13347]
    needs: [eng.sounds.blend-words]
    i_can:
      nob: Jeg kan lese engelske ord som skrives slik de uttales.
      eng: I can read English words that are spelled as they sound.
    teacher:
      nob: "Leser ukjente lydrette ord som sting, crab og chest uten hjelp. Ikke ennå: trenger å høre ordet først."
      eng: "Reads unfamiliar regular words such as sting, crab and chest unaided. Not yet: needs to hear the word first."
    stages: [pictorial, abstract]
    misconceptions: [reads-letters-the-norwegian-way]
    assessable: true
    reviewed: false

  - id: eng.sounds.tricky-words
    strand: sounds
    checkpoint: 4
    refs: [KM13347]
    needs: [eng.sounds.blend-words]
    i_can:
      nob: Jeg kjenner igjen vanlige ord som ikke skrives slik de uttales.
      eng: I know common words that are not spelled as they sound.
    teacher:
      nob: "Leser said, one, would og the med en gang, uten å lydere. Ikke ennå: lyderer dem bokstav for bokstav (sa-id)."
      eng: "Reads said, one, would and the on sight without sounding out. Not yet: sounds them out letter by letter (sa-id)."
    stages: [pictorial, abstract]
    misconceptions: [sounds-out-irregular-words]
    assessable: true
    reviewed: false

  - id: eng.sounds.pronunciation-play
    strand: sounds
    checkpoint: 4
    refs: [KM13340]
    needs: [eng.sounds.hear-english-sounds]
    i_can:
      nob: Jeg kan si th, w og z riktig i sanger og lek.
      eng: I can say th, w and z right in songs and games.
    teacher:
      nob: "Sier think, this, window og zoo med riktige lyder i en rim- eller sangaktivitet. Ikke ennå: sier tink, dis, vindow og soo."
      eng: "Says think, this, window and zoo with the right sounds in a rhyme or song. Not yet: says tink, dis, vindow and soo."
    stages: [concrete, pictorial]
    misconceptions: [th-sound-replaced, w-said-as-v, z-said-as-s]
    assessable: true
    reviewed: false

  - id: eng.sounds.spell-aloud
    strand: sounds
    checkpoint: 4
    refs: [KM13340]
    needs: [eng.sounds.alphabet]
    i_can:
      nob: Jeg kan stave navnet mitt høyt på engelsk.
      eng: I can spell my name aloud in English.
    teacher:
      nob: "Staver navnet sitt og korte ord med engelske bokstavnavn, og skriver ned ord som blir stavet for henne. Ikke ennå: bruker norske bokstavnavn."
      eng: "Spells her name and short words with English letter names, and writes down words spelled to her. Not yet: uses Norwegian letter names."
    stages: [concrete, abstract]
    misconceptions: [norwegian-letter-names]
    assessable: true
    reviewed: false

  - id: eng.words.small-words
    strand: words
    checkpoint: 4
    refs: [KM13341]
    needs: [eng.words.high-frequency-words]
    i_can:
      nob: Jeg kan bruke små ord som in, on og under.
      eng: I can use small words like in, on and under.
    teacher:
      nob: "Plasserer en katt in, on og under en boks etter beskjed, og bruker ordene selv. Ikke ennå: bruker in for alt."
      eng: "Places a cat in, on and under a box on instruction and uses the words herself. Not yet: uses in for everything."
    stages: [concrete, pictorial]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: eng.words.ask-for-help
    strand: words
    checkpoint: 4
    refs: [KM13341]
    needs: [eng.conversation.polite-phrases]
    i_can:
      nob: Jeg kan be om hjelp på engelsk når jeg ikke forstår.
      eng: I can ask for help in English when I do not understand.
    teacher:
      nob: "Sier Can you say that again, please? eller What does it mean? Ikke ennå: bytter til norsk eller sier ingenting."
      eng: "Says Can you say that again, please? or What does it mean? Not yet: switches to Norwegian or says nothing."
    stages: [concrete, pictorial]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: eng.words.use-a-dictionary
    strand: words
    checkpoint: 4
    refs: [KM13343]
    needs: [eng.sounds.alphabet]
    i_can:
      nob: Jeg kan slå opp et ord i en ordbok.
      eng: I can look up a word in a dictionary.
    teacher:
      nob: "Finner et ord i en bildeordbok eller en enkel ordbok ved å bruke alfabetisk rekkefølge. Ikke ennå: blar tilfeldig."
      eng: "Finds a word in a picture or simple dictionary using alphabetical order. Not yet: leafs through at random."
    stages: [concrete, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: eng.words.false-friends
    strand: words
    checkpoint: 4
    refs: [KM13346]
    needs: [eng.words.shared-words]
    i_can:
      nob: Jeg vet at noen ord ser norske ut, men betyr noe annet.
      eng: I know some words look Norwegian but mean something else.
    teacher:
      nob: "Sorterer ord i betyr det samme og betyr noe annet, og vet at eventually ikke er eventuelt, become ikke er bli og actually ikke er aktuelt. Ikke ennå: oversetter ord som ligner, direkte."
      eng: "Sorts words into means the same and means something else, and knows eventually is not eventuelt, become is not bli, and actually is not aktuelt. Not yet: translates look-alike words directly."
    stages: [pictorial, abstract]
    misconceptions: [false-friend-eventually, false-friend-become, false-friend-actually]
    assessable: true
    reviewed: false

  - id: eng.words.digital-resources
    strand: words
    checkpoint: 4
    refs: [KM13351]
    needs: [eng.words.hear-real-speakers]
    i_can:
      nob: Jeg kan bruke nettet til å lære og bruke engelsk.
      eng: I can use the internet to learn and use English.
    teacher:
      nob: "Slår opp tre ord i en nettordbok og hører uttalen, og skriver hvilket som overrasket henne. Ikke ennå: bruker bare oversettelse uten å lytte."
      eng: "Looks up three words in an online dictionary, listens to them, and writes which surprised her. Not yet: only uses a translator without listening."
    stages: [concrete]
    misconceptions: []
    assessable: false
    reviewed: false

  - id: eng.reading.adapted-texts
    strand: reading
    checkpoint: 4
    refs: [KM13354]
    needs: [eng.reading.picture-book]
    i_can:
      nob: Jeg forstår ord og uttrykk i enkle engelske tekster.
      eng: I understand words and phrases in simple English texts.
    teacher:
      nob: "Lytter til eller leser en tilrettelagt tekst og velger riktig bilde eller svar. Ikke ennå: forstår enkeltord, men ikke hva setningen sier."
      eng: "Listens to or reads an adapted text and picks the right picture or answer. Not yet: understands single words but not what the sentence says."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: eng.reading.guess-from-context
    strand: reading
    checkpoint: 4
    refs: [KM13348]
    needs: [eng.reading.adapted-texts]
    i_can:
      nob: Jeg kan gjette et nytt ord ut fra resten av setningen.
      eng: I can guess a new word from the rest of the sentence.
    teacher:
      nob: "Trykker på ordene som hjalp henne å gjette, og velger riktig betydning. Ikke ennå: gjetter ut fra hvordan ordet ser ut alene."
      eng: "Taps the words that helped her guess and picks the right meaning. Not yet: guesses from how the word looks on its own."
    stages: [abstract]
    misconceptions: [guesses-from-word-shape]
    assessable: true
    reviewed: false

  - id: eng.reading.talk-about-texts
    strand: reading
    checkpoint: 4
    refs: [KM13349]
    needs: [eng.reading.adapted-texts]
    i_can:
      nob: Jeg kan si hva en engelsk tekst handler om.
      eng: I can say what an English text is about.
    teacher:
      nob: "Velger setningen som sier hva en bildebok, et dikt eller en kort faktatekst handler om. Ikke ennå: velger en detalj som tilfeldigvis står der."
      eng: "Picks the sentence that says what a picture book, poem or short factual text is about. Not yet: picks a detail that happens to appear in it."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true
    reviewed: false

  - id: eng.grammar.word-classes
    strand: grammar
    checkpoint: 4
    refs: [KM13344]
    needs: []
    i_can:
      nob: Jeg kan finne substantiv, verb og adjektiv i en engelsk tekst.
      eng: I can find nouns, verbs and adjectives in English.
    teacher:
      nob: "Trykker på alle verbene i en kort tilrettelagt tekst, og vet at run kan være substantiv i a run. Ikke ennå: bestemmer ordklasse bare ut fra betydningen."
      eng: "Taps every verb in a short adapted text and knows run can be a noun in a run. Not yet: decides class from meaning alone."
    stages: [pictorial, abstract]
    misconceptions: [class-from-meaning-alone]
    assessable: true
    reviewed: false

  - id: eng.grammar.word-order
    strand: grammar
    checkpoint: 4
    refs: [KM13345]
    needs: [eng.writing.simple-sentences]
    i_can:
      nob: Jeg kan sette engelske ord i riktig rekkefølge.
      eng: I can put English words in the right order.
    teacher:
      nob: "Bygger Yesterday I played football med subjektet foran verbet, også når setningen starter med et tidsord. Ikke ennå: bygger Yesterday played I football, med norsk ordstilling."
      eng: "Builds Yesterday I played football with the subject before the verb, even after a time word. Not yet: builds Yesterday played I football, with Norwegian word order."
    stages: [pictorial, abstract]
    misconceptions: [verb-second-transfer]
    assessable: true
    reviewed: false

  - id: eng.grammar.do-questions
    strand: grammar
    checkpoint: 4
    refs: [KM13345]
    needs: [eng.grammar.word-order]
    i_can:
      nob: Jeg kan lage spørsmål med do, som Do you like pizza?
      eng: I can make questions with do, like Do you like pizza?
    teacher:
      nob: "Bygger Do you like pizza? og Does she play? av ordbrikker. Ikke ennå: bygger Like you pizza? slik det ville vært på norsk."
      eng: "Builds Do you like pizza? and Does she play? from tiles. Not yet: builds Like you pizza?, as Norwegian would."
    stages: [pictorial, abstract]
    misconceptions: [do-support-missing]
    assessable: true
    reviewed: false

  - id: eng.grammar.simple-spelling-rules
    strand: grammar
    checkpoint: 4
    refs: [KM13345]
    needs: [eng.writing.familiar-words]
    i_can:
      nob: Jeg kan enkle staveregler, som stor I og flertall med s.
      eng: I know simple spelling rules, like capital I and plural s.
    teacher:
      nob: "Skriver I alltid med stor bokstav og legger til -s i flertall (two cats). Ikke ennå: skriver liten i, eller lager flertall på norsk (two catter)."
      eng: "Always writes I as a capital and adds -s for plurals (two cats). Not yet: writes a small i, or makes Norwegian plurals (two catter)."
    stages: [pictorial, abstract]
    misconceptions: [lowercase-pronoun-i, norwegian-plural-ending]
    assessable: true
    reviewed: false

  - id: eng.conversation.needs-and-feelings
    strand: conversation
    checkpoint: 4
    refs: [KM13342]
    needs: [eng.conversation.rehearsed-dialogue, eng.words.ask-for-help]
    i_can:
      nob: Jeg kan snakke om hva jeg trenger, føler og liker.
      eng: I can talk about what I need, feel and like.
    teacher:
      nob: "Velger passende og høflige replikker gjennom hele kafédialogen, og venter på tur. Ikke ennå: velger en uhøflig replikk (Give me a juice) og får et bokstavelig svar."
      eng: "Picks fitting, polite lines through the whole café dialogue and waits her turn. Not yet: picks a rude line (Give me a juice) and gets a literal reply."
    stages: [concrete, pictorial]
    misconceptions: [omits-please]
    assessable: true
    reviewed: false

  - id: eng.conversation.partner-dialogue
    strand: conversation
    checkpoint: 4
    refs: [KM13342]
    needs: [eng.conversation.needs-and-feelings]
    i_can:
      nob: Jeg kan ha kafésamtalen med en partner.
      eng: I can have the café talk with a partner.
    teacher:
      nob: "Har kafésamtalen med en partner med manuskort, og bytter roller. Ikke ennå: trenger at partneren sier alt først."
