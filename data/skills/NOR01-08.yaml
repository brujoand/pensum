    teacher:
      nob: "Velger nærlesing for en oppskrift, leting for et telefonnummer og skumlesing for å se om en tekst er nyttig. Ikke ennå: bruker samme lesemåte til alt."
      eng: "Chooses close reading for a recipe, scanning for a phone number and skimming to judge if a text is useful. Not yet: reads every text the same way."
