# Naturfag, kompetansemål etter 2. trinn (NAT01-05 / KV1075).
#
# Written for 6- and 7-year-olds: one short sentence per prompt, concrete
# nouns, no subordinate clauses, multiple choice throughout. Only settled
# science; goals about exploring, presenting and discussing are recorded as
# not assessable rather than answered with a proxy question.
#
# Questions here are ours, not Udir's. The competence goals they test are quoted
# verbatim elsewhere; nothing in this file is official curriculum text.
---
subject: NAT01-05
goal_set: KV1075

items:
  - id: KM13809-01
    goal: KM13809
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Per legger sammen alle tingene som er harde. Hvilken ting hører med?
      en: Per is putting together all the things that are hard. Which one belongs?
    choices:
      - id: a
        text:
          nb: En stein
          en: A stone
        correct: true
      - id: b
        text:
          nb: En ullsokk
          en: A wool sock
      - id: c
        text:
          nb: En svamp
          en: A sponge
    explanation:
      nb: En stein er hard når du klemmer på den. Ullsokken og svampen er myke.
      en: A stone is hard when you squeeze it. The sock and the sponge are soft.

  - id: KM13809-02
    goal: KM13809
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Du setter et glass med vann i fryseren. Hva skjer med vannet?
      en: You put a glass of water in the freezer. What happens to the water?
    choices:
      - id: a
        text:
          nb: Det blir til is
          en: It turns into ice
        correct: true
      - id: b
        text:
          nb: Det blir borte
          en: It disappears
      - id: c
        text:
          nb: Det blir til sand
          en: It turns into sand
    explanation:
      nb: Vann blir hardt og til is når det blir kaldt nok. Blir det varmt igjen,
        smelter isen og blir vann.
      en: Water becomes hard ice when it gets cold enough. Warm it up again and
        the ice melts back into water.

  - id: KM13810-01
    goal: KM13810
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Haren i fjellet har hvit pels om vinteren. Hvorfor er det bra for haren?
      en: The mountain hare has white fur in winter. Why is that good for the hare?
    choices:
      - id: a
        text:
          nb: Den er vanskelig å se i snøen
          en: It is hard to see in the snow
        correct: true
      - id: b
        text:
          nb: Den løper fortere
          en: It runs faster
      - id: c
        text:
          nb: Den blir større
          en: It grows bigger
    explanation:
      nb: Hvit pels gjør at haren gjemmer seg godt i snøen. Da er det vanskeligere
        for rev og ørn å finne den.
      en: White fur lets the hare hide well in the snow, so foxes and eagles have
        a harder time finding it.

  - id: KM13810-02
    goal: KM13810
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Hvor finner du meitemarken?
      en: Where do you find the earthworm?
    choices:
      - id: a
        text:
          nb: I jorda
          en: In the soil
        correct: true
      - id: b
        text:
          nb: Høyt oppe i treet
          en: High up in the tree
      - id: c
        text:
          nb: På himmelen
          en: In the sky
    explanation:
      nb: Meitemarken graver ganger i jorda og spiser gamle blader. Den har verken
        bein eller vinger.
      en: The earthworm digs tunnels in the soil and eats old leaves. It has
        neither legs nor wings.

  - id: KM13811-01
    goal: KM13811
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Bladene på trærne blir gule og faller av. Hvilken årstid er det?
      en: The leaves on the trees turn yellow and fall off. Which season is it?
    choices:
      - id: a
        text:
          nb: Høst
          en: Autumn
        correct: true
      - id: b
        text:
          nb: Vår
          en: Spring
      - id: c
        text:
          nb: Sommer
          en: Summer
    explanation:
      nb: Om høsten blir det kaldere og mørkere, og mange trær mister bladene sine.
      en: In autumn it gets colder and darker, and many trees lose their leaves.

  - id: KM13811-02
    goal: KM13811
    type: multiple_choice
    difficulty: 3
    prompt:
      nb: I samisk tradisjon deler man året inn i åtte årstider. Hvor mange
        årstider deler vi året inn i ellers i Norge?
      en: Sami tradition divides the year into eight seasons. How many seasons do
        we otherwise divide the year into in Norway?
    choices:
      - id: a
        text:
          nb: "Fire"
          en: "Four"
        correct: true
      - id: b
        text:
          nb: "To"
          en: "Two"
      - id: c
        text:
          nb: "Tolv"
          en: "Twelve"
    explanation:
      nb: Vi snakker vanligvis om vår, sommer, høst og vinter. I samisk tradisjon
        er året delt i åtte årstider, som følger reinen og arbeidet gjennom året.
      en: We usually speak of spring, summer, autumn and winter. Sami tradition
        divides the year into eight seasons, following the reindeer and the work
        of the year.

  - id: KM13812-01
    goal: KM13812
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Hva bruker vi et termometer til?
      en: What do we use a thermometer for?
    choices:
      - id: a
        text:
          nb: Å måle hvor varmt eller kaldt det er
          en: To measure how warm or cold it is
        correct: true
      - id: b
        text:
          nb: Å måle hvor tungt noe er
          en: To measure how heavy something is
      - id: c
        text:
          nb: Å måle hvor lang tid noe tar
          en: To measure how long something takes
    explanation:
      nb: Termometeret viser temperaturen. Vekt måler hvor tungt noe er, og klokka
        måler tid.
      en: A thermometer shows the temperature. Scales measure weight, and a clock
        measures time.

  - id: KM13812-02
    goal: KM13812
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hva er det som gir oss lys og varme om dagen?
      en: What gives us light and warmth during the day?
    choices:
      - id: a
        text:
          nb: Sola
          en: The Sun
        correct: true
      - id: b
        text:
          nb: Månen
          en: The Moon
      - id: c
        text:
          nb: Skyene
          en: The clouds
    explanation:
      nb: Sola er en stjerne som gir lys og varme. Månen lyser ikke selv, og skyer
        gir bare skygge og regn.
      en: The Sun is a star that gives light and warmth. The Moon does not shine
        by itself, and clouds only give shade and rain.

  - id: KM13813-01
    goal: KM13813
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Du kjenner at eplet smaker søtt. Hvilken sans bruker du?
      en: You notice that the apple tastes sweet. Which sense are you using?
    choices:
      - id: a
        text:
          nb: Smakssansen
          en: Taste
        correct: true
      - id: b
        text:
          nb: Hørselen
          en: Hearing
      - id: c
        text:
          nb: Synet
          en: Sight
    explanation:
      nb: Vi smaker med tunga. Med ørene hører vi, og med øynene ser vi.
      en: We taste with the tongue. We hear with our ears and see with our eyes.

  - id: KM13813-02
    goal: KM13813
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Du lukker øynene og kjenner at genseren er myk. Hvilken sans bruker du?
      en: You close your eyes and feel that the jumper is soft. Which sense are
        you using?
    choices:
      - id: a
        text:
          nb: Følesansen
          en: Touch
        correct: true
      - id: b
        text:
          nb: Luktesansen
          en: Smell
      - id: c
        text:
          nb: Synet
          en: Sight
    explanation:
      nb: Med huden kjenner vi om noe er mykt, hardt, varmt eller kaldt. Det
        kalles følesansen.
      en: With our skin we feel whether something is soft, hard, warm or cold.
        That is the sense of touch.

  - id: KM13814-01
    goal: KM13814
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Hva er lurt å gjøre før du spiser, så du ikke blir syk av bakterier?
      en: What is a good thing to do before you eat, so germs do not make you ill?
    choices:
      - id: a
        text:
          nb: Vaske hendene med såpe og vann
          en: Wash your hands with soap and water
        correct: true
      - id: b
        text:
          nb: Tørke hendene på buksa
          en: Wipe your hands on your trousers
      - id: c
        text:
          nb: Puste dypt inn
          en: Take a deep breath
    explanation:
      nb: Såpe og vann fjerner bakterier og virus fra hendene. Da er det mindre
        sjanse for at de kommer inn i munnen med maten.
      en: Soap and water remove bacteria and viruses from your hands, so they are
        less likely to reach your mouth with the food.

  - id: KM13814-02
    goal: KM13814
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Du er forkjølet og må hoste. Hvor bør du hoste?
      en: You have a cold and need to cough. Where should you cough?
    choices:
      - id: a
        text:
          nb: I albuen
          en: Into your elbow
        correct: true
      - id: b
        text:
          nb: I hendene
          en: Into your hands
      - id: c
        text:
          nb: Rett ut i lufta
          en: Straight out into the air
    explanation:
      nb: Når du hoster i albuen, blir smitten der. Hoster du i hendene, tar du
        på dørhåndtak og leker etterpå og sprer den videre.
      en: Coughing into your elbow keeps the germs there. If you cough into your
        hands, you then touch door handles and toys and spread them further.

  - id: KM13815-01
    goal: KM13815
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Du finner et sjokoladepapir på bakken i skogen. Hva er best å gjøre?
      en: You find a chocolate wrapper on the ground in the forest. What is the
        best thing to do?
    choices:
      - id: a
        text:
          nb: Ta det med og kaste det i en søppelbøtte
          en: Take it with you and put it in a bin
        correct: true
      - id: b
        text:
          nb: Grave det ned under et tre
          en: Bury it under a tree
      - id: c
        text:
          nb: La det ligge
          en: Leave it lying there
    explanation:
      nb: Papir og plast blir liggende lenge i naturen og kan skade dyr. Søppel
        hører hjemme i en søppelbøtte.
      en: Paper and plastic stay in nature for a long time and can harm animals.
        Litter belongs in a bin.

  - id: KM13809-03
    goal: KM13809
    type: sort
    stage: pictorial
    difficulty: 1
    prompt:
      nb: Hva flyter, og hva synker i vann?
      en: What floats and what sinks in water?
    activity:
      alt:
        nb: Seks kort med ting, og to bokser som heter «Flyter» og «Synker».
        en: Six cards with things on them, and two boxes called "Floats" and "Sinks".
      bins:
        - nb: Flyter
          en: Floats
        - nb: Synker
          en: Sinks
      cards:
        - text:
            nb: en kork
            en: a cork
          bin: 0
        - text:
            nb: en stein
            en: a stone
          bin: 1
        - text:
            nb: et tørt blad
            en: a dry leaf
          bin: 0
        - text:
            nb: en nøkkel
            en: a key
          bin: 1
        - text:
            nb: en pinne av tre
            en: a wooden stick
          bin: 0
        - text:
            nb: en spiker
            en: a nail
          bin: 1
    explanation:
      nb: >-
        Kork, tre og tørre blader er lette for sin størrelse, så de flyter.
        Stein og metall er tunge for sin størrelse, så de synker.
      en: >-
        Cork, wood and dry leaves are light for their size, so they float.
        Stone and metal are heavy for their size, so they sink.

  # --- Simulations ---------------------------------------------------------
  # Predict, watch, explain (`explore_sim`): the prediction is recorded and
  # never marked; the explanation is graded.

  - id: KM13809-04
    goal: KM13809
    type: explore_sim
    stage: pictorial
    skill: nat.materials.floats-or-sinks
    difficulty: 2
    prompt:
      nb: Legg ting i vannet. Flyter de, eller synker de?
      en: Put things in the water. Do they float or sink?
    activity:
      alt:
        nb: En tank med vann. En kork ligger i vannet.
        en: A tank of water. A cork is in the water.
      model: floats_sinks
      objects:
        - label:
            nb: Korken
            en: cork
          density: 0.24
        - label:
            nb: Treklossen
            en: wooden block
          density: 0.6
        - label:
            nb: Isbiten
            en: ice cube
          density: 0.92
        - label:
            nb: Steinen
            en: stone
          density: 2.6
        - label:
            nb: Spikeren
            en: nail
          density: 7.8
      start: 0
      predict:
        prompt:
          nb: Hva tror du skjer med steinen?
          en: What do you think happens to the stone?
        choices:
          - id: flyter
            text:
              nb: Den flyter.
              en: It floats.
          - id: synker
            text:
              nb: Den synker.
              en: It sinks.
      explain:
        prompt:
          nb: Alle tingene er like store. Hvorfor synker steinen?
          en: All the things are the same size. Why does the stone sink?
        choices:
          - id: tung
            text:
              nb: Den er tung for størrelsen sin.
              en: It is heavy for its size.
          - id: stor
            text:
              nb: Den er større enn korken.
              en: It is bigger than the cork.
          - id: kald
            text:
              nb: Den er kaldere enn vannet.
              en: It is colder than the water.
        answer: tung
    explanation:
      nb: >-
        Tingene er like store, men steinen og spikeren er tunge for størrelsen
        sin. De synker. Korken og treet er lette for størrelsen sin. De flyter.
      en: >-
        The things are the same size, but the stone and the nail are heavy for
        their size. They sink. The cork and the wood are light for their size.
        They float.

# Goals that no written question can honestly test. Recorded rather than
# omitted, so the gap is a stated judgement instead of a silent one.
not_assessable:
  - goal: KM13806
    reason: >-
      Asks the pupil to wonder, explore and pose their own questions, tied to
      their own or others' experiences. The goal is the asking, not the
      answering; a question with one correct answer inverts it entirely.

  - goal: KM13807
    reason: >-
      Asks the pupil to present their own findings and describe how they arrived
      at them. There are no findings without an investigation the pupil actually
      carried out, and presenting is an oral performance a teacher observes.

  - goal: KM13808
    reason: >-
      Asks the pupil to present their own ideas for technological inventions.
      An invented idea is by definition the pupil's own, so there is nothing for
      a quiz to mark right or wrong.
