      nob: "Bruker tilbakemeldingskortet: én ting som virker og én ting å prøve, og endrer egen tekst etter det hun fikk. Ikke ennå: sier bare bra, eller endrer ingenting."
      eng: "Uses the feedback card, one this-works and one try-this, and changes her own text from what she got. Not yet: only says good, or changes nothing."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.writing.multimedia-texts
    strand: writing
    checkpoint: 7
    refs: [KM14183]
    needs: [nor.writing.multimedia-poster]
    i_can:
      nob: Jeg kan lage en tekst der bilder og ord virker sammen.
      eng: I can make a text where pictures and words work together.
    teacher:
      nob: "Lager en sammensatt tekst og sier hva bildet gjør som teksten ikke gjør. Ikke ennå: bildet gjentar bare det teksten sier."
      eng: "Makes a multimedia text and says what the picture does that the words do not. Not yet: the picture only repeats the text."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.literature.purpose-form-content
    strand: literature
    checkpoint: 7
    refs: [KM14176]
    needs: [nor.literature.what-text-means]
    i_can:
      nob: Jeg kan si hva en tekst vil, og hvordan den er bygd.
      eng: I can say a text's purpose, form and content.
    teacher:
      nob: "Sier at et dikt vil vekke en følelse, har vers og rim, og handler om savn, også for tekster på nynorsk, svensk og dansk. Ikke ennå: forteller bare handlingen."
      eng: "Says a poem wants to stir a feeling, has verses and rhyme, and is about longing, for texts in nynorsk, Swedish and Danish too. Not yet: only retells the plot."
    stages: [abstract]
    misconceptions: []
    assessable: true

