# Matematikk, kompetansemål etter 5. trinn (MAT01-06 / KV1024).
#
# Questions here are ours, not Udir's. The competence goals they test are quoted
# verbatim elsewhere; nothing in this file is official curriculum text.
---
subject: MAT01-06
goal_set: KV1024

items:
  - id: KM13265-01
    goal: KM13265
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Halvparten av klassen går på ski. Hvor mange prosent er det?
      en: Half the class goes skiing. What percentage is that?
    choices:
      - id: a
        text:
          nb: "5 %"
          en: "5%"
      - id: b
        text:
          nb: "50 %"
          en: "50%"
        correct: true
      - id: c
        text:
          nb: "100 %"
          en: "100%"
    explanation:
      nb: Prosent betyr hundredeler. En halv er 50 av 100, altså 50 %.
      en: Percent means hundredths. One half is 50 out of 100, so 50%.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13265-02
    goal: KM13265
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hvilket desimaltall er like mye som 1/4?
      en: Which decimal number is the same as 1/4?
    choices:
      - id: a
        text:
          nb: "0,14"
          en: "0.14"
      - id: b
        text:
          nb: "0,25"
          en: "0.25"
        correct: true
      - id: c
        text:
          nb: "1,4"
          en: "1.4"
    explanation:
      nb: En firedel av 100 er 25. Derfor er 1/4 det samme som 25 hundredeler,
        som skrives 0,25.
      en: A quarter of 100 is 25, so 1/4 is 25 hundredths, written 0.25.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13266-01
    goal: KM13266
    type: numeric
    difficulty: 2
    prompt:
      nb: Det er 12 epler i en kurv. Hvor mange er 3/4 av eplene?
      en: There are 12 apples in a basket. How many is 3/4 of the apples?
    answer: 9
    explanation:
      nb: Del 12 i fire like deler, det blir 3 i hver. Tre slike deler er
        3 · 3 = 9.
      en: Split 12 into four equal parts of 3. Three of those parts is
        3 · 3 = 9.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13266-02
    goal: KM13266
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: På en tallinje fra 0 til 1 står det et merke midt mellom 0 og 1/2.
        Hvilken brøk er det?
      en: On a number line from 0 to 1 there is a mark halfway between 0 and
        1/2. Which fraction is it?
    choices:
      - id: a
        text:
          nb: "1/4"
          en: "1/4"
        correct: true
      - id: b
        text:
          nb: "1/3"
          en: "1/3"
      - id: c
        text:
          nb: "2/3"
          en: "2/3"
    explanation:
      nb: Halvparten av en halv er en firedel. Derfor står merket på 1/4.
      en: Half of a half is a quarter, so the mark is at 1/4.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13267-01
    goal: KM13267
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: En sjokolade er delt i 8 like biter. Du spiser 3 av bitene. Hvilken
        brøk har du spist?
      en: A chocolate bar is split into 8 equal pieces. You eat 3 of them. Which
        fraction have you eaten?
    figure:
      kind: fraction
      shape: bar
      rows:
        - parts: 8
          shaded: 3
      alt:
        nb: En sjokolade delt i åtte like biter, der tre av dem er spist.
        en: A chocolate bar in eight equal pieces, three of them eaten.
    choices:
      - id: a
        text:
          nb: "3/8"
          en: "3/8"
        correct: true
      - id: b
        text:
          nb: "8/3"
          en: "8/3"
      - id: c
        text:
          nb: "3/5"
          en: "3/5"
    explanation:
      nb: Nevneren forteller hvor mange like deler det hele er delt i, altså 8.
        Telleren forteller hvor mange du tok, altså 3.
      en: The denominator says how many equal parts the whole is split into,
        which is 8. The numerator says how many you took, which is 3.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13267-02
    goal: KM13267
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hvilken brøk er like stor som 2/4?
      en: Which fraction is the same size as 2/4?
    figure:
      kind: fraction
      shape: bar
      rows:
        - parts: 4
          shaded: 2
          label: "2/4"
      alt:
        nb: En strimmel delt i fire like deler, der to er fargelagt.
        en: A bar split into four equal parts, two of them coloured in.
    choices:
      - id: a
        text:
          nb: "1/2"
          en: "1/2"
        correct: true
      - id: b
        text:
          nb: "2/3"
          en: "2/3"
      - id: c
        text:
          nb: "4/2"
          en: "4/2"
    explanation:
      nb: To av fire like deler er det samme som en av to like deler. Både
        teller og nevner er delt på 2.
      en: Two of four equal parts is the same as one of two equal parts. Both
        numerator and denominator are divided by 2.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13268-01
    goal: KM13268
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Hva blir 3/8 + 2/8?
      en: What is 3/8 + 2/8?
    choices:
      - id: a
        text:
          nb: "5/8"
          en: "5/8"
        correct: true
      - id: b
        text:
          nb: "5/16"
          en: "5/16"
      - id: c
        text:
          nb: "6/8"
          en: "6/8"
    explanation:
      nb: Bitene er like store, så vi teller bare hvor mange vi har. 3 åttedeler
        pluss 2 åttedeler er 5 åttedeler. Nevneren står stille.
      en: The pieces are the same size, so just count them. 3 eighths plus 2
        eighths is 5 eighths. The denominator stays put.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13268-02
    goal: KM13268
    type: numeric
    difficulty: 2
    prompt:
      nb: Regn ut 4 · 25.
      en: Work out 4 · 25.
    answer: 100
    explanation:
      nb: Fire 25-ere er det samme som to 50-ere, og 50 + 50 = 100. Å slå sammen
        tallene to og to er ofte raskere enn å plusse fire ganger.
      en: Four 25s is the same as two 50s, and 50 + 50 = 100. Pairing the numbers
        up is often quicker than adding four times.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13269-01
    goal: KM13269
    type: numeric
    difficulty: 3
    prompt:
      nb: En flaske rommer 2 liter saft. Klassen drikker 3/4 av flaska. Hvor
        mange desiliter er det igjen?
      en: A bottle holds 2 litres of squash. The class drinks 3/4 of the bottle.
        How many decilitres are left?
    answer: 5
    explanation:
      nb: 2 liter er 20 desiliter. En firedel av 20 er 5, og det er den delen
        som er igjen når 3/4 er drukket.
      en: 2 litres is 20 decilitres. A quarter of 20 is 5, and that is what is
        left once 3/4 has been drunk.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13270-01
    goal: KM13270
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Du kaster en vanlig terning. Hvor stor er sjansen for å få en sekser?
      en: You roll an ordinary die. What is the chance of rolling a six?
    choices:
      - id: a
        text:
          nb: "1/6"
          en: "1/6"
        correct: true
      - id: b
        text:
          nb: "1/2"
          en: "1/2"
      - id: c
        text:
          nb: "6/6"
          en: "6/6"
    explanation:
      nb: Terningen har 6 sider som er like sannsynlige, og bare én av dem er
        en sekser. Da er sjansen 1 av 6.
      en: The die has 6 equally likely faces and only one of them is a six, so
        the chance is 1 out of 6.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13270-02
    goal: KM13270
    type: multiple_choice
    difficulty: 3
    prompt:
      nb: I en pose ligger 3 røde og 5 blå kuler. Du trekker én uten å se. Hvor
        stor er sjansen for å få en rød?
      en: A bag holds 3 red and 5 blue balls. You draw one without looking. What
        is the chance of getting a red one?
    choices:
      - id: a
        text:
          nb: "3/8"
          en: "3/8"
        correct: true
      - id: b
        text:
          nb: "3/5"
          en: "3/5"
      - id: c
        text:
          nb: "5/8"
          en: "5/8"
    explanation:
      nb: Det er 3 + 5 = 8 kuler til sammen, og 3 av dem er røde. Nevneren er
        alltid alt du kan trekke, ikke bare resten.
      en: There are 3 + 5 = 8 balls in total and 3 of them are red. The
        denominator is everything you could draw, not just the rest.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13274-01
    goal: KM13274
    type: numeric
    difficulty: 1
    prompt:
      nb: "Hvilket tall skal x være? x + 7 = 12"
      en: "What number must x be? x + 7 = 12"
    answer: 5
    explanation:
      nb: Vi leter etter tallet som blir 12 når vi legger til 7. Regn baklengs,
        12 - 7 = 5. Sett inn 5 og sjekk at 5 + 7 = 12.
      en: We want the number that makes 12 when 7 is added. Work backwards,
        12 - 7 = 5. Then check that 5 + 7 = 12.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13274-02
    goal: KM13274
    type: numeric
    difficulty: 2
    prompt:
      nb: "Hvilket tall skal x være? 3 · x = 18"
      en: "What number must x be? 3 · x = 18"
    answer: 6
    explanation:
      nb: Tre like grupper blir til sammen 18, så hver gruppe er 18 delt på
        3, altså 6. Sjekk at 3 · 6 = 18.
      en: Three equal groups make 18 altogether, so each group is 18 divided by
        3, which is 6. Check that 3 · 6 = 18.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13273-01
    goal: KM13273
    type: numeric
    difficulty: 2
    prompt:
      nb: Fotballtreningen starter 17.45 og slutter 19.15. Hvor mange minutter
        varer den?
      en: Football practice starts at 17:45 and ends at 19:15. How many minutes
        does it last?
    answer: 90
    explanation:
      nb: Fra 17.45 til 18.45 er én time, og videre til 19.15 er 30 minutter
        til. Én time og 30 minutter er 90 minutter.
      en: From 17:45 to 18:45 is one hour, and on to 19:15 is 30 minutes more.
        One hour and 30 minutes is 90 minutes.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

  - id: KM13273-02
    goal: KM13273
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Bussen bruker 25 minutter til skolen. Du må være framme 08.10. Når
        må bussen gå?
      en: The bus takes 25 minutes to school. You must arrive at 08:10. When
        must the bus leave?
    choices:
      - id: a
        text:
          nb: "07.45"
          en: "07:45"
        correct: true
      - id: b
        text:
          nb: "07.35"
          en: "07:35"
      - id: c
        text:
          nb: "08.35"
          en: "08:35"
    explanation:
      nb: Regn 25 minutter bakover fra 08.10. Ti minutter tilbake er 08.00, og
        15 minutter til er 07.45.
      en: Count 25 minutes back from 08:10. Ten minutes back is 08:00, and 15
        more is 07:45.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22; arithmetic verified'

# Goals that no written question can honestly test. Recorded rather than
# omitted, so the gap is a stated judgement instead of a silent one.

  # --- Answered with the hands -------------------------------------------
  # Manipulatives (`pensum.items.primitives`): the pupil builds the answer on a
  # board, and without a script the same target is asked as a number.

  - id: KM13274-03
    goal: KM13274
    type: balance
    stage: pictorial
    difficulty: 2
    prompt:
      nb: "Vekten er i likevekt: 2 · ☐ + 3 = 11. Finn tallet i boksen."
      en: "The scales balance: 2 × ☐ + 3 = 11. Find the number in the box."
    activity:
      alt:
        nb: En skålvekt i likevekt med to bokser og 3 klosser til venstre og 11 klosser til høyre.
        en: A balanced pan balance with two boxes and 3 blocks on the left and 11 blocks on the right.
      left:
        boxes: 2
        weights: 3
      right:
        weights: 11
    explanation:
      nb: >-
        Ta bort 3 klosser fra begge sider. Da er 2 bokser like tunge som 8 klosser,
        så én boks er 4. Sjekk: 2 · 4 + 3 = 11.
      en: >-
        Take 3 blocks from both sides. Then 2 boxes weigh the same as 8 blocks, so
        one box is 4. Check: 2 × 4 + 3 = 11.
    reviewed: false

  # --- Simulations ---------------------------------------------------------
  # Trials (`trials`): the pupil predicts first, then spins or rolls and
  # watches a tally. Graded on the prediction, never on the draws.

  - id: KM13270-03
    goal: KM13270
    type: trials
    stage: pictorial
    skill: mat.data-chance.chance-words
    difficulty: 1
    prompt:
      nb: Se på lykkehjulet. Spå først, og spinn så for å se hva som skjer.
      en: Look at the spinner. Predict first, then spin to see what happens.
    activity:
      alt:
        nb: >-
          Et lykkehjul med tre felt. Sol er halve hjulet. Sky og Regn er en
          fjerdedel hver.
        en: >-
          A spinner with three parts. Sun is half the wheel. Cloud and Rain are
          a quarter each.
      spinner:
        - id: sol
          label:
            nb: Sol
            en: Sun
          size: 2
        - id: sky
          label:
            nb: Sky
            en: Cloud
          size: 1
        - id: regn
          label:
            nb: Regn
            en: Rain
          size: 1
    explanation:
      nb: >-
        Sol er halve hjulet, og Sky og Regn er en fjerdedel hver. Det største
        feltet kommer oftest. Sjansen for Sol er 1/2.
      en: >-
        Sun is half the wheel, and Cloud and Rain are a quarter each. The
        biggest part comes up most often. The chance of Sun is 1/2.
    reviewed: false

  - id: KM13270-04
    goal: KM13270
    type: trials
    stage: pictorial
    skill: mat.data-chance.chance-words
    difficulty: 2
    prompt:
      nb: >-
        Du kaster en vanlig terning mange ganger. Spå først, og kast så for å se
        hva som skjer.
      en: >-
        You roll an ordinary dice many times. Predict first, then roll to see
        what happens.
    activity:
      alt:
        nb: En vanlig terning med tallene 1 til 6.
        en: An ordinary dice with the numbers 1 to 6.
      dice: 1
    explanation:
      nb: >-
        En terning har seks sider, og hver side har like stor sjanse: 1/6. Etter
        noen få kast kan ett tall ha kommet flere ganger, men det er tilfeldig.
      en: >-
        A dice has six sides, and every side has the same chance: 1/6. After a
        few rolls one number may have come up more often, but that is chance.
    reviewed: false

not_assessable:
  - goal: KM13271
    reason: >-
      Asks the pupil to use a spreadsheet to build and solve tasks about
      personal finance. The tool is the point: a quiz cannot watch anyone enter
      a formula, and asking about money a pupil is assumed to have would exclude
      children whose families have none.

  - goal: KM13272
    reason: >-
      Asks the pupil to create and program algorithms using variables,
      conditions and loops. The step_code board has the pupil build programs
      with loops and conditions, but it has no variables, and the goal's
      variables are what set it apart from the 4. trinn goal (KM13263) that
      step_code already tests. A board item here would feed the variables skill
      with evidence it does not show, so the goal stays with classroom work
      until a primitive has variables.
