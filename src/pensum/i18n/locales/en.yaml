# Mirrors nb.yaml key for key. The i18n-key-parity check enforces it.
---
site:
  name: Pensum
  tagline: What should you know in Norwegian school?
  description: >-
    Competence goals from the national curriculum, and quizzes to practise them.

nav:
  home: Home
  language: Language
  about: About Pensum
  comfort: Settings

home:
  heading: Which year are you in?
  intro: >-
    Pick a year group to see what you should know, and try a quiz.
  grade: "Year {grade}"

grade:
  heading: "Year {grade}"
  subjects_heading: Subjects
  goal_count: "{count} competence goals"
  no_subjects: We have no content for this year group yet.

subject:
  mastery_now: What you should know by the end of year {year}
  working_towards: What you are working towards by year {year}
  working_towards_note: >-
    You are in year {grade}, and the goals below apply through to the end of
    year {year}. You are not expected to know all of it yet.
  goals_heading: Competence goals
  source_link: View this goal at Udir
  quiz_cta: Take the quiz
  quiz_unavailable: A quiz for this subject is coming soon.
  reading_cta: Read aloud
  writing_cta: Write the letters
  listening_cta: Listen and spell

coverage:
  summary: The quiz covers {tested} of {total} competence goals for this checkpoint.
  all: The quiz covers every competence goal for this checkpoint.
  note: >-
    Some competence goals can't be tested in a quiz — for example exploring,
    discussing or making something yourself. They are marked below.
  in_quiz: In the quiz
  not_in_quiz: Not in the quiz
  result_note: >-
    The quiz covered {tested} of {total} competence goals for this checkpoint.
    Some goals can't be tested in a quiz.

curriculum:
  verbatim_note: >-
    The text below is reproduced verbatim from the national curriculum.
  attribution: >-
    Contains data under NLOD, made available on data.udir.no.
  nynorsk_notice: >-
    This subject is established in nynorsk, and is shown in nynorsk.

disclaimer:
  short: Pensum is an unofficial study aid, not an assessment tool.
  long: >-
    Pensum is built for practice, not assessment. Passing a quiz here does not
    mean you pass a year group, and getting answers wrong does not mean you
    fail one. Pensum is not affiliated with Utdanningsdirektoratet.

footer:
  source: Source
  licence: Licence
  code: Source code

quiz:
  start: Take the quiz
  intro: "{count} questions from this checkpoint. Each answer is explained as you go."
  progress: Question {number} of {total}
  check: Check answer
  next: Next question
  see_result: See the result
  your_answer: You answered
  correct_answer: Correct answer
  correct: Correct!
  incorrect: Not quite.
  numeric_placeholder: Type a number
  text_placeholder: Type your answer
  number_line_drag: Drag the marker to where the answer belongs, or type the number.
  number_line_typed: Or type the number
  number_line_unset: Not placed yet
  number_line_at: The marker is on {value}
  authored_note: >-
    These questions were written by Pensum; they are not taken from the
    curriculum.

result:
  heading: How it went
  score: You got {correct} out of {total} right.
  passed: Well done! You have a good grip on this checkpoint.
  not_passed: Good effort! There is a bit more to practise here.
  not_a_verdict: >-
    This is practice, not assessment. The result only says how these questions
    went today.
  strong_heading: You have got this
  practice_heading: Worth practising more
  try_again: Try again
  back_to_subject: Back to the subject

reading:
  heading: Read aloud
  intro: >-
    Pick a passage, read it out loud, and see how fast and how accurately you
    read it.
  # Always a band, never a threshold. The wording has to hold up for a child
  # who falls outside it and reads perfectly well.
  band: >-
    After year {year}, many pupils read between {low} and {high} correct words a
    minute. That is a common range, not a requirement.
  word_count: "{count} words"
  authored_note: >-
    These passages were written by Pensum. They are not curriculum text.

  # Said before the microphone is switched on, not afterwards.
  privacy_checked: >-
    The recording is processed in this server's memory while you wait for the
    result, and is then gone. It is not stored, not sent anywhere else, and not
    linked to you.
  privacy_timed: >-
    No audio is recorded here. Pensum only times you, and takes your word for it
    that you read the whole passage.

  start: Start reading
  stop: Done
  working: Working …
  speech_blocked: >-
    The browser refused to recognise speech. On iPhone and iPad, dictation has
    to be switched on under Settings, General, Keyboard. We will time you
    instead, without checking the reading.
  speech_unsupported: >-
    The browser does not recognise this language. We will time you instead,
    without checking the reading.
  heat: How many words in a row you have read correctly
  mic_denied: >-
    Pensum could not reach the microphone. We will time you instead, without
    checking the reading.
  failed: Something went wrong. Try again.
  noscript: >-
    Without JavaScript, Pensum cannot time you. The passage can still be read
    aloud — that is the exercise itself.

  result_heading: How that went
  wpm_checked: correct words a minute
  wpm_timed: words a minute
  too_short: >-
    That reading was too short to measure. Try again, and read a little more of
    the passage.
  accuracy: "{percentage}% correct — {correct} of the {attempted} words you reached."
  stopped_early: You reached word {read} of {total}. The pace is measured against what you read.
  timed_only: >-
    This is just the clock divided by the number of words in the passage. Nobody
    checked how you read it.

  band_within: That is inside the usual range for this year ({low}–{high}).
  band_above: That is faster than the usual range for this year ({low}–{high}).
  band_below: >-
    That is slower than the usual range for this year ({low}–{high}). Speed
    comes with reading — there is nothing wrong with taking your time.
  band_timed: The usual range for this year is {low}–{high} words a minute.

  # Gamification. The wording carries the weight here: a badge that reads as a
  # mark would contradict every other sentence on the page.
  progress: How far you have read
  badge_finished: Whole passage read
  badge_band: Reached the range for this year
  stars_label: "{stars} of {max} stars"
  stars_caveat: >-
    The stars come from how many words the machine recognised. It hears
    children, accents and second-language speakers poorly, so few stars often
    means the machine got it wrong — not that you read badly.
  replay: Watch it again
  replay_real: The words light up at the moments you actually read them.
  replay_even: >-
    Nobody listened, so the words light up at an even pace. That is not how you
    read it.
  again: Read it again

  # Worked out in your browser and never sent to the server. Pensum does not
  # know you have read this passage before.
  first_time: First time reading this one. Now you have something to beat.
  new_best: "New best — {delta} words a minute faster than before."
  previous_best: "Your best on this passage is {best}."
  # Days this week, not days in a row: a day without reading resets nothing
  # (principles.md, "What gamification is allowed to do").
  week: "Days you have read this week: {days}"

  # Said before the microphone is switched on. Which recogniser is listening is
  # not a detail: one sends nothing anywhere, the other sends the voice to the
  # browser's maker.
  device_local: >-
    Your device recognises the reading itself. The audio does not leave your
    phone or computer, and Pensum only ever sees the text.
  device_cloud: >-
    Use your browser's own speech recognition. On this browser your voice may be
    sent to whoever made the browser, not only to Pensum. Your choice.

  # Pronunciation does not count. Reading the wrong word does.
  close_matches: >-
    {count} words were accepted even though the machine heard them a little
    differently. Pronunciation and dialect do not count as mistakes.

  misread_heading: Words that were not heard
  misread_note: >-
    Only words the machine thought were a different word appear here — not words
    you pronounced a little differently. It still mishears children and accents
    more than anyone else, so a word here may be its mistake rather than yours.
  not_a_verdict: >-
    This is practice, not assessment. Reading speed varies enormously between
    children who all read well, and a number here says nothing about who is a
    good reader.

rights:
  # Linked from the footer of every page. A contact address nobody can find is
  # not a contact address.
  link: Rights
  heading: Rights and takedowns
  intro: >-
    Pensum shows three kinds of content, and they have three different owners.
    This page says who owns what, and where to write if we have got it wrong.

  what_heading: Who owns what
  curriculum_title: "Curriculum text:"
  curriculum_body: >-
    The competence goals are Utdanningsdirektoratet's, reproduced verbatim from
    their open Grep API. They are redistributed under
  authored_title: "Quiz questions and reading passages:"
  authored_body: >-
    These were written for Pensum. None of them is taken from a book, song
    lyric, subtitle or other work. They are committed as readable text, so
    anyone can see exactly what they are.
  code_title: "The code:"
  code_body: The source is open under the MIT licence.

  report_heading: Reporting content
  report_intro: >-
    If you believe something here is yours and should not have been published,
    we want to know. Write to
  report_what: What it concerns — which passage, which question, which page.
  report_where: A link to the page where you saw it.
  report_who: Who you are, and your relationship to the work.
  report_why: Why you believe it is yours.
  report_response: >-
    We take the content down while we look into it, and we reply. No forms and
    no lawyer are needed to start.
  # Said outright rather than implied: "DMCA" is the name people search for,
  # not a claim about which country's law applies.
  jurisdiction: >-
    "DMCA" is the name most people know this process by. Pensum is a Norwegian
    project and a request here is handled under Norwegian law — but you do not
    need to know what the process is called in order to write to us.

  audio_heading: Audio recordings
  audio_body: >-
    When you read aloud, the recording is processed in memory while you wait
    for the result, and is then gone. It is not stored, not shared and not
    linked to you. There is therefore no recording to request access to or
    deletion of.

review:
  # Only ever shown to someone allowed to see drafts. A pupil is never served an
  # unreviewed question at all.
  draft: Draft — not reviewed
  draft_note: >-
    You are also seeing content nobody has read through yet, because you are
    signed in as an administrator. Pupils only see what has been marked as
    reviewed.

  # The review page. What a pupil sees is decided here, so the wording says what
  # the button does rather than what it is called.
  link: Review
  heading: Content review
  intro: >-
    Questions, reading passages and writing prompts, as a pupil would meet them.
    Approve what this school will use, and reject the rest — both what is not
    good enough, and what is good enough somewhere other than here.
  database_note: >-
    Choices here apply to this installation, and are stored in its database
    rather than in the files. They take effect immediately, without a release,
    and they do not follow along to other schools running Pensum. What this
    school shows is recorded here, not in the repository.
  counts: '{pending} waiting · {published} published · {rejected} rejected'
  filter_label: Filter
  filter:
    pending: Waiting
    published: Published
    rejected: Rejected
    all: Everything
  kind:
    all: All types
    item: Question
    reading: Reading passage
    writing: Writing prompt
  state:
    pending: Waiting for review
    published: Published
    rejected: Rejected
  overridden: Overrides the file
  after_year: 'after year {year}'
  meta: '{id} · difficulty {difficulty}'
  decided_by: 'decided by {name}'
  answer: 'Correct answer: {answer}'
  approve: Approve
  reject: Reject
  clear: Clear the decision
  nothing_here: Nothing here.

auth:
  # Signing in is optional. No string here may imply a quiz needs an account,
  # because none of them do.
  account: Account
  sign_in: Sign in
  sign_out: Sign out
  signed_in_as: "Signed in as {name}"
  failed: >-
    Signing in did not go through. You can still take every quiz without
    signing in.
  recorded_note: >-
    You are signed in, so this result is saved and can be seen by an adult with
    access.

admin:
  link: Results
  heading: Results
  intro: >-
    Pupils who were signed in and have finished at least one quiz.
  not_a_verdict: >-
    This is practice, not assessment. The numbers say how these particular
    questions went, not whether a pupil has met the competence goals.
  share: "{percentage}% ({correct} of {total})"
  no_attempts: Nobody has finished a quiz while signed in yet.
  back: Back to the list
  grade: "Year {grade}"
  goals_heading: Competence goals in this quiz
  column:
    pupil: Pupil
    attempts: Quizzes
    average: Average
    latest: Last

placement:
  cta: Find your level
  cta_note: We start easy and adjust as we go.
  heading: What level are you at in {subject}?
  intro: >-
    You get a few questions at a time. Get them right and they get harder; miss
    them and they get easier. That is how we find what you can do now.
  grade_question: Which year are you in?
  grade_help: >-
    We only use it to choose where to start. You can end up above it or below it.
  grade_unknown: I do not know
  start: Start the level test
  progress: "Question {number}"
  length_note: >-
    The test ends when we know enough. That is usually 10-25 questions.

placement_result:
  heading: Where you are
  ceiling: You have a good grip on what we can test after year {year}.
  ceiling_span: You have a good grip on what we can test for years {first}-{last}.
  frontier: You are working on year {year} now.
  frontier_span: You are working on years {first}-{last} now.
  topped_out: >-
    You cleared the highest checkpoint we have questions for in this subject, so
    the test has nothing further to measure with.
  nothing_yet: >-
    We did not find a checkpoint to measure from this time. That does not mean
    you know nothing -- only that these questions did not land. Do try again.
  inconclusive: >-
    The test ended before we could pin the level down. What is below is true, but
    it is not the whole picture.
  not_a_verdict: >-
    This is practice, not assessment. The test says how these questions went
    today, not what you are capable of.
  coverage_note: >-
    The quiz for this checkpoint covers {tested} of {total} competence goals.
    Many goals are about discussing, exploring or making something, and cannot be
    tested in writing.
  thin_evidence: >-
    Each goal here was tested with one or two questions. That is enough to show
    what is worth another look, but not enough to say you cannot do it.
  gaps_heading: Worth practising
  gaps_intro: >-
    These are the goals you missed along the way.
  no_gaps: You answered everything you were asked correctly.
  answered: "{correct} of {total} correct"
  retake: Take the test again
  see_curriculum: See the whole checkpoint

writing:
  heading: Write with your finger
  intro: >-
    Pick a group of letters and write them with your finger. The dot shows where
    to start, and the number shows the order.
  # Said before a set is chosen, not after one has been opened and found wanting.
  touch_note: >-
    This exercise is made for a tablet or a phone. A mouse can drive it, but
    then you are practising with the mouse rather than practising handwriting.
  mouse_note: >-
    This machine has no touchscreen. You can draw with the mouse, but that is
    not the same as writing.
  character_count: "{count} characters"
  authored_note: >-
    The letterforms were made for Pensum, not taken from the curriculum.

  # Said before a finger touches the screen, not in a privacy policy.
  privacy: >-
    Pensum sees where your finger went while it works out the answer, and forgets
    it afterwards. Nothing is stored, and nothing is attached to you.

  meter: How much of the letter you have written
  position: Letter {at} of {total}
  trace_label: "Write the letter {char}"
  show_me: Show me
  clear: Start this one again
  next: Next letter
  finish: Done
  working: Working …
  failed: Something went wrong. Try again.
  noscript: >-
    Without JavaScript you cannot write on the screen here. The letters stay on
    the page with their lines and starting dots, so the sheet can be printed and
    used with a pencil.

  result_heading: How you wrote
  # The wording names the fault rather than quietly deducting for it. A
  # seven-year-old can do something different next time with "you went the other
  # way round"; 71% is nothing to act on.
  not_written: not written
  missed_strokes: "{count} stroke(s) missing"
  backwards: "{count} stroke(s) went the other way"
  out_of_order: the strokes came in a different order
  stopped_early: You wrote {written} of {total} letters.
  again: Try the whole group again
  badge_finished: Every letter written
  badge_even: Steady all the way through
  stars_label: "{stars} of {max} stars"
  score_caveat: >-
    The percentage says how closely a finger followed a line on a screen. A
    finger is wider than a pencil, so the number is blunter than it looks.
  not_a_verdict: >-
    This is practice, not assessment. Handwriting is learned with a pencil and a
    grown-up beside you; this is a way to practise the shapes in between.

listening:
  heading: Hear the word
  intro: >-
    The computer reads a word aloud. You choose or type how it is spelled.
  # Said before the first word is spoken, not in a privacy page. There is no
  # microphone on this page.
  privacy: >-
    Your browser reads the words aloud. Nothing is recorded, nothing is sent,
    and your answers are gone once you have the result.
  authored_note: >-
    The words come from Pensum's own reading passages, and the wrong spellings
    are built from the mistakes children actually make.

  position: Word {at} of {total}
  say_again: Say it again
  pick_label: Choose the word you heard
  write_label: Type the word you heard
  next: Next word
  finish: Done
  working: Marking …
  failed: Something went wrong. Try once more.
  # Shown when the browser has no voice for the language. There is no exercise
  # left at that point -- guessing between two spellings unheard is a coin toss.
  no_voice: >-
    This browser has no voice for this language, so the words cannot be read
    aloud. Try another browser, or add a voice in your device settings.
  noscript: >-
    This exercise needs JavaScript, because the browser is what reads the words
    aloud.

  result_heading: How you spelled them
  score: "{right} of {total} right"
  right: right
  not_answered: not answered
  you_wrote: "you wrote {given}"
  again: Try again
  badge_finished: Every word answered
  stars_label: "{stars} of {max} stars"
  not_a_verdict: >-
    This is practice, not assessment. Spelling is learned over years, and a word
    you miss here is a word you can practise.

progression:
  # A teacher's view of a subject: skills in rows per strand, checkpoints
  # across. The skills are our reading of the curriculum, never Udir's text.
  title: "Progression in {subject}"
  intro: >-
    Every strand of the subject, from the first checkpoint to the last. Each
    skill is one thing a teacher can see a pupil do, or not do yet, with the
    competence goals it builds on.
  ours_note: >-
    The skills are Pensum's own reading of the curriculum, not the Norwegian
    Directorate for Education and Training's text. The competence goals, quoted
    verbatim under each skill, are what applies.
  drafts_note: >-
    {count} of {total} skills are drafts nobody has read through yet. They are
    shown anyway, because nothing a pupil sees depends on them so far.
  grid_label: Skills by strand and checkpoint
  strand: Strand
  checkpoint: "After year {year}"
  pupil_label: For the pupil
  teacher_label: What the teacher sees
  draft: Draft — not reviewed
  off_screen: Practised off screen
  cta: See how the subject progresses
  cta_note: Every year on one page, for teachers. Printable.

# Questions answered with the hands: counters, ten-frames, base-ten blocks,
# arrays and a balance. Every sentence here is literal (principle 7): it says
# what is on the board and what the task asked for, and never judges the child.
activity:
  and: and
  undo: Undo
  you_made: "You made {made}. The task was {asked}."
  you_wrote: "You wrote {made}. The answer is {asked}."
  unreadable: The answer did not arrive the way it was built.
  made_caption: What you made
  asked_caption: What the task asked for
  counters:
    hint: Tap the mat to put a counter down. Tap a counter and then the box to take it away.
    hint_groups: >-
      Move the counters into the groups: drag them, or tap a counter and then a
      group. The buttons below do the same.
    add: Put a counter down
    remove: Take a counter away
    group: Group {n}
    group_add: Put one in group {n}
    group_remove: Take one from group {n}
    supply: The box of counters
    made: "{count} counters"
    made_one: 1 counter
    made_groups: "{count} counters, shared out {sizes}"
    made_loose: "{loose} outside the groups"
    ask_count: How many counters should there be?
    ask_each: How many go in each group?
  ten_frame:
    hint: >-
      Tap an empty square to put a dot there. Tap a dot twice to take it away.
      With a keyboard, move with the arrow keys and use the space bar.
    add: Add a dot
    remove: Take a dot away
    made: "{count} dots"
    made_one: 1 dot
    out_of_order: but not filled from the left of the top row first
    ask_count: How many dots will there be?
    ask_add: How many dots do you need to add?
    cell: "Frame {frame}, square {cell}: {state}"
    full: a dot
    empty: empty
  base_ten:
    hint: >-
      Tap a column to put a block there. Tap ten ones twice to swap them for a
      ten, and tap a ten twice to swap it for ten ones. The buttons below do the
      same.
    hundreds: Hundreds
    tens: Tens
    ones: Ones
    tray: Blocks you can take
    add_hundreds: Put a hundred down
    remove_hundreds: Take a hundred away
    add_tens: Put a ten down
    remove_tens: Take a ten away
    add_ones: Put a one down
    remove_ones: Take a one away
    bundle_ones: Swap 10 ones for 1 ten
    break_tens: Swap 1 ten for 10 ones
    bundle_tens: Swap 10 tens for 1 hundred
    break_hundreds: Swap 1 hundred for 10 tens
    made: "{value} ({parts})"
    hundreds_count: "{count} hundreds"
    hundreds_count_one: 1 hundred
    tens_count: "{count} tens"
    tens_count_one: 1 ten
    ones_count: "{count} ones"
    ones_count_one: 1 one
    ask: Write the number.
  array:
    hint: >-
      Drag the corner to make the grid bigger or smaller, or tap the square the
      corner should reach. With a keyboard, use the arrow keys on the corner.
    hint_split: >-
      Split the grid in two with the line: tap above the columns where it
      should go, or use the buttons.
    handle: The corner of the grid
    rows_more: One more row
    rows_less: One row fewer
    cols_more: One more column
    cols_less: One column fewer
    split_left: Move the line left
    split_right: Move the line right
    made: "{rows} rows of {cols}"
    made_one: "1 row of {cols}"
    made_split: "split into {left} and {right}"
    ask: How many squares are there altogether?
  balance:
    hint: >-
      Find the number in the box. You can take the same away from both sides:
      drag a block or a box to "Take away", or use the buttons. The scales stay
      balanced the whole time.
    hint_open: Put blocks in the box until both sides weigh the same.
    take_weight: Take 1 block from both sides
    take_box: Take 1 box from both sides
    box_more: One more in the box
    box_less: One fewer in the box
    away: Take away
    box_label: The box is
    made: "☐ = {box}, so the left side weighs {left} and the right side {right}"
    status: "{equation}, ☐ = {box}"
    ask: Which number is in the box?

comfort:
  # Every setting is described by what it does, never by who it is for. No
  # diagnosis is named anywhere.
  heading: Settings
  intro: >-
    Choose how Pensum looks and behaves on this device.
  calm: Calm screen
  calm_help: >-
    Nothing flashes, sparkles or moves. Whatever changes fades in quietly.
  read_aloud: Read aloud
  read_aloud_help: >-
    A button next to questions and answers reads the text aloud. Needs a voice
    for the language on this device.
  bigger_targets: Bigger buttons
  bigger_targets_help: Buttons and answers get bigger and easier to hit.
  theme: Theme
  theme_help: What counters and pictures look like. Not in use yet.
  theme_plain: Plain
  theme_animals: Animals
  theme_vehicles: Vehicles
  theme_space: Space
  theme_blocks: Blocks
  break_reminder: Offer a break
  break_reminder_help: >-
    After a few tasks you can choose to stop, and what you have done is kept.
    Not in use yet.
  save: Save
  saved: Saved.
  back: Back
  # Said where it is stored, not only in the README.
  storage: >-
    These settings are kept in a cookie on this device. It holds only these
    choices, is read only by Pensum and is never sent anywhere else.
  # The button comfort.js puts next to questions and answers.
  speak: Read aloud

# Missions: short off-screen tasks for the goals a screen cannot check. Pupil
# lines are literal and short, as the steps are. Nothing about a mission is
# uploaded or recorded, and the page says so where a pupil can read it.
missions:
  list_title: "Missions in {subject}"
  list_intro: >-
    Some competence goals are conversations, visits, builds and presentations,
    and a screen cannot check them. A mission is a short task for one of those
    goals: a few steps a pupil can tick, sometimes a printed card with a
    script, and who confirms that it is done. Each mission prints on one page.
  ours_note: >-
    The missions are Pensum's own suggestions, not the Norwegian Directorate
    for Education and Training's text. Each one serves a skill from the
    progression guide.
  drafts_note: >-
    {count} of {total} missions are drafts nobody has read through yet.
  nothing_kept: >-
    Nothing is uploaded or recorded: no photo, no recording, no note of what a
    pupil said. A ticked step stays in the pupil's own browser.
  list_cta: The goals a screen cannot check, as missions
  link: "Mission: {title}"
  none: No mission. This goal is left to the classroom.
  skill_heading: Skill
  missions_heading: Missions
  confirm_teacher_short: A teacher confirms
  confirm_self_short: The pupil confirms
  card_short: "Card: {card}"
  cards_heading: The cards
  cards_intro: >-
    The same scripts in every subject. A conversation with a written structure
    is predictable, and that makes it easier to take part in.
  back_to_list: "All missions in {subject}"
  goal_label: My goal
  steps_label: Do this
  confirm_teacher: When you are done, show your teacher.
  confirm_self: When you are done, you decide that it is done.
  ticks_note: >-
    The ticks are only in this browser. Nothing is sent anywhere, and nothing
    is recorded.
  teacher_label: "For the teacher: what to look for"
  question_label: The question
  card:
    turn:
      title: Turn card
      intro: For talking with someone. One person speaks at a time.
      step1: Listen until the other person has finished.
      step2: "Say back what you heard: «You said that …»"
      step3: Add one thing of your own.
      starter1: I think … because …
      starter2: I agree with … because …
      starter3: I see it differently because …
    feedback:
      title: Feedback card
      intro: For giving feedback on someone's work.
      step1: Read or listen to all of it first.
      step2: Say one thing that works, and point to where.
      step3: Say one thing to try, and point to where.
      step4: The one who made it decides what to change.
      starter1: "This works: …"
      starter2: "Try this: …"
    question:
      title: Question card
      intro: One open question. There is no single right answer.
      step1: Read the question aloud.
      step2: Think quietly first.
      step3: Answer with the turn card.
    ladder:
      title: Thinking ladder
      intro: Climb one step at a time.
      step1: What do we mean by …?
      step2: Give an example.
      step3: Give a counterexample.
    interview:
      title: Interview card
      intro: For asking someone questions.
      step1: Ask whether now is a good time.
      step2: Say what you want to find out.
      step3: Ask one question at a time, and listen to the whole answer.
      step4: Write down the answers, and say thank you.
      starter1: What was it like when …?
      starter2: How do you say …?
      starter3: What did you do when you were my age?
      starter4: What is different now from before?
      starter5: Can you tell me more about …?
    risk:
      title: Risk card
      intro: Fill it in before the experiment, not after.
      step1: What are we going to do?
      step2: What could go wrong?
      step3: How could someone get hurt?
      step4: What do we do to stay safe?
      step5: What do we do if something goes wrong?
    solve_it:
      title: Solve-it card
      intro: For two people who disagree. One step at a time.
      step1: What happened? Each tells it once, without being interrupted.
      step2: How did each of you feel?
      step3: What does each of you need?
      step4: Each gives one idea for a solution.
      step5: Choose one you both accept.
      starter1: I felt … when …
      starter2: I need …
    method:
      title: Method card
      intro: Six steps for finding something out.
      step1: Ask a question.
      step2: Write down what you already know.
      step3: "Choose a method: interview, survey or sources."
      step4: Collect the information.
      step5: Sort what you found and look for patterns.
      step6: Present what you found, and what you are still unsure of.
    checklist:
      title: Checklist card
      intro: For going through your own text.
      step1: Every sentence starts with a capital letter.
      step2: Every sentence ends with a full stop, question mark or exclamation mark.
      step3: One sentence is made longer with and, because or but.
      step4: Read the whole text aloud once more.

mastery:
  state:
    not-started:
      name: Not started
      glyph: An empty spot
      explain: An empty spot means you have not tried this yet.
    exploring:
      name: Exploring
      glyph: A seed
      explain: A seed means you have tried.
    practising:
      name: Practising
      glyph: A sprout
      explain: A sprout means you have got it right.
    secure:
      name: Secure
      glyph: A plant
      explain: A plant means you have got it right many times, on more than one day.
    retained:
      name: Retained
      glyph: A plant with a flower
      explain: A flower means you still knew it a week later.
  stage:
    concrete: With objects
    pictorial: With pictures
    abstract: With numbers and symbols
    unrecorded: Stage not recorded
  map:
    cta: See your map
    title: "Your map in {subject}"
    intro: >-
      This is where what you learn grows. What you have got right stays, even if
      a question goes badly another time.
    legend_heading: What do the pictures mean?
    checkpoints_label: Choose a year
    sensitive: We talk about this in class. No plant grows here.
    off_screen: You practise this away from the screen.
    not_stored: >-
      This Pensum site stores nothing about you, so there is no map to grow
      here. You can still take every quiz.
    sign_in_note: >-
      Your map only grows when you are signed in, because it has to be stored
      somewhere. You do not need to sign in to take a quiz.
    progression_link: See every skill in the subject
  grid:
    title: "Class overview in {subject}"
    intro: >-
      Every pupil on one strand. The cells show what the answers say now, not
      the best the pupil has reached, and the representation the pupil last got
      right with.
    guesses: >-
      The thresholds for "secure" and "retained" are guesses, to be adjusted
      once there is classroom data. Read the cells as a hint about whom to look
      at, not as an assessment.
    not_stored: >-
      This Pensum site has no database, so no answers are stored and there is no
      overview to show.
    strands_label: Choose a strand
    grid_label: Pupils and skills
    concrete_only: Only with objects so far
    slipped: "Was {state}, worth another look"
    excluded: >-
      Sensitive skills and skills practised away from the screen are not shown
      here.
    links_heading: Class overview
    links_label: Class overview by subject
