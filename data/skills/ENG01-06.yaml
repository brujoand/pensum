    teacher:
      nob: "Vurderer avsender, formål, dato og belegg i en engelsk faktatekst, og skiller nyheter fra reklame. Ikke ennå: stoler på det som står fordi det er på engelsk."
      eng: "Weighs author, purpose, date and evidence in an English factual text and tells news from advertising. Not yet: trusts it because it is in English."
