    i_can:
      nob: Jeg skriver på tastaturet uten å lete etter tastene.
      eng: I type without hunting for the keys.
    teacher:
      nob: "Skriver en tekst på tastatur med flere fingre og ser mest på skjermen. Ikke ennå: bruker én finger og ser på tastene hele tiden."
      eng: "Types a text with several fingers, eyes mostly on the screen. Not yet: uses one finger and watches the keys throughout."
    stages: [concrete]
    misconceptions: []
    assessable: false

