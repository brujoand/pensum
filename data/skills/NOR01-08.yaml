    i_can:
      nob: Jeg kan leke med sjangre når jeg skriver.
      eng: I can play with genres when I write.
    teacher:
      nob: "Skriver for eksempel en nyhetsartikkel om et eventyr, og bruker trekkene i begge sjangrene med vilje. Ikke ennå: holder seg alltid til én sjanger."
      eng: "Writes, say, a news article about a fairy tale, using features of both genres on purpose. Not yet: always stays inside one genre."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.writing.justify-multimedia
    strand: writing
    checkpoint: 10
    refs: [KM14189]
    needs: [nor.writing.multimedia-texts]
    i_can:
      nob: Jeg kan forklare hvorfor jeg valgte bilder, lyd og tekst.
      eng: I can explain why I chose pictures, sound and text.
    teacher:
      nob: "Lager en sammensatt tekst og begrunner hvert valg av uttrykk. Ikke ennå: velger fordi det ser kult ut."
      eng: "Makes a multimedia text and justifies each choice of form. Not yet: chooses because it looks cool."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.grammar.revise-with-terms
    strand: grammar
    checkpoint: 10
    refs: [KM14194]
    needs: [nor.grammar.find-sentence-parts, nor.grammar.word-class-in-context]
    i_can:
      nob: Jeg kan bruke grammatikkord når jeg forbedrer en tekst.
      eng: I can use grammar words when I improve a text.
    teacher:
      nob: "Velger den beste omskrivingen av en setning og sier hvorfor, for eksempel at subjektet manglet. Ikke ennå: retter uten å kunne si hva som var galt."
      eng: "Picks the best rewrite of a sentence and says why, for example that the subject was missing. Not yet: corrects without being able to say what was wrong."
    stages: [abstract]
    misconceptions: []
    assessable: true

  - id: nor.grammar.genre-terms
    strand: grammar
    checkpoint: 10
    refs: [KM14194]
    needs: [nor.writing.genre-structure]
    i_can:
      nob: Jeg kan bruke ord om sjanger og oppbygning i tekster.
      eng: I can use genre and structure words about texts.
    teacher:
      nob: "Kjenner igjen sjangertrekk som ingress, argument og motargument, og bruker ordene når hun gir respons. Ikke ennå: sier bare at teksten er lang eller kort."
      eng: "Recognises genre features such as lead paragraph, argument and counter-argument, and uses the terms when responding. Not yet: only says a text is long or short."
    stages: [abstract]
    misconceptions: []
    assessable: true

  - id: nor.literature.analyse-devices
    strand: literature
    checkpoint: 10
    refs: [KM14193]
    needs: [nor.literature.literary-devices, nor.literature.purpose-form-content]
    i_can:
      nob: Jeg kan forklare hva et virkemiddel gjør med teksten.
      eng: I can explain what a literary device does to a text.
    teacher:
      nob: "Finner sjangertrekk og virkemidler i en tekst, også oversatt fra samisk, og forklarer virkningen. Ikke ennå: nevner virkemidlet uten å si hva det gjør."
      eng: "Finds genre features and devices in a text, including one translated from Sami, and explains their effect. Not yet: names the device without saying what it does."
    stages: [abstract]
    misconceptions: []
    assessable: true

  - id: nor.literature.rhetoric
    strand: literature
    checkpoint: 10
    refs: [KM14192]
    needs: [nor.literature.literary-devices]
    i_can:
      nob: Jeg kan kjenne igjen og bruke retoriske virkemidler.
      eng: I can recognise and use rhetorical devices.
    teacher:
      nob: "Sorterer utsagn i en tale etter om de spiller på troverdighet, følelser eller fornuft, og bruker selv et slikt grep. Ikke ennå: tror at bare fornuftsargumenter teller."
      eng: "Sorts lines from a speech by whether they appeal to credibility, feeling or reason, and uses one herself. Not yet: thinks only reasoned arguments count."
    stages: [abstract]
    misconceptions: []
    assessable: true

  - id: nor.literature.text-and-its-time
    strand: literature
    checkpoint: 10
    refs: [KM14197]
    needs: [nor.literature.purpose-form-content]
    i_can:
      nob: Jeg kan lese en tekst i lys av tiden sin.
      eng: I can read a text in the light of its time.
    teacher:
      nob: "Knytter trekk ved en novelle eller et dikt til tiden den ble skrevet i, og sammenligner to tekster fra ulike tider. Ikke ennå: leser alle tekster som om de var skrevet i dag."
      eng: "Links features of a short story or poem to its period and compares two texts from different times. Not yet: reads every text as if written today."
    stages: [abstract]
    misconceptions: [reads-past-as-present]
    assessable: true

  - id: nor.literature.young-lives
    strand: literature
    checkpoint: 10
    refs: [KM14198]
    needs: [nor.literature.what-text-means]
    i_can:
      nob: Jeg kan snakke om hvordan tekster viser livet til unge.
      eng: I can discuss how texts show young people's lives.
    teacher:
      nob: "Sammenligner hvordan to tekster viser ungdom, og om det stemmer med det hun kjenner. Ikke ennå: sier bare om hun likte hovedpersonen."
      eng: "Compares how two texts show young people and whether it matches what she knows. Not yet: only says whether she liked the main character."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.sources.quote-and-reference
    strand: sources
    checkpoint: 10
    refs: [KM14190]
    needs: [nor.sources.name-sources]
    i_can:
      nob: Jeg kan sitere og vise til kilder så andre kan finne dem.
      eng: I can quote and cite sources so others can find them.
    teacher:
      nob: "Markerer sitater og skriver kildehenvisninger en leser kan følge. Ikke ennå: kopierer tekst uten anførselstegn eller henvisning."
      eng: "Marks quotations and writes references a reader can follow. Not yet: copies text with no quotation marks or reference."
    stages: [abstract]
    misconceptions: [copies-without-quoting]
    assessable: true

  - id: nor.sources.use-critically
    strand: sources
    checkpoint: 10
    refs: [KM14190]
    needs: [nor.sources.judge-reliability]
    i_can:
      nob: Jeg kan velge kilder med omtanke og vise hvorfor.
      eng: I can choose sources with care and show why.
    teacher:
      nob: "Velger mellom to kilder og begrunner valget med avsender, formål og dato. Ikke ennå: bruker den første kilden hun fant."
      eng: "Chooses between two sources and justifies it by author, purpose and date. Not yet: uses the first source she found."
    stages: [abstract]
    misconceptions: [trusts-looks-over-author]
    assessable: true

  - id: nor.language.bokmal-nynorsk-history
    strand: language
    checkpoint: 10
    refs: [KM14195]
    needs: [nor.language.bokmal-or-nynorsk]
    i_can:
      nob: Jeg kan fortelle hvorfor vi har både bokmål og nynorsk.
      eng: I can tell why we have both bokmål and nynorsk.
    teacher:
      nob: "Plasserer Aasen, Knudsen og dansketiden på en tidslinje og sier hvilke språk som er offisielle i Norge i dag. Ikke ennå: tror nynorsk er en dialekt."
      eng: "Places Aasen, Knudsen and the Danish period on a timeline and names Norway's official languages today. Not yet: thinks nynorsk is a dialect."
    stages: [abstract]
    misconceptions: [nynorsk-as-dialect]
    assessable: true

  - id: nor.language.read-swedish-danish
    strand: language
    checkpoint: 10
    refs: [KM14200]
    needs: [nor.language.dialects-and-neighbours]
    i_can:
      nob: Jeg kan lese og forstå tekster på svensk og dansk.
      eng: I can read and understand Swedish and Danish texts.
    teacher:
      nob: "Svarer på spørsmål om en svensk eller dansk tekst og peker på ord som skiller seg fra norsk. Ikke ennå: gir opp fordi skrivemåten er ukjent."
      eng: "Answers questions on a Swedish or Danish text and points to words that differ from Norwegian. Not yet: gives up because the spelling is unfamiliar."
    stages: [abstract]
    misconceptions: [trusts-false-friends]
    assessable: true

  - id: nor.language.language-attitudes
    strand: language
    checkpoint: 10
    refs: [KM14196]
    needs: [nor.language.language-and-identity]
    i_can:
      nob: Jeg kan snakke om hva folk mener om språk og dialekter.
      eng: I can discuss what people think of languages and dialects.
    teacher:
      nob: "Gir eksempler på fordommer mot dialekter eller språk og sier hvor de kan komme fra. Ikke ennå: sier at noen dialekter bare er stygge."
      eng: "Gives examples of prejudice about dialects or languages and where it may come from. Not yet: says some dialects are simply ugly."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.language.digital-media-language
    strand: language
    checkpoint: 10
    refs: [KM14199]
    needs: [nor.sources.self-in-digital-media]
    i_can:
      nob: Jeg kan si hvordan nettet endrer måten vi skriver på.
      eng: I can say how the internet changes how we write.
    teacher:
      nob: "Gir eksempler på forkortelser, emojier og engelske ord i chat, og drøfter hva de gjør med språket. Ikke ennå: sier bare at det er feil. Øves ikke i Pensum."
      eng: "Gives examples of abbreviations, emoji and English words in chat and discusses what they do to language. Not yet: only calls them wrong. Not practised in Pensum."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.talking.argue-with-terms
    strand: talking
    checkpoint: 10
    refs: [KM14186]
    needs: [nor.talking.build-on-others, nor.talking.present-a-topic]
    i_can:
      nob: Jeg kan argumentere med fagord i en diskusjon.
      eng: I can argue using subject terms in a discussion.
    teacher:
      nob: "Argumenterer med fagbegreper og begrunnelser, muntlig og skriftlig, og svarer på motargumenter. Ikke ennå: gjentar meningen høyere i stedet for å begrunne den."
      eng: "Argues with subject terms and reasons, orally and in writing, and answers counter-arguments. Not yet: repeats the opinion louder instead of backing it up."
    stages: [concrete]
    misconceptions: []
    assessable: false
