    i_can:
      nob: Jeg kan forklare hvorfor vi har dag og natt.
      eng: I can explain why we have day and night.
    teacher:
      nob: "Forklarer at jorda roterer én gang i døgnet og at siden mot sola har dag. Ikke ennå: sier at sola går rundt jorda."
      eng: "Explains that Earth spins once a day and the side facing the sun has day. Not yet: says the sun goes round Earth."
    stages: [concrete, pictorial]
    misconceptions: [sun-circles-earth]
    assessable: true
    reviewed: false

