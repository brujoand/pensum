    checkpoint: 7
    refs: [KM14172]
    needs: [nor.spelling.commas, nor.spelling.speech-marks-colon]
    i_can:
      nob: Jeg setter punktum og komma riktig i egne tekster.
      eng: I put full stops and commas right in my texts.
    teacher:
      nob: "Setter punktum mellom setninger og komma der reglene sier det, i egen tekst. Ikke ennå: skriver lange setninger bundet sammen med og."
      eng: "Puts full stops between sentences and commas where the rules say, in her own text. Not yet: writes long sentences strung together with og."
    stages: [abstract]
    misconceptions: [comma-at-every-pause]
    assessable: true

  - id: nor.grammar.find-sentence-parts
    strand: grammar
    checkpoint: 7
    refs: [KM14177]
    needs: [nor.grammar.talk-about-sentences]
    i_can:
      nob: Jeg kan finne subjekt og verbal i en setning.
      eng: I can find the subject and verb in a sentence.
    teacher:
      nob: "Finner subjektet og verbalet også når setningen starter med noe annet, som I går spiste vi pizza. Ikke ennå: tror det første ordet alltid er subjektet."
      eng: "Finds the subject and verb even when the sentence starts with something else, as in I går spiste vi pizza. Not yet: assumes the first word is always the subject."
    stages: [abstract]
    misconceptions: [first-word-is-subject]
    assessable: true

  - id: nor.grammar.word-class-in-context
    strand: grammar
    checkpoint: 7
    refs: [KM14177]
    needs: [nor.grammar.name-word-classes]
    i_can:
      nob: Jeg kan se ordklassen ut fra hvordan ordet brukes.
      eng: I can tell a word's class from how it is used.
    teacher:
      nob: "Sorterer løp i et løp og de løp til to ulike ordklasser, og forklarer hvorfor. Ikke ennå: gir samme ord samme ordklasse overalt."
      eng: "Sorts løp in et løp and de løp into two classes and explains why. Not yet: gives a word the same class everywhere."
    stages: [abstract]
    misconceptions: [class-from-meaning-alone]
    assessable: true

  - id: nor.writing.genre-structure
    strand: writing
    checkpoint: 7
    refs: [KM14181]
    needs: [nor.writing.retell-in-order]
    i_can:
      nob: Jeg vet hvilke deler en fortelling og en fagtekst har.
      eng: I know the parts of a story and a factual text.
    teacher:
      nob: "Ordner deler av en fortelling (innledning, problem, vendepunkt, slutt) og av en fagtekst (innledning, hoveddel, avslutning). Ikke ennå: bruker fortellingsmønsteret til alle tekster."
      eng: "Orders the parts of a story (opening, problem, turning point, ending) and of a factual text (introduction, body, conclusion). Not yet: uses the story pattern for every text."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true

  - id: nor.writing.paragraphs
    strand: writing
    checkpoint: 7
    refs: [KM14172]
    needs: [nor.writing.genre-structure]
    i_can:
      nob: Jeg kan dele teksten min i avsnitt.
      eng: I can split my text into paragraphs.
    teacher:
      nob: "Starter nytt avsnitt når tema, tid eller sted skifter, og kan ordne avsnitt i en rekkefølge som henger sammen. Ikke ennå: skriver alt i én blokk."
      eng: "Starts a new paragraph when topic, time or place changes, and can order paragraphs so they hang together. Not yet: writes everything as one block."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true

  - id: nor.writing.write-in-genres
    strand: writing
    checkpoint: 7
    refs: [KM14181]
    needs: [nor.writing.genre-structure, nor.writing.describe-and-give-reasons]
    i_can:
      nob: Jeg kan skrive både fortellinger, fagtekster og meningstekster.
      eng: I can write stories, factual texts and opinion texts.
    teacher:
      nob: "Skriver tekster i ulike sjangre der oppbygningen passer til formålet. Ikke ennå: alle tekstene ligner hverandre uansett hva de skal brukes til."
      eng: "Writes texts in different genres whose structure fits the purpose. Not yet: every text looks the same whatever it is for."
    stages: [concrete]
    misconceptions: []
    assessable: false

