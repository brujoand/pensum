# Engelsk, kompetansemål etter 2. trinn (ENG01-06 / KV1030).
#
# The pupil is a Norwegian child in 1.-2. klasse, in their first years of
# English. The Norwegian prompt is the instruction; the English inside it is the
# material being tested. The two locales are therefore not translations of each
# other: where the answer is an English word, the Norwegian stimulus word stays
# Norwegian in the `en` prompt too, so an English-reading pupil is not handed
# the answer.
#
# Most goals at this checkpoint are about listening, singing and speaking. Four
# of the eleven are recorded as not assessable for that reason.
#
# Questions here are ours, not Udir's. The competence goals they test are quoted
# verbatim elsewhere; nothing in this file is official curriculum text.
---
subject: ENG01-06
goal_set: KV1030

items:
  # KM13330 - letter sounds, spelling patterns, blending sounds into words.
  - id: KM13330-01
    goal: KM13330
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Hvilket engelsk ord begynner med samme lyd som «sun»?
      en: Which English word begins with the same sound as “sun”?
    choices:
      - id: a
        text:
          nb: "sock"
          en: "sock"
        correct: true
      - id: b
        text:
          nb: "moon"
          en: "moon"
      - id: c
        text:
          nb: "tree"
          en: "tree"
    explanation:
      nb: >-
        «sun» og «sock» begynner begge med bokstaven s og lyden /s/. «moon»
        begynner med /m/ og «tree» med /t/.
      en: >-
        “sun” and “sock” both begin with the letter s and the sound /s/. “moon”
        begins with /m/ and “tree” with /t/.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13330-02
    goal: KM13330
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Trekk lydene sammen til et ord - /d/ /o/ /g/. Hvilket engelsk ord blir det?
      en: Blend the sounds into a word - /d/ /o/ /g/. Which English word is it?
    choices:
      - id: a
        text:
          nb: "dig"
          en: "dig"
      - id: b
        text:
          nb: "dog"
          en: "dog"
        correct: true
      - id: c
        text:
          nb: "bag"
          en: "bag"
    explanation:
      nb: >-
        Lydene kommer i rekkefølgen d - o - g. Når vi trekker dem sammen, blir
        det ordet dog.
      en: >-
        The sounds come in the order d - o - g. Blended together they make the
        word dog.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  # KM13334 - noticing high-frequency words and phrases in texts.
  - id: KM13334-01
    goal: KM13334
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: "Hvilket ord mangler? «I ___ seven years old.»"
      en: "Which word is missing? “I ___ seven years old.”"
    choices:
      - id: a
        text:
          nb: "am"
          en: "am"
        correct: true
      - id: b
        text:
          nb: "is"
          en: "is"
      - id: c
        text:
          nb: "are"
          en: "are"
    explanation:
      nb: >-
        Etter I sier vi alltid am. «I am seven years old» er en frase du møter
        ofte i engelske tekster.
      en: >-
        After I we always say am. “I am seven years old” is a phrase you meet
        often in English texts.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13334-02
    goal: KM13334
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hvilket av disse vanlige engelske ordene betyr «jeg»?
      en: Which of these common English words means «jeg»?
    choices:
      - id: a
        text:
          nb: "you"
          en: "you"
      - id: b
        text:
          nb: "I"
          en: "I"
        correct: true
      - id: c
        text:
          nb: "he"
          en: "he"
    explanation:
      nb: >-
        I betyr jeg, og skrives alltid med stor bokstav på engelsk. you betyr
        du, og he betyr han.
      en: >-
        I means «jeg», and in English it is always written with a capital
        letter. you means «du» and he means «han».
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  # KM13332 - asking and answering simple questions, following simple
  # instructions, using some polite expressions.
  - id: KM13332-01
    goal: KM13332
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Du får en gave av en venn. Hva sier du på engelsk?
      en: A friend gives you a present. What do you say in English?
    choices:
      - id: a
        text:
          nb: "Good night!"
          en: "Good night!"
      - id: b
        text:
          nb: "Thank you!"
          en: "Thank you!"
        correct: true
      - id: c
        text:
          nb: "Sit down!"
          en: "Sit down!"
    explanation:
      nb: >-
        Thank you betyr takk. Good night sier vi når noen skal legge seg, og
        sit down er en beskjed om å sette seg ned.
      en: >-
        Thank you is what you say when someone gives you something. Good night
        is for bedtime, and sit down is an instruction to take a seat.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13332-02
    goal: KM13332
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: "Noen spør deg: «What is your name?» Hvilket svar passer?"
      en: "Someone asks you: “What is your name?” Which answer fits?"
    choices:
      - id: a
        text:
          nb: "I am fine, thank you."
          en: "I am fine, thank you."
      - id: b
        text:
          nb: "My name is Ida."
          en: "My name is Ida."
        correct: true
      - id: c
        text:
          nb: "It is a cat."
          en: "It is a cat."
    explanation:
      nb: >-
        Spørsmålet handler om hva du heter, og da svarer vi «My name is …».
        «I am fine» er svaret på «How are you?».
      en: >-
        The question asks what you are called, so the answer starts “My name
        is …”. “I am fine” answers “How are you?” instead.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  # KM13335 - noticing words shared between English and other languages the
  # pupil knows.
  - id: KM13335-01
    goal: KM13335
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: Det engelske ordet «house» ligner på et norsk ord. Hvilket?
      en: The English word “house” looks like one Norwegian word. Which one?
    choices:
      - id: a
        text:
          nb: "hest"
          en: "hest"
      - id: b
        text:
          nb: "hus"
          en: "hus"
        correct: true
      - id: c
        text:
          nb: "hage"
          en: "hage"
    explanation:
      nb: >-
        house og hus høres nesten like ut og betyr det samme. Mange engelske og
        norske ord er slik i slekt.
      en: >-
        house and the Norwegian «hus» sound almost the same and mean the same
        thing. Many English and Norwegian words are related like this.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13335-02
    goal: KM13335
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hvilket engelsk ord ligner mest på det norske ordet «sommer»?
      en: Which English word looks most like the Norwegian word «sommer»?
    choices:
      - id: a
        text:
          nb: "winter"
          en: "winter"
      - id: b
        text:
          nb: "summer"
          en: "summer"
        correct: true
      - id: c
        text:
          nb: "morning"
          en: "morning"
    explanation:
      nb: >-
        summer og sommer skiller seg bare med én bokstav. Når et engelsk ord
        ligner på et du kan fra før, er det ofte en god hjelp til å gjette
        betydningen.
      en: >-
        summer and «sommer» differ by a single letter. When an English word
        resembles one you already know, that resemblance often gives away the
        meaning.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  # KM13336 - listening to, reading and talking about the content of simple
  # texts. Only the reading half can be checked here.
  - id: KM13336-01
    goal: KM13336
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: "Les setningen: «Tom has a red ball.» Hvilken farge har ballen?"
      en: "Read the sentence: “Tom has a red ball.” What colour is the ball?"
    choices:
      - id: a
        text:
          nb: "Rød"
          en: "Red"
        correct: true
      - id: b
        text:
          nb: "Blå"
          en: "Blue"
      - id: c
        text:
          nb: "Grønn"
          en: "Green"
    explanation:
      nb: Ordet red står rett foran ball, og red betyr rød.
      en: The word red comes right before ball, and red is the colour rød.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13336-02
    goal: KM13336
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: "Les setningen: «The cat is under the table.» Hvor er katten?"
      en: "Read the sentence: “The cat is under the table.” Where is the cat?"
    choices:
      - id: a
        text:
          nb: "På bordet"
          en: "On the table"
      - id: b
        text:
          nb: "Under bordet"
          en: "Under the table"
        correct: true
      - id: c
        text:
          nb: "Bak døra"
          en: "Behind the door"
    explanation:
      nb: >-
        under betyr under. Hadde det stått on the table, ville katten vært oppå
        bordet.
      en: >-
        under tells you the cat is beneath the table. If the sentence said on
        the table, the cat would be up on top of it.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  # KM13339 - reading and experimenting with writing known words, phrases and
  # simple sentences. The writing half is not checkable here; recognising
  # correct spelling and word order is.
  - id: KM13339-01
    goal: KM13339
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: Hvilket ord er stavet riktig på engelsk?
      en: Which word is spelled correctly in English?
    choices:
      - id: a
        text:
          nb: "hous"
          en: "hous"
      - id: b
        text:
          nb: "howse"
          en: "howse"
      - id: c
        text:
          nb: "house"
          en: "house"
        correct: true
    explanation:
      nb: >-
        house skrives med o, u, s og e til slutt. På engelsk er det ofte flere
        bokstaver enn lyder i et ord.
      en: >-
        house is written with o, u, s and a final e. English words often have
        more letters than sounds.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13339-02
    goal: KM13339
    type: multiple_choice
    difficulty: 3
    prompt:
      nb: Hvilken setning har ordene i riktig rekkefølge?
      en: Which sentence has the words in the right order?
    choices:
      - id: a
        text:
          nb: "I like apples."
          en: "I like apples."
        correct: true
      - id: b
        text:
          nb: "Like I apples."
          en: "Like I apples."
      - id: c
        text:
          nb: "Apples like I."
          en: "Apples like I."
    explanation:
      nb: >-
        På engelsk kommer den som gjør noe først, så hva hun gjør, og så resten.
        Derfor blir det I like apples.
      en: >-
        In English the one doing something comes first, then what they do, then
        the rest. That gives I like apples.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  # KM13337 - words and cultural knowledge through English-language children's
  # literature and children's culture. Kept to songs and rhymes that are part of
  # ordinary Norwegian English teaching at this age.
  - id: KM13337-01
    goal: KM13337
    type: multiple_choice
    difficulty: 1
    prompt:
      nb: "Hvilket ord mangler i barnesangen? «Twinkle, twinkle, little ___»"
      en: "Which word is missing from the children's song? “Twinkle, twinkle,
        little ___”"
    choices:
      - id: a
        text:
          nb: "car"
          en: "car"
      - id: b
        text:
          nb: "star"
          en: "star"
        correct: true
      - id: c
        text:
          nb: "moon"
          en: "moon"
    explanation:
      nb: >-
        Sangen handler om en stjerne, og star betyr stjerne. star rimer også på
        car, men det er stjernen som blinker i sangen.
      en: >-
        The song is about a star. star also rhymes with car, but it is the star
        that twinkles.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  - id: KM13337-02
    goal: KM13337
    type: multiple_choice
    difficulty: 2
    prompt:
      nb: I sangen «Old MacDonald Had a Farm» er det et dyr som sier «moo». Hvilket
        dyr er det?
      en: In the song “Old MacDonald Had a Farm” one animal says “moo”. Which
        animal is it?
    choices:
      - id: a
        text:
          nb: "a cow"
          en: "a cow"
        correct: true
      - id: b
        text:
          nb: "a duck"
          en: "a duck"
      - id: c
        text:
          nb: "a pig"
          en: "a pig"
    explanation:
      nb: >-
        cow betyr ku, og kua sier moo i sangen. Anda (duck) sier quack, og
        grisen (pig) sier oink.
      en: >-
        cow is the animal that says moo in the song. The duck says quack and the
        pig says oink.
    reviewed: true
    reviewed_by: 'maintainer-reviewed 2026-07-22'

  # --- answered with the hands: the sound slide and dialogue
  # (`pensum.items.primitives`). Drafts, not yet reviewed. The choices on a
  # slide are meanings in the pupil's own language, so hearing the word and
  # picking its spelling is never enough.

  - id: KM13330-03
    goal: KM13330
    type: blend
    stage: pictorial
    difficulty: 1
    prompt:
      nb: Trykk på bokstavene og hør lydene. Skyv dem sammen. Hva betyr ordet?
      en: Tap the letters to hear their sounds. Slide them together. What does the word mean?
    activity:
      alt:
        nb: Tre bokstavbrikker, sh, i og p, og en skinne de kan skyves sammen på.
        en: Three letter tiles, sh, i and p, and a slide they can be pushed together on.
      language: en
      tiles:
        - text: sh
          say: shh
        - text: i
          say: ih
        - text: p
          say: puh
      choices:
        - id: a
          text:
            nb: et skip
            en: a big boat
        - id: b
          text:
            nb: en sau
            en: a farm animal with wool
        - id: c
          text:
            nb: en butikk
            en: a place where you buy things
      answer: a
    explanation:
      nb: >-
        Sh – i – p blir ship, som betyr skip. Sh er to bokstaver, men bare én
        lyd.
      en: >-
        Sh – i – p makes "ship", a big boat. "Sh" is two letters but only one
        sound.
    reviewed: false

  - id: KM13330-04
    goal: KM13330
    type: blend
    stage: pictorial
    difficulty: 2
    prompt:
      nb: Trykk på bokstavene og hør lydene. Skyv dem sammen. Hva betyr ordet?
      en: Tap the letters to hear their sounds. Slide them together. What does the word mean?
    activity:
      alt:
        nb: Fire bokstavbrikker, ch, i, p og s, og en skinne de kan skyves sammen på.
        en: Four letter tiles, ch, i, p and s, and a slide they can be pushed together on.
      language: en
      tiles:
        - text: ch
          say: tch
        - text: i
          say: ih
        - text: p
          say: puh
        - text: s
          say: sss
      choices:
        - id: a
          text:
            nb: potetgull
            en: thin fried slices of potato
        - id: b
          text:
            nb: en hake
            en: the bottom part of your face
        - id: c
          text:
            nb: ost
            en: a food made from milk
      answer: a
    explanation:
      nb: >-
        Ch – i – p – s blir chips, som betyr potetgull. Ch sies nesten som
        «tsj».
      en: >-
        Ch – i – p – s makes "chips", thin fried slices of potato. "Ch" is one
        sound.
    reviewed: false

  - id: KM13330-05
    goal: KM13330
    type: blend
    stage: pictorial
    difficulty: 3
    prompt:
      nb: Trykk på bokstavene og hør lydene. Skyv dem sammen. Hva betyr ordet?
      en: Tap the letters to hear their sounds. Slide them together. What does the word mean?
    activity:
      alt:
        nb: Tre bokstavbrikker, b, a og th, og en skinne de kan skyves sammen på.
        en: Three letter tiles, b, a and th, and a slide they can be pushed together on.
      language: en
      tiles:
        - text: b
          say: buh
        - text: a
          say: aa
        - text: th
          say: th
      choices:
        - id: a
          text:
            nb: et bad
            en: washing in a tub of water
        - id: b
          text:
            nb: en flaggermus
            en: an animal that flies at night
        - id: c
          text:
            nb: en sti
            en: a narrow way to walk on
      answer: a
    explanation:
      nb: >-
        B – a – th blir bath, som betyr bad. Th er en lyd vi ikke har på norsk:
        tungen ligger mellom tennene.
      en: >-
        B – a – th makes "bath". "Th" is a sound Norwegian does not have: the
        tongue rests between the teeth.
    reviewed: false

  - id: KM13332-03
    goal: KM13332
    type: dialogue
    stage: pictorial
    difficulty: 1
    prompt:
      nb: Du trenger en blyant. Velg hva du sier til Sam.
      en: You need a pencil. Choose what you say to Sam.
    activity:
      alt:
        nb: En samtale mellom deg og Sam. Sam sier «Hi! Are you OK?».
        en: A conversation between you and Sam. Sam says "Hi! Are you OK?".
      language: en
      partner:
        nb: Sam
        en: Sam
      start: hello
      nodes:
        hello:
          says:
            nb: Hi! Are you OK?
            en: Hi! Are you OK?
          options:
            - text:
                nb: Hi! Can I borrow a pencil, please?
                en: Hi! Can I borrow a pencil, please?
              next: lend
            - text:
                nb: Pencil!
                en: Pencil!
              reply:
                nb: Hmm? You can ask with “please”.
                en: Hmm? You can ask with “please”.
        lend:
          says:
            nb: Yes, here you are.
            en: Yes, here you are.
          options:
            - text:
                nb: Thank you!
                en: Thank you!
              next: done
            - text:
                nb: Give me a red one.
                en: Give me a red one.
              reply:
                nb: I only have this one. What do you say?
                en: I only have this one. What do you say?
        done:
          says:
            nb: You're welcome!
            en: You're welcome!
    explanation:
      nb: >-
        «Can I …, please?» er en høflig måte å be om noe på, og «Thank you!» sier
        du når du får det.
      en: >-
        "Can I …, please?" is a polite way to ask for something, and "Thank you!"
        is what you say when you get it.
    reviewed: false

  - id: KM13332-04
    goal: KM13332
    type: dialogue
    stage: pictorial
    difficulty: 2
    prompt:
      nb: Mia snakker til deg i friminuttet. Velg hva du svarer.
      en: Mia talks to you at break time. Choose what you answer.
    activity:
      alt:
        nb: En samtale mellom deg og Mia. Mia sier «Hello! How are you?».
        en: A conversation between you and Mia. Mia says "Hello! How are you?".
      language: en
      partner:
        nb: Mia
        en: Mia
      start: hello
      nodes:
        hello:
          says:
            nb: Hello! How are you?
            en: Hello! How are you?
          options:
            - text:
                nb: I'm fine, thank you. And you?
                en: I'm fine, thank you. And you?
              next: play
            - text:
                nb: Seven.
                en: Seven.
              reply:
                nb: Seven? I asked how you are. You can say “I'm fine, thank you.”
                en: Seven? I asked how you are. You can say “I'm fine, thank you.”
            - text:
                nb: My name is.
                en: My name is.
              reply:
                nb: Sorry? I asked how you are.
                en: Sorry? I asked how you are.
        play:
          says:
            nb: I'm fine too. Do you want to play?
            en: I'm fine too. Do you want to play?
          options:
            - text:
                nb: Yes, please!
                en: Yes, please!
              next: bye
            - text:
                nb: No, thank you.
                en: No, thank you.
              next: bye
            - text:
                nb: Play is fine too.
                en: Play is fine too.
              reply:
                nb: Hmm? You can say “Yes, please!” or “No, thank you.”
                en: Hmm? You can say “Yes, please!” or “No, thank you.”
        bye:
          says:
            nb: OK! See you later!
            en: OK! See you later!
    explanation:
      nb: >-
        «How are you?» spør hvordan du har det. Et vanlig svar er «I'm fine, thank
        you». Både «Yes, please» og «No, thank you» er høflige svar.
      en: >-
        "How are you?" asks how you feel. A usual answer is "I'm fine, thank
        you". "Yes, please" and "No, thank you" are both polite answers.
    reviewed: false

# Goals that no written question can honestly test. At this checkpoint most of
# the subject lives in the ear and the mouth, so this list is long by design.
not_assessable:
  - goal: KM13338
    reason: >-
      Asks the pupil to use digital resources to experience the language through
      authentic language models and conversation partners. It names a way of
      working with English, not knowledge; a question could only ask whether the
      pupil had done the activity, which is the teacher's observation to make.

  - goal: KM13329
    reason: >-
      Asks the pupil to listen to and recognise speech sounds and syllables in
      words. Recognition happens by ear. A written question would show the
      pupil the letters instead, which turns a listening task into a reading
      task and tests the wrong thing.

  - goal: KM13331
    reason: >-
      Asks the pupil to listen to and explore the English alphabet and
      pronunciation patterns through play and song. Both the activity and what
      it produces are spoken and heard; a quiz on paper cannot reach either, and
      pronunciation is explicitly not something we test.

  - goal: KM13333
    reason: >-
      Asks the pupil to take part in rehearsed dialogues and spontaneous
      conversations about their own needs, feelings, daily life and interests.
      Participation is the whole goal. A question could at best check that the
      pupil recognises a phrase, which is not the same as being able to use it
      with another person.
