      nob: Jeg skriver for hånd raskt og lesbart.
      eng: I write by hand quickly and clearly.
    teacher:
      nob: "Skriver en side for hånd i jevnt tempo, og den er lett å lese. Ikke ennå: blir sliten eller uleselig etter noen linjer."
      eng: "Writes a page by hand at an even pace and it is easy to read. Not yet: tires or becomes illegible after a few lines."
    stages: [concrete]
    misconceptions: []
    assessable: false

