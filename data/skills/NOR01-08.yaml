    checkpoint: 7
    refs: [KM14172]
    needs: [nor.decoding.spell-by-sound]
    i_can:
      nob: Jeg kan høre forskjell på kj-lyden og skj-lyden.
      eng: I can hear the kj sound and the skj sound apart.
    teacher:
      nob: "Staver kjole, kino, skjorte og ski riktig. Ikke ennå: blander kj og skj, eller skriver sj for alt."
      eng: "Spells kjole, kino, skjorte and ski correctly. Not yet: mixes up kj and skj, or writes sj for all of them."
