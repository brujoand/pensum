# Skills for norsk (NOR01-08): the smallest things a teacher would note about a
# pupil, grouped into the strands of docs/design/subjects/norsk.md. Every goal in
# the curriculum is in some skill's refs; goals the design lists as missions get
# skills with assessable: false.
# Live only where an administrator approves it, on that instance's review page.
subject: NOR01-08
strands:
  - id: decoding
    title: {nob: "Lyder, bokstaver og avkoding", eng: "Sounds, letters and decoding"}
  - id: reading
    title: {nob: Leseflyt og leseforståelse, eng: Reading fluency and comprehension}
  - id: handwriting
    title: {nob: Håndskrift og tastatur, eng: Handwriting and keyboard}
  - id: spelling
    title: {nob: Rettskriving og tegnsetting, eng: Spelling and punctuation}
  - id: grammar
    title: {nob: Ord og grammatikk, eng: Words and grammar}
  - id: writing
    title: {nob: Å skrive tekster, eng: Writing texts}
  - id: literature
    title: {nob: Litteratur og tolkning, eng: Literature and interpretation}
  - id: sources
    title: {nob: Kilder og kritisk lesing, eng: Sources and critical reading}
  - id: language
    title: {nob: Språket rundt oss, eng: Language around us}
  - id: talking
    title: {nob: "Samtale, lytting og presentasjon", eng: "Talking, listening and presenting"}

skills:
  # ---- etter 2. trinn -------------------------------------------------------

  - id: nor.decoding.hear-rhymes
    strand: decoding
    checkpoint: 2
    refs: [KM14145]
    needs: []
    i_can:
      nob: Jeg kan høre om to ord rimer.
      eng: I can hear whether two words rhyme.
    teacher:
      nob: "Sorterer bilder av ord som rimer på hus (mus, lus) fra dem som ikke gjør det, bare ved å høre. Ikke ennå: sorterer etter hva bildene betyr (hus og hytte sammen)."
      eng: "Sorts pictures of words that rhyme with hus (mus, lus) from those that do not, by ear alone. Not yet: sorts by meaning (hus goes with hytte)."
    stages: [concrete, pictorial]
    misconceptions: [rhyme-by-meaning]
    assessable: true

  - id: nor.decoding.clap-syllables
    strand: decoding
    checkpoint: 2
    refs: [KM14145]
    needs: []
    i_can:
      nob: Jeg kan klappe stavelsene i et ord.
      eng: I can clap the syllables in a word.
    teacher:
      nob: "Klapper so-mmer-fugl i tre og sier at ordet har tre deler. Ikke ennå: klapper én gang per ord, eller én gang per bokstav."
      eng: "Claps sommerfugl as three beats and says the word has three parts. Not yet: claps once per word, or once per letter."
    stages: [concrete, pictorial]
    misconceptions: []
    assessable: true

  - id: nor.decoding.hear-sounds-in-words
    strand: decoding
    checkpoint: 2
    refs: [KM14145]
    needs: [nor.decoding.clap-syllables]
    i_can:
      nob: Jeg kan høre første, siste og midterste lyd i et ord.
      eng: I can hear the first, last and middle sound.
    teacher:
      nob: "Sier at sol starter med s-lyden og slutter med l-lyden, og at o er i midten. Ikke ennå: sier bokstavnavnet (ess) i stedet for lyden, eller hører bare første lyd."
      eng: "Says that sol starts with the s sound, ends with the l sound, and has o in the middle. Not yet: gives the letter name (ess) instead of the sound, or hears only the first sound."
    stages: [concrete, pictorial]
    misconceptions: [letter-name-for-sound]
    assessable: true

  - id: nor.decoding.count-sounds
    strand: decoding
    checkpoint: 2
    refs: [KM14146]
    needs: [nor.decoding.hear-sounds-in-words]
    i_can:
      nob: Jeg kan telle lydene i et kort ord.
      eng: I can count the sounds in a short word.
    teacher:
      nob: "Skyver én brikke i en boks for hver lyd i sol og får tre. Ikke ennå: teller stavelser eller bokstaver i stedet for lyder."
      eng: "Pushes one counter into a box for each sound in sol and gets three. Not yet: counts syllables or letters instead of sounds."
    stages: [concrete, pictorial]
    misconceptions: [counts-letters-not-sounds]
    assessable: true

  - id: nor.decoding.letter-sounds
    strand: decoding
    checkpoint: 2
    refs: [KM14146]
    needs: []
    i_can:
      nob: Jeg vet hvilken lyd hver bokstav har.
      eng: I know the sound each letter makes.
    teacher:
      nob: "Sier lyden til de vanlige bokstavene raskt når hun ser dem, i GraphoGame-rekkefølgen og ikke alfabetet. Ikke ennå: sier bokstavnavnet, eller blander b og d."
      eng: "Says the sound for the common letters quickly on sight, learned in frequency order rather than alphabetical. Not yet: says the letter name, or mixes up b and d."
    stages: [concrete, pictorial, abstract]
    misconceptions: [letter-name-for-sound, reverses-b-d]
    assessable: true

  - id: nor.decoding.blend-words
    strand: decoding
    checkpoint: 2
    refs: [KM14146]
    needs: [nor.decoding.letter-sounds, nor.decoding.count-sounds]
    i_can:
      nob: Jeg kan trekke lyder sammen til et ord.
      eng: I can blend sounds together into a word.
    teacher:
      nob: "Leser korte lydrette ord som sol, mat og bil ved å trekke lydene sammen. Ikke ennå: gjetter ordet ut fra første bokstav eller bildet."
      eng: "Reads short regular words such as sol, mat and bil by blending the sounds. Not yet: guesses the word from its first letter or from the picture."
    stages: [concrete, pictorial, abstract]
    misconceptions: [guesses-from-first-letter, guesses-from-picture]
    assessable: true

  - id: nor.decoding.spell-by-sound
    strand: decoding
    checkpoint: 2
    refs: [KM14146]
    needs: [nor.decoding.letter-sounds, nor.decoding.count-sounds]
    i_can:
      nob: Jeg kan skrive korte ord slik de høres.
      eng: I can write short words the way they sound.
    teacher:
      nob: "Skriver sol, mus og bil riktig etter diktat, med én bokstav per lyd. Ikke ennå: skriver bare første bokstav, eller hopper over vokalen (sl for sol)."
      eng: "Writes sol, mus and bil from dictation, one letter per sound. Not yet: writes only the first letter, or leaves out the vowel (sl for sol)."
    stages: [concrete, pictorial, abstract]
    misconceptions: [drops-vowel]
    assessable: true

  - id: nor.reading.answer-from-text
    strand: reading
    checkpoint: 2
    refs: [KM14140]
    needs: [nor.decoding.blend-words]
    i_can:
      nob: Jeg kan finne svaret på hvem, hva og hvor i teksten.
      eng: I can find who, what and where in a text.
    teacher:
      nob: "Leser en kort tekst og peker på setningen som sier hvem som var med. Ikke ennå: svarer ut fra det hun vet fra før, ikke fra teksten."
      eng: "Reads a short text and points to the sentence that says who was there. Not yet: answers from what she already knows rather than from the text."
    stages: [pictorial, abstract]
    misconceptions: [answers-from-prior-knowledge]
    assessable: true

  - id: nor.reading.predict-from-cover
    strand: reading
    checkpoint: 2
    refs: [KM14140]
    needs: []
    i_can:
      nob: Jeg kan gjette hva en bok handler om fra forsiden.
      eng: I can guess what a book is about from its cover.
    teacher:
      nob: "Bruker bildet og tittelen til å si hva teksten kanskje handler om, før hun leser. Ikke ennå: begynner å lese uten å se på tittel eller bilde."
      eng: "Uses the picture and title to say what the text might be about before reading. Not yet: starts reading without looking at the title or picture."
    stages: [pictorial]
    misconceptions: []
    assessable: true

  - id: nor.reading.story-order
    strand: reading
    checkpoint: 2
    refs: [KM14140]
    needs: []
    i_can:
      nob: Jeg kan sette det som skjedde i riktig rekkefølge.
      eng: I can put what happened in the right order.
    teacher:
      nob: "Legger fire bilder fra en fortelling hun nettopp har hørt eller lest i riktig rekkefølge. Ikke ennå: legger det mest spennende bildet først."
      eng: "Orders four picture panels from a story she has just heard or read. Not yet: puts the most exciting panel first."
    stages: [pictorial]
    misconceptions: []
    assessable: true

  - id: nor.reading.library-book
    strand: reading
    checkpoint: 2
    refs: [KM14151]
    needs: []
    i_can:
      nob: Jeg kan låne en bok på biblioteket og lese den.
      eng: I can borrow a library book and read it.
    teacher:
      nob: "Låner en bok hun har valgt og skriver tittelen i leseloggen. Ikke ennå: trenger en voksen til å velge og låne for seg."
      eng: "Borrows a book she chose and writes its title in her reading log. Not yet: needs an adult to choose and borrow for her."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.handwriting.form-letters
    strand: handwriting
    checkpoint: 2
    refs: [KM14147]
    needs: []
    i_can:
      nob: Jeg kan skrive alle bokstavene, store og små.
      eng: I can write every letter, capital and small.
    teacher:
      nob: "Former alle bokstavene med riktig startpunkt og retning. Ikke ennå: starter bokstaver nedenfra, eller speilvender b, d og j."
      eng: "Forms every letter from the right starting point and in the right direction. Not yet: starts letters from the bottom, or mirrors b, d and j."
    stages: [concrete, pictorial]
    misconceptions: [reverses-b-d]
    assessable: true

  - id: nor.handwriting.type-words
    strand: handwriting
    checkpoint: 2
    refs: [KM14147]
    needs: [nor.decoding.spell-by-sound]
    i_can:
      nob: Jeg kan skrive ord på tastaturet.
      eng: I can type words on a keyboard.
    teacher:
      nob: "Finner bokstavene på tastaturet og skriver navnet sitt og korte ord, med mellomrom. Ikke ennå: leter lenge etter hver tast, eller glemmer mellomrom."
      eng: "Finds letters on the keyboard and types her name and short words, with spaces. Not yet: hunts for every key, or leaves out spaces."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.spelling.capital-full-stop
    strand: spelling
    checkpoint: 2
    refs: [KM14144]
    needs: []
    i_can:
      nob: Jeg kan starte en setning med stor bokstav og slutte med punktum.
      eng: I can begin with a capital and end with a full stop.
    teacher:
      nob: "Bygger en setning med stor forbokstav og punktum, og bruker stor bokstav på navn. Ikke ennå: setter stor bokstav midt i ord, eller punktum etter hvert ord."
      eng: "Builds a sentence with a capital first letter and a full stop, and capitalises names. Not yet: puts capitals mid-word, or a full stop after every word."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true

  - id: nor.spelling.question-exclamation
    strand: spelling
    checkpoint: 2
    refs: [KM14144]
    needs: [nor.spelling.capital-full-stop]
    i_can:
      nob: Jeg vet når jeg skal bruke spørsmålstegn og utropstegn.
      eng: I know when to use a question mark or exclamation mark.
    teacher:
      nob: "Setter spørsmålstegn etter Hvor bor du og utropstegn etter Pass deg. Ikke ennå: bruker punktum etter alt."
      eng: "Puts a question mark after Hvor bor du and an exclamation mark after Pass deg. Not yet: uses a full stop after everything."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true

  - id: nor.grammar.compound-words
    strand: grammar
    checkpoint: 2
    refs: [KM14148]
    needs: []
    i_can:
      nob: Jeg kan sette to ord sammen til et nytt ord.
      eng: I can join two words into a new word.
    teacher:
      nob: "Bygger fotball av fot og ball, og sier at en fotball er en slags ball. Ikke ennå: tror sammensatte ord betyr begge delene likt (en fotball er en fot)."
      eng: "Builds fotball from fot and ball and says a fotball is a kind of ball. Not yet: thinks the compound means both parts equally (a fotball is a foot)."
    stages: [concrete, pictorial, abstract]
    misconceptions: [compound-head-first]
    assessable: true

  - id: nor.grammar.word-meanings
    strand: grammar
    checkpoint: 2
    refs: [KM14148]
    needs: []
    i_can:
      nob: Jeg kan finne ord som betyr nesten det samme.
      eng: I can find words that mean nearly the same.
    teacher:
      nob: "Parer glad med blid og stor med diger, og kan si hva et nytt uttrykk betyr ut fra delene. Ikke ennå: parer ord som hører sammen i en situasjon (katt og mus)."
      eng: "Matches glad with blid and stor with diger, and can say what a new expression means from its parts. Not yet: pairs words that belong together in a scene (cat and mouse)."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true

  - id: nor.writing.beginning-and-end
    strand: writing
    checkpoint: 2
    refs: [KM14143]
    needs: [nor.reading.story-order]
    i_can:
      nob: Jeg kan fortelle noe med en begynnelse og en slutt.
      eng: I can tell something with a beginning and an end.
    teacher:
      nob: "Ordner kortene begynnelse, noe skjer og slutt, og forteller en kort hendelse etter dem. Ikke ennå: forteller og så, og så, og så uten å avslutte."
      eng: "Orders the beginning, something-happens and ending cards and tells a short event from them. Not yet: tells and then, and then, and then with no ending."
    stages: [pictorial]
    misconceptions: []
    assessable: true

  - id: nor.writing.write-short-account
    strand: writing
    checkpoint: 2
    refs: [KM14143]
    needs: [nor.writing.beginning-and-end, nor.decoding.spell-by-sound]
    i_can:
      nob: Jeg kan skrive noen setninger om noe som har skjedd.
      eng: I can write a few sentences about something that happened.
    teacher:
      nob: "Skriver to eller tre setninger om en hendelse, én per kort i fortellingsstigen. Ikke ennå: skriver enkeltord i stedet for setninger."
      eng: "Writes two or three sentences about an event, one per story-ladder card. Not yet: writes single words instead of sentences."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.writing.text-and-pictures
    strand: writing
    checkpoint: 2
    refs: [KM14152]
    needs: []
    i_can:
      nob: Jeg kan lage en tekst med både ord og bilder.
      eng: I can make a text with both words and pictures.
    teacher:
      nob: "Lager en side der tegningen og setningen forteller om det samme. Ikke ennå: tegningen og teksten handler om hver sin ting."
      eng: "Makes a page where the drawing and the sentence tell about the same thing. Not yet: the drawing and the text are about different things."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.literature.story-questions
    strand: literature
    checkpoint: 2
    refs: [KM14139]
    needs: []
    i_can:
      nob: Jeg kan svare på spørsmål om en fortelling jeg har hørt.
      eng: I can answer questions about a story I heard.
    teacher:
      nob: "Svarer på hvem, hva og hvorfor om en fortelling eller en faktatekst som er lest høyt. Ikke ennå: svarer om noe hun selv har opplevd i stedet."
      eng: "Answers who, what and why about a story or factual text read aloud. Not yet: answers about something from her own life instead."
    stages: [pictorial]
    misconceptions: [answers-from-prior-knowledge]
    assessable: true

  - id: nor.literature.hear-nynorsk
    strand: literature
    checkpoint: 2
    refs: [KM14139]
    needs: [nor.literature.story-questions]
    i_can:
      nob: Jeg forstår en fortelling på nynorsk.
      eng: I understand a story told in nynorsk.
    teacher:
      nob: "Svarer like godt på spørsmål om en fortelling på nynorsk som på bokmål. Ikke ennå: sier at hun ikke forstår fordi ordene er annerledes."
      eng: "Answers questions about a story in nynorsk as well as about one in bokmål. Not yet: says she cannot understand because the words look different."
    stages: [pictorial]
    misconceptions: []
    assessable: true

  - id: nor.literature.creative-response
    strand: literature
    checkpoint: 2
    refs: [KM14141]
    needs: [nor.literature.story-questions]
    i_can:
      nob: Jeg kan tegne, spille eller bygge noe fra en fortelling.
      eng: I can draw, act or build something from a story.
    teacher:
      nob: "Lager en tegning, en lek eller en figur fra fortellingen og viser den til noen. Ikke ennå: lager noe som ikke har med fortellingen å gjøre."
      eng: "Makes a drawing, a play or a model from the story and shows it to someone. Not yet: makes something unrelated to the story."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.language.spoken-and-written
    strand: language
    checkpoint: 2
    refs: [KM14150]
    needs: [nor.decoding.letter-sounds]
    i_can:
      nob: Jeg vet at vi ofte sier ord annerledes enn vi skriver dem.
      eng: I know we often say words differently from how we write them.
    teacher:
      nob: "Parer det hun sier (jæ, dæ) med ordene jeg og deg. Ikke ennå: tror at hun har skrevet feil når ordet ikke ser ut som hun sier det."
      eng: "Matches what she says (jæ, dæ) with the written words jeg and deg. Not yet: thinks a word is wrong when it does not look the way she says it."
    stages: [pictorial, abstract]
    misconceptions: [spells-as-dialect]
    assessable: true

  - id: nor.language.words-affect-others
    strand: language
    checkpoint: 2
    refs: [KM14149]
    needs: []
    i_can:
      nob: Jeg kan si hvordan ord kan gjøre andre glade eller lei seg.
      eng: I can say how words can make others happy or sad.
    teacher:
      nob: "Finner to måter å si det samme på, en snill og en sur, og sier hvordan den andre ville ha det. Ikke ennå: mener at det bare er det man gjør som betyr noe."
      eng: "Finds two ways to say the same thing, one kind and one unkind, and says how the listener would feel. Not yet: says only what you do matters, not what you say."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.talking.take-turns
    strand: talking
    checkpoint: 2
    refs: [KM14142]
    needs: []
    i_can:
      nob: Jeg kan lytte og vente på tur i en samtale.
      eng: I can listen and wait for my turn in a talk.
    teacher:
      nob: "Følger turkortet: lytter, gjentar det partneren sa, og legger til én ting. Ikke ennå: snakker i munnen på andre eller svarer på noe annet."
      eng: "Follows the turn card: listens, repeats what the partner said, adds one thing. Not yet: talks over others or answers something else."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.talking.give-a-reason
    strand: talking
    checkpoint: 2
    refs: [KM14142]
    needs: [nor.talking.take-turns]
    i_can:
      nob: Jeg kan si hva jeg mener og hvorfor.
      eng: I can say what I think and why.
    teacher:
      nob: "Sier en mening med et fordi: Jeg liker vinter fordi jeg kan ake. Ikke ennå: sier bare meningen, eller bare fordi."
      eng: "Gives an opinion with a because: I like winter because I can go sledging. Not yet: gives only the opinion, or just says because."
    stages: [concrete]
    misconceptions: []
    assessable: false

  # ---- etter 4. trinn -------------------------------------------------------

  - id: nor.reading.read-fluently
    strand: reading
    checkpoint: 4
    refs: [KM14164]
    needs: [nor.decoding.blend-words]
    i_can:
      nob: Jeg kan lese en tekst for trinnet mitt uten å stoppe opp.
      eng: I can read a text for my year without stopping.
    teacher:
      nob: "Leser en tekst på eget nivå høyt i jevnt tempo, med pauser ved punktum. Ikke ennå: lyderer mange vanlige ord, eller leser over punktum."
      eng: "Reads an age-level text aloud at an even pace, pausing at full stops. Not yet: still sounds out many common words, or reads through full stops."
    stages: [abstract]
    misconceptions: []
    assessable: true

  - id: nor.reading.find-the-sentence
    strand: reading
    checkpoint: 4
    refs: [KM14164]
    needs: [nor.reading.answer-from-text]
    i_can:
      nob: Jeg kan finne setningen som svarer på spørsmålet.
      eng: I can find the sentence that answers the question.
    teacher:
      nob: "Trykker på setningen som viser svaret før hun velger svaret. Ikke ennå: velger riktig svar, men trykker på en setning som ikke viser det."
      eng: "Taps the sentence that shows the answer before choosing it. Not yet: picks the right answer but taps a sentence that does not show it."
    stages: [abstract]
    misconceptions: [answers-from-prior-knowledge]
    assessable: true

  - id: nor.reading.summarise
    strand: reading
    checkpoint: 4
    refs: [KM14164]
    needs: [nor.reading.story-order, nor.reading.find-the-sentence]
    i_can:
      nob: Jeg kan si det viktigste i en tekst med to setninger.
      eng: I can give the main point of a text in two sentences.
    teacher:
      nob: "Velger eller skriver et sammendrag som tar med det viktigste og ikke detaljene. Ikke ennå: gjenforteller alt, eller bare begynnelsen."
      eng: "Chooses or writes a summary that keeps the main point and drops the details. Not yet: retells everything, or only the beginning."
    stages: [abstract]
    misconceptions: [summary-as-retelling]
    assessable: true

  - id: nor.reading.choose-library-book
    strand: reading
    checkpoint: 4
    refs: [KM14166]
    needs: [nor.reading.library-book]
    i_can:
      nob: Jeg kan velge en bok som passer for meg.
      eng: I can choose a book that suits me.
    teacher:
      nob: "Velger en bok ut fra det hun liker og hvor godt hun leser, og skriver den i leseloggen. Ikke ennå: velger bare etter forsiden, og gir opp bøker som er for vanskelige."
      eng: "Picks a book by interest and reading level and logs it. Not yet: picks by cover only and abandons books that are too hard."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.handwriting.joined-handwriting
    strand: handwriting
    checkpoint: 4
    refs: [KM14156]
    needs: [nor.handwriting.form-letters]
    i_can:
      nob: Jeg kan skrive en håndskrift som andre kan lese.
      eng: I can write by hand so others can read it.
    teacher:
      nob: "Skriver lesbart og jevnt, med bokstavene bundet der det passer. Ikke ennå: bokstavene er ulike store, eller andre må spørre hva det står."
      eng: "Writes legibly and evenly, joining letters where it fits. Not yet: letters vary in size, or others have to ask what it says."
    stages: [concrete, pictorial]
    misconceptions: []
    assessable: true

  - id: nor.handwriting.type-short-texts
    strand: handwriting
    checkpoint: 4
    refs: [KM14156]
    needs: [nor.handwriting.type-words]
    i_can:
      nob: Jeg kan skrive en kort tekst på tastaturet.
      eng: I can type a short text on a keyboard.
    teacher:
      nob: "Skriver noen setninger på tastatur med stor bokstav, punktum og mellomrom. Ikke ennå: skriver alt med små bokstaver fordi hun ikke finner shift."
      eng: "Types a few sentences with capitals, full stops and spaces. Not yet: types everything in lower case because she cannot find shift."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.spelling.commas
    strand: spelling
    checkpoint: 4
    refs: [KM14157]
    needs: [nor.spelling.question-exclamation]
    i_can:
      nob: Jeg kan sette komma mellom ting i en oppramsing.
      eng: I can put commas between things in a list.
    teacher:
      nob: "Setter komma i epler, pærer og bananer, og foran men. Ikke ennå: setter komma der hun ville tatt pause, eller ikke i det hele tatt."
      eng: "Puts commas in epler, pærer og bananer and before men. Not yet: puts a comma wherever she would pause, or nowhere."
    stages: [pictorial, abstract]
    misconceptions: [comma-at-every-pause]
    assessable: true

  - id: nor.spelling.speech-marks-colon
