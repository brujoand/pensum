    i_can:
      nob: Jeg staver, bøyer og setter tegn riktig på hovedmålet mitt.
      eng: I spell, inflect and punctuate correctly in my main written form.
    teacher:
      nob: "Leverer tekster på hovedmålet med få feil i rettskriving, bøyning og tegnsetting, og retter selv. Ikke ennå: gjør de samme feilene tekst etter tekst."
      eng: "Hands in texts in her main written form with few spelling, inflection or punctuation errors, and corrects herself. Not yet: repeats the same errors text after text."
    stages: [abstract]
    misconceptions: [misses-double-consonant, spells-silent-letters-by-sound]
    assessable: true

  - id: nor.spelling.correct-sidemal
    strand: spelling
    checkpoint: 10
    refs: [KM14191]
    needs: [nor.language.try-sidemal, nor.spelling.inflect-correctly]
    i_can:
      nob: Jeg staver og bøyer riktig på sidemålet mitt.
      eng: I spell and inflect correctly in my second written form.
    teacher:
      nob: "Skriver nynorsk med riktige former som kva, eg, ikkje og bøyer substantiv riktig (jenter, bøker). Ikke ennå: bruker bokmålsformer der nynorsk har egne."
      eng: "Writes nynorsk with correct forms such as kva, eg, ikkje and inflects nouns correctly. Not yet: uses bokmål forms where nynorsk has its own."
