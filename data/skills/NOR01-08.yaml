      eng: "Builds hoppet from hopp and et, and knows gå becomes gikk. Not yet: adds -et to every verb (gået)."
    stages: [pictorial, abstract]
    misconceptions: [overregularises-past]
    assessable: true

  - id: nor.grammar.inflect-nouns-adjectives
    strand: grammar
    checkpoint: 4
    refs: [KM14159]
    needs: [nor.grammar.name-word-classes]
    i_can:
      nob: Jeg kan bøye substantiv og adjektiv.
      eng: I can change nouns and adjectives to fit.
    teacher:
      nob: "Skriver en bil, bilen, biler, bilene og en stor bil, to store biler. Ikke ennå: glemmer å bøye adjektivet (to stor biler)."
      eng: "Writes en bil, bilen, biler, bilene and en stor bil, to store biler. Not yet: leaves the adjective unchanged (to stor biler)."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true

  - id: nor.grammar.talk-about-sentences
    strand: grammar
    checkpoint: 4
    refs: [KM14159]
    needs: [nor.grammar.name-word-classes]
    i_can:
      nob: Jeg kan bruke ordene verb og substantiv når jeg snakker om setninger.
      eng: I can use verb and noun when talking about sentences.
    teacher:
      nob: "Sier at en setning mangler et verb, eller at hun vil bytte ut et adjektiv. Ikke ennå: sier bare at det høres rart ut."
      eng: "Says a sentence is missing a verb, or that she wants to swap an adjective. Not yet: only says it sounds odd."
    stages: [abstract]
    misconceptions: []
    assessable: true

  - id: nor.writing.retell-in-order
    strand: writing
    checkpoint: 4
    refs: [KM14162]
    needs: [nor.writing.beginning-and-end]
    i_can:
      nob: Jeg kan gjenfortelle noe i riktig rekkefølge.
      eng: I can retell something in the right order.
    teacher:
      nob: "Ordner hendelser og beskrivelser i en rekkefølge som en leser kan følge. Ikke ennå: hopper fram og tilbake i tid uten å si det."
      eng: "Orders events and descriptions so a reader can follow them. Not yet: jumps back and forth in time without saying so."
    stages: [pictorial, abstract]
    misconceptions: []
    assessable: true

  - id: nor.writing.describe-and-give-reasons
    strand: writing
    checkpoint: 4
    refs: [KM14162]
    needs: [nor.writing.retell-in-order, nor.talking.give-a-reason]
    i_can:
      nob: Jeg kan beskrive noe og begrunne hva jeg mener skriftlig.
      eng: I can describe something and give reasons in writing.
    teacher:
      nob: "Skriver en beskrivelse med detaljer og en mening med minst én begrunnelse. Ikke ennå: skriver bare at noe er fint eller dumt."
      eng: "Writes a description with details and an opinion with at least one reason. Not yet: writes only that something is nice or stupid."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.writing.multimedia-poster
    strand: writing
    checkpoint: 4
    refs: [KM14155]
    needs: [nor.writing.text-and-pictures]
    i_can:
      nob: Jeg kan lage en plakat med bilder og tekst.
      eng: I can make a poster with pictures and text.
    teacher:
      nob: "Lager en plakat der overskrift, bilde og tekst virker sammen. Ikke ennå: bildene er pynt uten sammenheng med teksten."
      eng: "Makes a poster where heading, picture and text work together. Not yet: the pictures are decoration unrelated to the text."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.literature.what-text-means
    strand: literature
    checkpoint: 4
    refs: [KM14153]
    needs: [nor.literature.story-questions]
    i_can:
      nob: Jeg kan si hva en tekst betyr for meg, og hvorfor.
      eng: I can say what a text means to me, and why.
    teacher:
      nob: "Sier hva en fortelling, et dikt eller en oversatt tekst fikk henne til å tenke på, og peker på noe i teksten. Ikke ennå: sier bare at den var bra."
      eng: "Says what a story, poem or translated text made her think of, and points to something in it. Not yet: only says it was good."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.literature.present-a-text
    strand: literature
    checkpoint: 4
    refs: [KM14158]
    needs: [nor.literature.creative-response]
    i_can:
      nob: Jeg kan vise fram en tekst gjennom lek, drama eller tegning.
      eng: I can show a text through play, drama or drawing.
    teacher:
      nob: "Lager noe fra en tekst og forklarer hvilken del av teksten det viser. Ikke ennå: kan ikke si hva i teksten det bygger på."
      eng: "Makes something from a text and explains which part of the text it shows. Not yet: cannot say what in the text it is based on."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.sources.fact-or-opinion
    strand: sources
    checkpoint: 4
    refs: [KM14163]
    needs: [nor.reading.answer-from-text]
    i_can:
      nob: Jeg kan skille en mening fra et faktum.
      eng: I can tell an opinion from a fact.
    teacher:
      nob: "Sorterer Hunden er fire år og Hunder er de beste dyrene riktig. Ikke ennå: kaller alt hun er enig i for fakta."
      eng: "Sorts The dog is four years old and Dogs are the best animals correctly. Not yet: calls anything she agrees with a fact."
    stages: [abstract]
    misconceptions: [agreement-as-fact]
    assessable: true

  - id: nor.language.compare-languages
    strand: language
    checkpoint: 4
    refs: [KM14168]
    needs: []
    i_can:
      nob: Jeg kan finne like ord på norsk og andre språk.
      eng: I can find similar words in Norwegian and other languages.
    teacher:
      nob: "Parer skole med school og Schule, og sier hva som er likt og ulikt. Ikke ennå: tror ord som ser like ut alltid betyr det samme."
      eng: "Matches skole with school and Schule and says what is alike and what differs. Not yet: assumes words that look alike always mean the same."
    stages: [pictorial, abstract]
    misconceptions: [trusts-false-friends]
    assessable: true

  - id: nor.language.bokmal-or-nynorsk
    strand: language
    checkpoint: 4
    refs: [KM14161]
    needs: [nor.literature.hear-nynorsk]
    i_can:
      nob: Jeg kan se om et ord er bokmål eller nynorsk.
      eng: I can tell whether a word is bokmål or nynorsk.
    teacher:
      nob: "Sorterer ikke og ikkje, hvem og kven, og parer dem. Ikke ennå: tror nynorsk er feilstavet bokmål."
      eng: "Sorts ikke and ikkje, hvem and kven, and pairs them. Not yet: thinks nynorsk is misspelled bokmål."
    stages: [pictorial, abstract]
    misconceptions: [nynorsk-as-misspelling]
    assessable: true

  - id: nor.language.local-dialects
    strand: language
    checkpoint: 4
    refs: [KM14165]
    needs: [nor.language.spoken-and-written]
    i_can:
      nob: Jeg kan finne ut hvordan folk rundt meg sier ord.
      eng: I can find out how people around me say words.
    teacher:
      nob: "Spør en voksen hvordan hen sier tre ord, og skriver dem ned. Ikke ennå: sier at andre snakker feil."
      eng: "Asks an adult how they say three words and writes them down. Not yet: says other people talk wrong."
    stages: [concrete]
    misconceptions: []
    assessable: false

  - id: nor.language.adapt-to-situation
    strand: language
    checkpoint: 4
    refs: [KM14160]
    needs: [nor.language.words-affect-others]
